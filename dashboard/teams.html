<!DOCTYPE html>

<meta charset="UTF-8">

<title>Team Profiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Light canvas, surfaces, lines, text and the font tokens are in theme.css.
   This page declared no font tokens at all, so ten font: shorthands that used
   them were invalid and rendered as inherited body type; they resolve now.
   Light accent is the shared brand accent, so the tints below match it. */
:root{--accent-dim:rgba(239,1,7,.07);--accent-glow:rgba(239,1,7,.18);
 --elite:#16a34a;--above:#4ade80;--avg:#d4a017;--below:#f97316;--poor:#dc2626;
 --style-hi:#2563eb;--style-low:#d97706;--shadow:0 1px 3px rgba(0,0,0,.07)}
html.dark{--accent:#D8B384;--accent-dim:rgba(216,179,132,.12);--accent-glow:rgba(216,179,132,.28);
 --bg:#101319;--bg2:#191d25;--bg3:#222732;--surface:rgba(255,255,255,.035);--surface2:rgba(255,255,255,.07);
 --border:#2c313d;--border2:#414957;--text:#f4f6fb;--text2:#c3cde2;--text3:#9aa7c2;
 --elite:#34d399;--above:#6ee7a8;--avg:#fbbf24;--below:#fb923c;--poor:#f87171;
 --style-hi:#60a5fa;--style-low:#fbbf24;--shadow:0 1px 3px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
/* Header base is in shell.css. These are this page's differences from it. */
.hdr-logo{font:800 13px/1 'Inter';color:#12141a}
.tabs{min-width:0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.lnk{background:var(--surface);border:1px solid var(--border);color:var(--text2);font:500 11px/1 'Inter';padding:6px 12px;border-radius:6px;cursor:pointer;text-decoration:none;white-space:nowrap}
.lnk:hover{background:var(--surface2);color:var(--text)}
.lnk.acc{background:var(--accent-dim);border-color:var(--accent-glow);color:var(--accent)}
select.lnk{background:var(--bg3);color:var(--text);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px!important}
select.lnk:focus{border-color:var(--accent);outline:none}
select option,.sel option{background:var(--bg2);color:var(--text)}
.wrap{flex:1;display:flex;overflow:hidden}
.side{width:250px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-search{margin:10px 10px 4px;width:calc(100% - 20px);background:var(--bg);border:1px solid var(--border);color:var(--text);font:500 11px/1 Inter,sans-serif;padding:8px 9px;border-radius:6px;outline:none}
.side-search:focus{border-color:var(--accent)}
.side.hide{display:none}
.plist{flex:1;overflow-y:auto;padding:6px}
/* Team rail. The name is the row; the match count is a footnote to it, so it
   drops a type step, loses weight and sits on the muted colour. These were
   written with literal font stacks while this page declared no font tokens;
   theme.css declares them for every page now, so they are tokens again. */
/* Picking a team from the sidebar is an action on this page, so it is a real
   button, reset back to how the row looked as a div. */
.pitem{padding:8px 11px;border-radius:6px;cursor:pointer;display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left}
.pitem:hover{background:var(--surface)}
.pitem.on{background:var(--accent-dim);box-shadow:inset 2px 0 0 var(--accent)}
.pitem:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pitem-nm{font:600 13px/1.3 var(--f-body);letter-spacing:-.01em;color:var(--text);
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem.on .pitem-nm{font-weight:800}
.pitem-meta{font:500 9.5px/1.3 var(--f-mono);
  color:var(--text3);font-variant-numeric:tabular-nums;letter-spacing:-.01em;flex-shrink:0}
.pitem:hover .pitem-meta,.pitem.on .pitem-meta{color:var(--text2)}
.main{flex:1;overflow-y:auto;padding:13px 18px}
.empty{height:100%;display:grid;place-items:center;color:var(--text3);font:500 13px/1 'Inter'}
.tcard{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;gap:22px;flex-wrap:wrap;box-shadow:var(--shadow)}
.tname{font:800 27px/1.08 var(--f-display);letter-spacing:-.025em}
.tmeta{font:500 11px/1.5 'Inter';color:var(--text2);margin-top:5px}
.kpis{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 13px;min-width:120px;flex:1;box-shadow:var(--shadow)}
.kpi-l{font:700 9px/1 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--text3)}
.kpi-v{font:700 23px/1 var(--f-data);letter-spacing:-.03em;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.kpi-s{font:500 9px/1.3 'Inter';color:var(--text3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
.sect{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}
.sect-h{font:700 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:11px;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:170px 66px 1fr 30px;align-items:center;gap:9px;padding:4px 0}
.row-lbl{font:500 11.5px/1.3 var(--f-body);color:var(--text2);cursor:help;border-bottom:1px dotted var(--border2);justify-self:start}

/* Profile stats open the league ranking for that metric. A real button, so
   Enter and Space work and the row can say where it goes; it keeps the .row
   class, so the grid and its narrow-screen override still apply.
   The dotted underline on the label was already there, implying something to
   click that did not exist. Now it is the resting state of a control, and a
   metric with no ranking to open (.row-static) drops it, so the two are told
   apart without relying on colour. */
.row-go{width:calc(100% + 12px);margin:0 -6px;padding:4px 6px;border:0;border-radius:6px;
  background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;
  transition:background-color .12s}
.row-go .row-lbl{cursor:pointer}
.row-go:hover{background:var(--surface)}
.row-go:hover .row-lbl{color:var(--text);border-bottom-style:solid}
.row-go:focus-visible{outline:2px solid var(--accent);outline-offset:1px;background:var(--surface)}
.row-go:focus-visible .row-lbl{color:var(--text);border-bottom-style:solid}
/* One arrow on the row being pointed at, rather than forty on the page at rest. */
.row-go .row-lbl::after{content:' \2192';font-weight:700;opacity:0}
.row-go:hover .row-lbl::after,.row-go:focus-visible .row-lbl::after{opacity:1}
.row-static .row-lbl{border-bottom:0}

/* The six summary bubbles do the same thing. They carry the arrow at rest,
   because unlike the rows they have no underline to inherit. */
.kpi-go{cursor:pointer;font:inherit;color:inherit;text-align:left;
  transition:background-color .12s,border-color .12s}
.kpi-go:hover{background:var(--bg3);border-color:var(--border2)}
.kpi-go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi-go .kpi-l::after{content:' \2192';font-weight:800;opacity:.45}
.kpi-go:hover .kpi-l::after,.kpi-go:focus-visible .kpi-l::after{opacity:1}
@media (prefers-reduced-motion:reduce){.row-go,.kpi-go{transition:none}}
.row-val{font:500 11px/1 var(--f-data);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar-f{height:100%;border-radius:5px}
.row-pct{font:700 11px/1 var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font:500 11px/1.4 'Inter'}
th{text-align:left;font:700 9px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:8px 9px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);cursor:pointer;white-space:nowrap}
th:hover{color:var(--text)}
td{padding:7px 9px;border-bottom:1px solid var(--border)}
/* A team name in the rankings table opens that team's profile, so it is a real
   button. The cell gives up its padding to the button so the button fills the
   whole cell: the click target stays the size it was when the handler sat on
   the td, and the text lands in the same place. */
.tname-cell{padding:0}
.tname-go{display:block;width:100%;border:0;background:none;padding:7px 9px;font:inherit;color:inherit;
  font-weight:700;text-align:left;cursor:pointer}
.tname-go:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tr:hover td{background:var(--surface)}
.num{text-align:right;font-family:var(--f-data);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.legend{display:flex;gap:12px;margin-top:12px;padding-top:11px;border-top:1px solid var(--border);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:5px;font:500 10px/1 'Inter';color:var(--text3)}
.dot{width:8px;height:8px;border-radius:50%}
.foot{margin-top:12px;font:500 10px/1.6 'Inter';color:var(--text3)}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.tip{position:fixed;pointer-events:none;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:6px 9px;font:600 11px/1.3 'Inter';box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:50;display:none;color:var(--text)}
.pitch-box{height:calc(100vh - 416px);min-height:230px;max-height:640px}
.viz-eyebrow{font:700 8.5px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.viz-title{font:700 16px/1.1 var(--f-display);letter-spacing:-.02em;color:var(--text);margin-bottom:6px}
.viz-sub{font:500 10px/1.45 var(--f-body);color:var(--text3);margin:0 0 7px;max-width:82ch}
.orient-note{font:700 8px/1.2 'Inter';letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:-1px 0 7px}
.viz-leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;padding-top:9px;border-top:1px solid var(--border);font:500 10px/1 'Inter';color:var(--text3)}
.viz-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.viz-leg b{font-weight:700;color:var(--text2)}
.shot-key{display:inline-flex;align-items:center;gap:5px}
.shot-key svg{width:13px;height:13px;overflow:visible;flex:none}
.vz-tog{display:flex;gap:4px;margin:0 0 10px;background:var(--surface);border-radius:7px;padding:3px;flex-wrap:wrap}
.vz-tog.sm{margin:0}
.vz-tog.sm .vzb{font-size:9.5px;padding:5px 9px}
.vz-filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 10px}
.vz-flabel{font:700 8.5px/1 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--text3)}
.vzb{background:none;border:none;color:var(--text3);font:600 10px/1 'Inter';padding:6px 10px;border-radius:5px;cursor:pointer}
.vzb:hover{color:var(--text)}
.vzb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vzb.on{color:var(--text);background:var(--bg3);box-shadow:var(--shadow)}
.split2{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;align-items:start}
@media(max-width:1150px){.split2{grid-template-columns:1fr}}
@media(max-width:820px){
  body{overflow:auto}.hdr{height:auto;min-height:52px;flex-wrap:wrap;padding:8px 10px}.tabs{order:3;width:100%;overflow-x:auto;margin-left:0}
  .hdr-right{flex-wrap:wrap;justify-content:flex-end;row-gap:5px}
  .wrap{display:block;overflow:visible}.side{width:100%;height:auto;max-height:38vh;border-right:0;border-bottom:1px solid var(--border)}
  .plist{max-height:30vh}.main{overflow:visible;padding:10px}.grid,.split2{grid-template-columns:minmax(0,1fr)!important}.grid>*,.split2>*,.sect{min-width:0}
  .pitch-box{height:auto;min-height:0;aspect-ratio:111.5/74}.row{grid-template-columns:minmax(110px,1fr) 54px minmax(70px,1fr) 28px}
  .vz-filters,.vz-tog{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.vzb{flex:0 0 auto;min-height:36px}
}
.mrow{cursor:pointer}
.mrow:hover td{background:var(--accent-dim)}
.wl{display:inline-block;width:17px;height:17px;border-radius:4px;font:700 9px/17px 'Inter';text-align:center;color:#0d0f14}

.lgpick{flex-shrink:0}

/* Selects: the open option list is drawn by the browser on a white base, so a
   translucent surface colour plus light text renders as white on white. Force an
   opaque background and colour the options explicitly. */
select{background-color:var(--bg2,var(--panel,#1a1d24));color:var(--text,#f4f6fb)}
select option,select optgroup{background-color:var(--bg2,var(--panel,#1a1d24));color:var(--text,#f4f6fb)}

/* Sequence output: grouped tiles on a uniform grid. The old version put 22 tiles in one
   flex row, which truncated labels and gave no sense of which numbers belong together. */
.sgrp{padding:12px 14px 4px;border-top:1px solid var(--border)}
.sgrp:first-of-type{border-top:none}
.sgrp-h{font:700 10px/1 var(--mono,monospace);letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:9px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sgrp-d{font:400 11px/1.4 Inter,sans-serif;letter-spacing:0;text-transform:none;color:var(--text3)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;padding-bottom:10px}
.stile{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:9px 10px}
.stile-l{font:500 9.5px/1.35 Inter,sans-serif;color:var(--text3);min-height:26px}
.stile-v{font:700 20px/1.1 Inter,sans-serif;letter-spacing:-.02em;margin-top:3px}
.stile-z{font:600 9px/1 var(--mono,monospace);color:var(--text3);margin-top:3px;opacity:.75}
.seqwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.dev-legend{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 14px;
  font:600 9.5px/1 Inter,sans-serif;color:var(--text3)}
.dev-key{display:inline-flex;align-items:center;gap:5px}.dev-key i{display:block;width:12px;height:7px;border-radius:2px}
.dev-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dev-group{border:1px solid var(--border);border-radius:7px;padding:10px 11px;background:var(--bg3)}
.dev-group-h{font:700 9px/1 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--text3);margin-bottom:8px}
.dev-row{display:grid;grid-template-columns:minmax(105px,1.05fr) minmax(120px,1.25fr) 54px;gap:8px;align-items:center;padding:5px 0}
.dev-lbl{font:500 10px/1.25 Inter,sans-serif;color:var(--text2)}
.dev-track{height:10px;background:var(--surface2);border-radius:5px;position:relative;overflow:hidden}
.dev-zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--text2);opacity:.7}
.dev-fill{position:absolute;top:1px;height:8px;border-radius:4px;min-width:1px}
.dev-val{text-align:right;font:700 9.5px/1.15 var(--f-data);color:var(--text)}
.dev-z{display:block;font-size:8px;color:var(--text3);margin-top:2px}
@media(max-width:900px){.dev-groups{grid-template-columns:1fr}.dev-row{grid-template-columns:minmax(100px,1fr) minmax(110px,1.25fr) 52px}}
.mobile-rank-note{display:none}
@media(max-width:640px){.ranking-chart{display:none}.mobile-rank-note{display:block}}
.as-of{font:500 9.5px/1.2 var(--f-data,monospace);color:var(--text3);white-space:nowrap}
.as-of.warn{color:var(--gold,#d4a017)}
</style>

<div class="hdr page-hdr">
  <div class="hdr-logo">T</div>
  <div class="hdr-id"><div class="hdr-title">Team Profiles</div><div class="hdr-row"><div id="lgPick" class="lgpick"></div><div class="hdr-sub" id="hdrSub">loading&hellip;</div><span class="as-of" id="asOf"></span></div></div>

</div>
<div class="wrap">

</div>

<script>
const SB='https://xrsilhiffjoulyoqhdmp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhyc2lsaGlmZmpvdWx5b3FoZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Nzc5NDAsImV4cCI6MjEwMDI1Mzk0MH0.3_ccOJi0SBKOwHGxhJL3fsWCSSLoxZumzt-KH4wO8OU';
const HD={'apikey':AK,'Authorization':'Bearer '+AK};
const TABS=['Profile','Sequences','Maps','Rankings','League Map','Matches','Squad'];
/* Site destinations, grouped for the header nav menu. Third field is the group. */
const NAV=[['Home','index.html','explore'],['Insights','insights.html','explore'],['Search','search.html','explore'],
 ['Match','match.html','explore'],['Players','players.html','explore'],['Sequences','sequences.html','explore'],
 ['Guide','guide.html','learn'],['Method','methodology.html','learn'],['Reference','glossary.html','learn']];
let TEAMS=[],TDEFS=[],SEL=null,TAB='Profile',PCT={},PLAYERS=[],TEAMQ='';
let DIR={},LEAGUES=[],LG=(function(){try{return localStorage.getItem('leagueScope')||'ALL'}catch(e){return 'ALL'}})();
let LM={x:'ppda',y:'field_tilt'};
let MP={kind:'passes',third:'',lane:'',outcome:'ok',mode:'pattern',defMode:'wins'};
const TEAM_DISPLAY={'Chicago':'Chicago Fire FC','Colorado':'Colorado Rapids','Columbus':'Columbus Crew',
 'Houston':'Houston Dynamo FC','Kansas City':'Sporting Kansas City','Montreal':'CF Montréal',
 'New England':'New England Revolution','New York':'New York Red Bulls','Philadelphia':'Philadelphia Union',
 'Portland':'Portland Timbers','Salt Lake':'Real Salt Lake','San Jose':'San Jose Earthquakes',
 'Seattle':'Seattle Sounders FC','Toronto':'Toronto FC','Vancouver':'Vancouver Whitecaps',
 'L.A. Galaxy':'LA Galaxy'};
function tname(t){return TEAM_DISPLAY[t]||t||''}
const TPAL={ok:'var(--viz-positive)',fail:'var(--viz-negative)',pass:'var(--viz-positive)',prog:'var(--viz-progress)',carry:'var(--viz-carry)',box:'var(--viz-box)'};
let RKT={metric:'ppda'};
let ZONES=null,CZONES=null,TSHOTS=null,ZTEAM=null,BUILD=null,LANES=null;

async function sbAll(t,p){p=p||{};const PG=1000;let all=[],off=0;
  while(true){const u=new URL(SB+'/rest/v1/'+t);
    Object.keys(p).forEach(function(k){u.searchParams.set(k,p[k])});
    const r=await fetch(u,{headers:Object.assign({},HD,{'Range':off+'-'+(off+PG-1),'Range-Unit':'items'})});
    if(!r.ok)throw new Error(t+' '+r.status);const d=await r.json();
    if(!Array.isArray(d)||!d.length)break;all=all.concat(d);if(d.length<PG)break;off+=PG;}
  return all;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function tier(p){if(p==null)return{c:'var(--text3)'};if(p>=80)return{c:'var(--elite)'};
  if(p>=60)return{c:'var(--above)'};if(p>=40)return{c:'var(--avg)'};if(p>=20)return{c:'var(--below)'};return{c:'var(--poor)'}}
function fmt(v,u){if(v==null)return'\u2014';return (+v).toLocaleString(undefined,{maximumFractionDigits:2})+(u==='%'?'%':(u==='m'?' m':''))}
function tdefOf(k){for(var i=0;i<TDEFS.length;i++)if(TDEFS[i].key===k)return TDEFS[i];return null}
function teamOf(n){for(var i=0;i<TEAMS.length;i++)if(TEAMS[i].team===n)return TEAMS[i];return null}
function lgOf(t){return (DIR[t]&&DIR[t].league)||null}
function lgName(code){
  for(var i=0;i<LEAGUES.length;i++)if(LEAGUES[i].league===code)return LEAGUES[i].display_name;
  return code||'League unavailable';
}
function lgScopeLabel(){return LG==='ALL'?'All leagues':lgName(LG)}
/* Every list, ranking and map is scoped to the chosen league. Percentiles and ranks
   are already computed within league in the database, so mixing them on screen would
   misrepresent numbers that were never comparable. */
function inScope(t){return LG==='ALL'||lgOf(t)===LG}
function scopedTeams(){return TEAMS.filter(function(t){return inScope(t.team)})}
function updateHdr(){
  var n=scopedTeams().length;
  var label=(LG==='ALL')?(LEAGUES.length+' leagues'):lgName(LG);

}
function renderLeaguePicker(){

function setLeague(v){
  LG=v;
  try{localStorage.setItem('leagueScope',v)}catch(e){}
  if(SEL&&!inScope(SEL)){var f=scopedTeams()[0];SEL=f?f.team:null}
  renderList();updateHdr();draw();
}

async function init(){
  try{
    const r=await Promise.all([
      sbAll('mv_team_all',{select:'*',order:'team.asc'}),
      sbAll('team_metric_defs',{select:'*',order:'grp_order.asc,sort_order.asc'}),
      sbAll('mv_team_percentiles',{select:'team,metric,value,pct'}),
      sbAll('mv_team_buildup',{select:'*'}),
      sbAll('mv_team_lanes',{select:'*'}),
      sbAll('v_team_directory',{select:'team,league,league_name,teams_in_league'}),
      sbAll('v_league_summary',{select:'league,display_name,matches,teams'})
    ]);
    TEAMS=r[0];TDEFS=r[1];
    PCT={};r[2].forEach(function(x){if(!PCT[x.team])PCT[x.team]={};PCT[x.team][x.metric]=x});
    BUILD={};(r[3]||[]).forEach(function(b){BUILD[b.team]=b});
    LANES={};(r[4]||[]).forEach(function(l){if(!LANES[l.team])LANES[l.team]={};LANES[l.team][l.lane]=l});
    DIR={};(r[5]||[]).forEach(function(d){DIR[d.team]=d});
    LEAGUES=(r[6]||[]).filter(function(l){return l.teams>0});
    if(LEAGUES.length===1)LG=LEAGUES[0].league;
    else if(LG!=='ALL'&&!LEAGUES.some(function(l){return l.league===LG}))LG='ALL';
    const qt=new URLSearchParams(location.search).get('team');
    if(qt&&teamOf(qt)){
      SEL=qt;
      if(LG!=='ALL'&&!inScope(SEL))LG=lgOf(SEL)||'ALL';
    }else{
      // This page always shows one team, so it needs a selection. Take the
      // first in the current scope rather than a hardcoded club. SEL is also
      // the Rankings highlight, so both stop defaulting to one club.
      SEL=(scopedTeams()[0]||{}).team||null;
    }
    renderLeaguePicker();renderTabs();renderList();wireTips();updateHdr();draw();
  }catch(e){document.getElementById('main').innerHTML='<div class="empty">Failed to load: '+esc(e.message)+'</div>'}
}
/* Page tabs only. Site nav moved to the header menu, so this strip holds seven
   targets instead of sixteen and no longer needs to be scrolled to be used. */
function renderTabs(){document.getElementById('tabs').innerHTML=
  TABS.map(function(t){
    return '<button type="button" class="tab'+(TAB===t?' on':'')+'" aria-pressed="'+(TAB===t)+'" '+
      'onclick="setTab(\''+t+'\')">'+t+'</button>'}).join('');
  syncTabCue()}
function setTab(t){TAB=t;renderTabs();

  draw();}
function renderList(){
  var q=TEAMQ.trim().toLowerCase();

    return tname(a.team).localeCompare(tname(b.team))});

    return '<button type="button" class="pitem'+(SEL===t.team?' on':'')+'"'+

}
/* One match is not "1 matches". Both forms of the count read from here. */
function mcount(n){n=+n||0;return n+' match'+(n===1?'':'es')}
function acrossMatches(n){n=+n||0;return n===1?'across the single match':('across all '+n+' matches')}
function pick(t){SEL=t;renderList();draw()}
/* Select a team and land on its Profile tab. The rankings table uses this; it
   is the same four calls that were inlined on the cell. */
function openProfile(t){SEL=t;TAB='Profile';renderTabs();renderList();draw()}

async function draw(){
  const main=document.getElementById('main');
  if(TAB==='League Map')return renderLeagueMap();
  if(!SEL)return;
  const t=teamOf(SEL);if(!t)return;
  if(TAB==='Rankings')return renderRankings();
  if(TAB==='Profile')return renderProfile(t);
  if(TAB==='Sequences')return renderSequences(t);
  main.innerHTML='<div class="spin"></div>';
  if(TAB==='Maps')return renderMaps(t);
  if(TAB==='Matches')return renderMatches(t);
  if(TAB==='Squad')return renderSquad(t);
}
/* Every profile stat is a way into the ranking for that metric. A metric is
   only offered if it is in the ranking's own option list, which is built from
   TDEFS; nothing is mapped or substituted, so a metric with no counterpart
   simply is not a control. */
function rankable(key){return !!(key&&tdefOf(key))}
function rankBy(key){
  if(!rankable(key))return;
  RKT.metric=key;
  setTab('Rankings');   /* switches tab, redraws the strip, and calls draw() */
}
function goAttrs(key,label){
  return ' type="button" onclick="rankBy(\''+esc(key).replace(/'/g,"\\'")+'\')"'+
    ' aria-label="Rank all teams by '+esc(String(label||'').toLowerCase())+'"';
}
/* One metric row, used by the profile panels and by the channel block, so the
   two cannot drift apart. */
function metricRow(d,r){
  const pc=r?+r.pct:null,tc=tier(pc),go=rankable(d.key);
  const body='<div class="row-lbl">'+esc(d.label)+'</div>'+
    '<div class="row-val">'+(r?fmt(r.value,d.unit):'\u2014')+'</div>'+
    '<div class="bar"><div class="bar-f" style="width:'+(pc==null?0:pc)+'%;background:'+tc.c+'"></div></div>'+
    '<div class="row-pct" style="color:'+tc.c+'">'+(pc==null?'':pc)+'</div>';
  const tip=' title="'+esc(d.definition||'')+'"';
  return go
    ? '<button class="row row-go"'+tip+goAttrs(d.key,d.label)+'>'+body+'</button>'
    : '<div class="row row-static"'+tip+'>'+body+'</div>';
}
function teamHead(t){
  const p=PCT[t.team]||{};
  const gd=(t.goals_pg-t.goals_against_pg);
  return '<div class="tcard"><div style="flex:1;min-width:230px">'+
    '<div class="tname">'+esc(tname(t.team))+'</div>'+
    '<div class="tmeta">'+esc(lgName(lgOf(t.team)))+' \u00B7 '+mcount(t.matches)+' \u00B7 '+(+t.goals_pg).toFixed(2)+' scored / '+
    (+t.goals_against_pg).toFixed(2)+' conceded per game \u00B7 GD '+(gd>=0?'+':'')+gd.toFixed(2)+'</div></div></div>'+
    '<div class="kpis">'+
    kpi('Possession',(+t.possession_pct).toFixed(1)+'%',p.possession_pct,'','possession_pct')+
    kpi('Field tilt',(+t.field_tilt).toFixed(1)+'%',p.field_tilt,'','field_tilt')+
    kpi('PPDA',(+t.ppda).toFixed(2),p.ppda,'lower = presses harder','ppda')+
    kpi('Line height',(+t.def_height).toFixed(1),p.def_height,'','def_height')+
    kpi('Directness',(+t.directness).toFixed(2)+' m',p.directness,'','directness')+
    kpi('Shots',(+t.shots_pg).toFixed(1),p.shots_pg,'','shots_pg')+
    '</div>';
}
function kpi(l,v,p,sub,key){
  const c=p?tier(+p.pct).c:'var(--text)',go=rankable(key);
  const body='<div class="kpi-l">'+l+'</div><div class="kpi-v" style="color:'+c+'">'+v+'</div>'+
    '<div class="kpi-s">'+(p?('league percentile '+p.pct):(sub||''))+'</div>';
  return go
    ? '<button class="kpi kpi-go"'+goAttrs(key,l)+'>'+body+'</button>'
    : '<div class="kpi">'+body+'</div>';
}
function renderProfile(t){
  const p=PCT[t.team]||{};
  const groups=[];TDEFS.forEach(function(d){if(groups.indexOf(d.grp)<0)groups.push(d.grp)});
  let h=teamHead(t)+'<div class="grid">';
  groups.filter(function(g){return g!=='Channels'}).forEach(function(g){
    const ms=TDEFS.filter(function(d){return d.grp===g});
    h+='<div class="sect"><div class="sect-h"><span>'+esc(g)+'</span></div>';
    ms.forEach(function(d){h+=metricRow(d,p[d.key])});
    h+='</div>';
  });
  h+='</div>';
  h+='<div class="split2" style="margin-top:12px;grid-template-columns:.8fr 1.2fr">'+
     channelBlock(t)+laneViz(t)+'</div>';
  var pool=(DIR[t.team]&&DIR[t.team].teams_in_league)||scopedTeams().filter(function(x){return lgOf(x.team)===lgOf(t.team)}).length;
  h+=legendHtml()+'<div class="foot">Percentiles are within '+esc(lgName(lgOf(t.team)))+(pool?' ('+pool+' teams)':'')+'. '+
     'PPDA and the conceded metrics are inverted so a high percentile always means better. '+'Channel shares are descriptive, not good or bad \u2014 a high percentile just means they use that side more than most. '+'A possession ends when the opposition touch the ball or play stops for more than eight seconds.</div>';
  document.getElementById('main').innerHTML=h;
}
function metricOpts(sel){let o='',g='';
  TDEFS.forEach(function(d){if(d.grp!==g){if(g)o+='</optgroup>';o+='<optgroup label="'+esc(d.grp)+'">';g=d.grp}
    o+='<option value="'+d.key+'"'+(sel===d.key?' selected':'')+'>'+esc(d.label)+'</option>'});
  return o+'</optgroup>'}
function renderLeagueMap(){
  const dx=tdefOf(LM.x)||{},dy=tdefOf(LM.y)||{};

  const pts=eligible.map(function(t){return{team:t.team,x:+t[LM.x],y:+t[LM.y]}}).filter(function(p){return !isNaN(p.x)&&!isNaN(p.y)});
  if(!pts.length){document.getElementById('main').innerHTML='<div class="sect"><div class="empty" style="height:260px">League Map unavailable until teams reach six matches</div></div>';return}
  const W=1080,H=520,MT=22,MR=34,MB=54,ML=82;
  const xs=pts.map(function(p){return p.x}),ys=pts.map(function(p){return p.y});
  const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  const px=(x1-x0)*.1||1,py=(y1-y0)*.1||1;
  const xmin=x0>=0?Math.max(0,x0-px):x0-px,xmax=x1+px;
  const ymin=y0>=0?Math.max(0,y0-py):y0-py,ymax=y1+py;
  function SX(v){return ML+((v-xmin)/(xmax-xmin))*(W-ML-MR)}
  function SY(v){return H-MB-((v-ymin)/(ymax-ymin))*(H-MT-MB)}
  function med(a){const s=a.slice().sort(function(m,n){return m-n});return s[Math.floor(s.length/2)]}
  const mx=med(xs),my=med(ys);
  let s='<svg role="img" aria-label="Team style scatter plot for the current scope" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-height:calc(100vh - 230px);display:block">';
  // gridlines + tick values
  [0,0.25,0.5,0.75,1].forEach(function(f){

    s+='<text x="'+(ML-10)+'" y="'+(SY(vy)+4)+'" fill="var(--text3)" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">'+(+vy).toFixed(1)+'</text>';
  });
  s+='<line x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'" stroke="var(--border2)"/>';
  s+='<line x1="'+ML+'" y1="'+MT+'" x2="'+ML+'" y2="'+(H-MB)+'" stroke="var(--border2)"/>';
  /* The median guides are reference furniture, so they sit on the neutral label
     colour rather than the brand accent. They used to share --accent with the
     selected team's dot, which made a reference line and a selection read as the
     same thing. They stay dashed, and stronger than the gridlines behind them,
     so the hierarchy is grid, then reference, then data. */
  s+='<line x1="'+SX(mx)+'" y1="'+MT+'" x2="'+SX(mx)+'" y2="'+(H-MB)+'" stroke="var(--text3)" stroke-opacity="0.8" stroke-dasharray="5 4"/>';
  s+='<line x1="'+ML+'" y1="'+SY(my)+'" x2="'+(W-MR)+'" y2="'+SY(my)+'" stroke="var(--text3)" stroke-opacity="0.8" stroke-dasharray="5 4"/>';
  s+='<text x="'+(SX(mx)+5)+'" y="'+(MT+11)+'" fill="var(--text3)" font-size="9" font-weight="700" font-family="Inter">display median</text>';
  if(LM.x==='ppda'&&LM.y==='field_tilt'){
    const q=function(x,y,t,a){s+='<text x="'+x+'" y="'+y+'" text-anchor="'+a+'" fill="var(--text3)" font-size="9" font-weight="700" opacity=".72">'+t+'</text>'};
    q(ML+8,MT+14,'HIGH PRESS + TERRITORY','start'); q(W-MR-8,MT+14,'TERRITORY, LOWER PRESS','end');
    q(ML+8,H-MB-10,'PRESS WITHOUT TERRITORY','start'); q(W-MR-8,H-MB-10,'DEEPER / REACTIVE','end');
  }
  const labelled={};

  [
    pts.reduce(function(a,b){return b.x<a.x?b:a}),
    pts.reduce(function(a,b){return b.x>a.x?b:a}),

  pts.forEach(function(p){

    s+='<circle class="pt" data-n="'+esc(tname(p.team))+'" data-v="'+esc(dx.label)+': '+p.x.toFixed(2)+' · '+esc(dy.label)+': '+p.y.toFixed(2)+
       '" cx="'+cx+'" cy="'+cy+'" r="'+(on?8:5.5)+'" fill="'+(on?'var(--accent)':'var(--above)')+
       '" fill-opacity="'+(on?1:.55)+'"/>';

    '<div style="display:flex;flex-direction:column;gap:5px;min-width:190px"><span class="kpi-l">Y axis</span>'+

    '<div style="display:flex;flex-direction:column;gap:5px;min-width:190px"><span class="kpi-l">Highlight</span>'+
      '<select class="lnk" style="padding:8px 10px;width:100%" onchange="SEL=this.value;renderList();renderLeagueMap()">'+
      eligible.sort(function(a,b){return tname(a.team).localeCompare(tname(b.team))}).map(function(t){return '<option value="'+esc(t.team)+'"'+(SEL===t.team?' selected':'')+'>'+esc(tname(t.team))+'</option>'}).join('')+
      '</select></div></div></div>'+
    '<div class="sect"><div class="viz-eyebrow">Relationship</div><div class="viz-title">'+esc(dy.label)+' vs '+esc(dx.label)+'</div>'+
    '<div class="viz-sub">'+esc(lgScopeLabel())+' · '+pts.length+' eligible teams · raw values · dashed guides are displayed-sample medians.</div>'+s+
    '<div class="foot">'+pts.length+' teams meet the six-match minimum in the current scope'+(scope.length>eligible.length?' · '+(scope.length-eligible.length)+' excluded below threshold':'')+'. The highlighted team and axis extremes are labelled; hover any dot for exact values. '+
    (LM.x==='ppda'&&LM.y==='field_tilt'?'Quadrants are named only for this defensible pairing and describe style, not quality. ':'')+
    'Remember PPDA is inverted in meaning: left means pressing harder.</div></div>';

async function renderMatches(t){

      '<th class="num" style="cursor:default" title="Shots taken">Shots</th>'+
      '<th class="num" style="cursor:default" title="Shots faced">Shots ag.</th>'+

    list.forEach(function(r){

    });
    h+='</tbody></table></div><div class="foot">Match-by-match style. Open any of these in the '+
       '<a href="match.html" style="color:var(--accent)">match dashboard</a> for the full event maps.</div></div>';
    document.getElementById('main').innerHTML=h;

/* Zone test runs on where the action STARTS. Attack is left to right, so with the
   pitch drawn from above the top strip is the attacking team's left. */
function okFilter(a){
  if(MP.outcome==='ok')return a.ok===true;
  if(MP.outcome==='fail')return a.ok===false;
  return true;
}
function outcomeNote(){
  if(MP.outcome==='ok')return'';
  if(MP.outcome==='fail')return' Showing only actions that failed.';
  return' Completed in green; incomplete routes are red and dashed.';
}
function inZone(x,y){
  if(MP.third==='def'&&!(x<33.3))return false;
  if(MP.third==='mid'&&!(x>=33.3&&x<66.7))return false;
  if(MP.third==='att'&&!(x>=66.7))return false;
  // verified from the data: low y is the attacking team's right, high y their left
  if(MP.lane==='R'&&!(y<33.3))return false;
  if(MP.lane==='C'&&!(y>=33.3&&y<66.7))return false;
  if(MP.lane==='L'&&!(y>=66.7))return false;
  return true;
}
function zoneShade(){
  if(!MP.third&&!MP.lane)return'';
  const x0=MP.third==='def'?0:(MP.third==='mid'?33.3:(MP.third==='att'?66.7:0));
  const x1=MP.third==='def'?33.3:(MP.third==='mid'?66.7:(MP.third==='att'?100:100));
  const y0=MP.lane==='R'?0:(MP.lane==='C'?33.3:(MP.lane==='L'?66.7:0));
  const y1=MP.lane==='R'?33.3:(MP.lane==='C'?66.7:(MP.lane==='L'?100:100));
  /* Neutral ink: this marks which zone the filter is on, it does not encode a
     value, and it is not selection state either. */
  return '<rect x="'+PX(x0)+'" y="'+PY0(y0,y1)+'" width="'+PX(x1-x0)+'" height="'+PYH(y0,y1)+
         '" fill="var(--text3)" fill-opacity="0.09"/>';
}
function zoneNote(){
  if(!MP.third&&!MP.lane)return'';
  const t={def:'defensive third',mid:'middle third',att:'final third'}[MP.third]||'';
  const l={L:'left',C:'central',R:'right'}[MP.lane]||'';
  return ' Filtered to '+[l,t].filter(Boolean).join(' ')+(l&&!t?' channel':'')+'.';
}

/* Small hollow ring at the point the action began. Used on the maps where the
   origin carries meaning: progressive passes, box entries and carries. */
function shotMark(x,y,r,c,op,oc){

  if(oc==='off'||oc==='post')
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="0.26" stroke-opacity="'+Math.min(1,op*1.6)+'"/>';
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+c+'" fill-opacity="'+op+'"/>';
}
function shotOutcomeLegend(counts,forTeam){

    blocked:function(c){return '<svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 1.5L14.5 8L8 14.5L1.5 8Z" fill="'+c+'" fill-opacity=".75"/></svg>'},
    post:function(c){return '<svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="'+c+'" stroke-width="2"/></svg>'},

function origin(a,c,w,op){
  const sx=(a.start_x!=null?a.start_x:a.x), sy=(a.start_y!=null?a.start_y:a.y);
  return '<circle cx="'+PX(sx)+'" cy="'+PY(sy)+'" r="'+(w*1.0).toFixed(2)+'" fill="none" stroke="'+c+
    '" stroke-width="'+(w*0.5).toFixed(2)+'" stroke-opacity="'+(op*0.85).toFixed(2)+'"/>';
}
/* Tapered comet, narrow at the origin and full width where the ball arrives. */
function tline(a,c,w,op){
  const x1=PX(a.x),y1=PY(a.y),x2=PX(a.end_x),y2=PY(a.end_y);
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
  const nx=-dy/len, ny=dx/len, t=w*0.16, h=w*0.78;
  const body='<path d="M'+(x1+nx*t).toFixed(2)+' '+(y1+ny*t).toFixed(2)+
    'L'+(x2+nx*h).toFixed(2)+' '+(y2+ny*h).toFixed(2)+
    'L'+(x2-nx*h).toFixed(2)+' '+(y2-ny*h).toFixed(2)+
    'L'+(x1-nx*t).toFixed(2)+' '+(y1-ny*t).toFixed(2)+
    'Z" fill="'+c+'" fill-opacity="'+op+'"/>';
  return body+(c===TPAL.fail?'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+
    '" stroke="'+c+'" stroke-width="'+Math.max(.16,w*.55)+'" stroke-opacity=".9" stroke-dasharray="1.2 .8"/>':'');
}
/* Aggregate season actions into a coarse 6 x 4 grid so the default view shows
   recurring routes, not a hairball of hundreds of individual vectors. */
function flowPattern(items,color,limit){
  const NX=6,NY=4,orig={},flows={};
  function zone(x,y){const ix=Math.max(0,Math.min(NX-1,Math.floor((+x||0)/100*NX)));
    const iy=Math.max(0,Math.min(NY-1,Math.floor((+y||0)/100*NY)));return ix+','+iy}
  function centre(k){const p=k.split(',').map(Number);return{x:(p[0]+.5)*100/NX,y:(p[1]+.5)*100/NY}}
  items.forEach(function(a){
    const sx=a.start_x!=null?a.start_x:a.x,sy=a.start_y!=null?a.start_y:a.y;
    if(sx==null||sy==null||a.end_x==null||a.end_y==null)return;
    const f=zone(sx,sy),t=zone(a.end_x,a.end_y);orig[f]=(orig[f]||0)+1;
    if(f!==t){const k=f+'>'+t;flows[k]=(flows[k]||0)+1}
  });
  const os=Object.keys(orig).sort(),fs=Object.keys(flows).sort(function(a,b){return flows[b]-flows[a]||a.localeCompare(b)}).slice(0,limit||8);
  const om=Math.max.apply(null,os.map(function(k){return orig[k]}).concat([1]));
  const fm=Math.max.apply(null,fs.map(function(k){return flows[k]}).concat([1]));
  let s='<g class="pattern-layer">';
  os.forEach(function(k){const p=centre(k),q=Math.sqrt(orig[k]/om);s+='<circle cx="'+PX(p.x)+'" cy="'+PY(p.y)+
    '" r="'+(1.1+3.2*q).toFixed(2)+'" fill="'+color+'" fill-opacity="'+(0.07+0.16*q).toFixed(2)+'"/>'});
  fs.forEach(function(k,idx){const a=k.split('>'),p=centre(a[0]),q=centre(a[1]),x1=PX(p.x),y1=PY(p.y),x2=PX(q.x),y2=PY(q.y);
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    const w=.45+1.7*Math.sqrt(flows[k]/fm),ah=1.5+w*.65,bx=x2-ux*ah,by=y2-uy*ah;
    s+='<line x1="'+x1.toFixed(2)+'" y1="'+y1.toFixed(2)+'" x2="'+x2.toFixed(2)+'" y2="'+y2.toFixed(2)+
      '" stroke="'+color+'" stroke-width="'+w.toFixed(2)+'" stroke-opacity="'+(.34+.5*flows[k]/fm).toFixed(2)+'" stroke-linecap="round"'+
      (color===TPAL.fail?' stroke-dasharray="1.2 .8"':'')+'/>'+
      '<path d="M'+x2.toFixed(2)+' '+y2.toFixed(2)+'L'+(bx+nx*ah*.55).toFixed(2)+' '+(by+ny*ah*.55).toFixed(2)+
      'L'+(bx-nx*ah*.55).toFixed(2)+' '+(by-ny*ah*.55).toFixed(2)+'Z" fill="'+color+'" fill-opacity=".86"/>';
    if(idx<3){const mx=(x1+x2)/2+nx*1.8,my=(y1+y2)/2+ny*1.8;
      s+='<text x="'+mx.toFixed(2)+'" y="'+(my+.5).toFixed(2)+'" text-anchor="middle" fill="'+color+'" font-size="1.5" font-weight="800" stroke="var(--bg2)" stroke-width=".65" paint-order="stroke">'+flows[k]+'</text>'}
  });
  return s+'</g>';
}
/* Keep explicit event drill-downs responsive across a full season. The sample is
   deterministic and evenly spaced through the returned population; the legend
   continues to report the complete population. */
function mapSample(items,limit){
  if(items.length<=limit)return items;
  const out=[],step=items.length/limit;
  for(let i=0;i<limit;i++)out.push(items[Math.floor(i*step)]);
  return out;
}
function mapSampleNote(all,shown,label){
  return shown.length<all.length?'<span>Displaying '+shown.length.toLocaleString()+' of '+all.length.toLocaleString()+' '+(label||'events')+' · evenly sampled from the returned population · use zone filters to refine</span>':'';
}
function passOutcomeLegend(items,successColor,successLabel){
  const ok=items.filter(function(a){return a.ok}).length,fail=items.length-ok;
  return (ok?'<span><i style="background:'+successColor+'"></i>'+successLabel+' <b>'+ok.toLocaleString()+'</b></span>':'')+
    (fail?'<span><i style="background:'+TPAL.fail+'"></i>Incomplete · dashed <b>'+fail.toLocaleString()+'</b></span>':'');
}
async function renderMaps(t){
  const main=document.getElementById('main');
  main.innerHTML=teamHead(t)+'<div class="sect"><div class="spin"></div>'+
    '<div style="text-align:center;color:var(--text3);font:500 11px/1 Inter">Loading season actions\u2026</div></div>';
  try{
    await loadZones(t.team);
    const m=MAPS.filter(function(x){return x.k===MP.kind})[0]||MAPS[0];
    // Solo view: green succeeded, red failed. Multi view: passes green,
    // progressive blue, carries yellow.
    const G=TPAL.ok,R=TPAL.fail,AC=TPAL.box,B=TPAL.prog,N='var(--text3)',Y=TPAL.carry;
    let inner=zoneShade(),leg='',sampleLeg='';
    const pattern=MP.mode!=='events';
    const hasOutcome=['passes','prog','box'].indexOf(m.k)>=0;

    if(m.k==='passes'){
      const ps=ZONES.filter(function(a){return a.type==='Pass'&&okFilter(a)&&a.end_x!=null&&inZone(a.x,a.y)});
      const shown=pattern?ps:mapSample(ps,1200);
      if(pattern){
        const ok=ps.filter(function(a){return a.ok}),fail=ps.filter(function(a){return !a.ok});
        if(ok.length)inner+=flowPattern(ok,G,9);if(fail.length)inner+=flowPattern(fail,R,5);
      }else shown.forEach(function(a){inner+=tline(a,a.ok?G:R,0.13,a.ok?0.10:0.13)});
      leg=passOutcomeLegend(ps,G,'Completed')+
          (pattern?'<span>Nodes = origin volume \u00B7 arrows = strongest repeated zone flows \u00B7 top three labelled</span>':'<span>Each displayed vector is one event</span>')+mapSampleNote(ps,shown,'pass events');
    }
    else if(m.k==='prog'){
      const ps=ZONES.filter(function(a){return a.prog&&okFilter(a)&&a.end_x!=null&&inZone(a.x,a.y)});
      const shown=pattern?ps:mapSample(ps,1200);
      if(pattern){const ok=ps.filter(function(a){return a.ok}),fail=ps.filter(function(a){return !a.ok});
        if(ok.length)inner+=flowPattern(ok,B,8);if(fail.length)inner+=flowPattern(fail,R,5);
      }else shown.forEach(function(a){const c2=a.ok?B:R;inner+=tline(a,c2,0.22,a.ok?0.42:0.4)+origin(a,c2,0.22,a.ok?0.42:0.4)});
      leg=passOutcomeLegend(ps,B,'Completed progressive')+
        (pattern?'<span>Nodes = origin volume \u00B7 arrows = strongest repeated zone flows \u00B7 top three labelled</span>':'<span>Rings mark where each pass began</span>')+mapSampleNote(ps,shown,'progressive-pass events');
    }
    else if(m.k==='box'){
      const ps=ZONES.filter(function(a){return a.into_box&&okFilter(a)&&a.end_x!=null&&inZone(a.x,a.y)});
      if(pattern){const ok=ps.filter(function(a){return a.ok}),fail=ps.filter(function(a){return !a.ok});

function heatLayer(rows){
  const GW=42,GH=28,cw=105/GW,ch=68/GH;
  const g=[];for(let j=0;j<GH;j++)g.push(new Float32Array(GW));
  rows.forEach(function(a){
    const i=Math.min(GW-1,Math.max(0,Math.floor(a.x/100*GW)));
    const j=Math.min(GH-1,Math.max(0,Math.floor(a.y/100*GH)));
    g[j][i]++;
  });
  let mx=0;for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)if(g[j][i]>mx)mx=g[j][i];
  if(!mx)mx=1;
  let s2='<defs><filter id="hblur" x="-12%" y="-12%" width="124%" height="124%">'+
         '<feGaussianBlur stdDeviation="2.1"/></filter></defs><g filter="url(#hblur)">';
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
    const v=g[j][i]/mx; if(v<0.04)continue;
    // cool -> warm ramp reads as intensity without a legend
    const t=Math.pow(v,0.62);
    const r=Math.round(40+215*Math.min(1,t*1.35));
    const gg=Math.round(90+150*Math.min(1,Math.max(0,t*1.5-0.25)));
    const b=Math.round(190-150*t);
    s2+='<rect x="'+(i*cw)+'" y="'+(j*ch)+'" width="'+(cw+0.35)+'" height="'+(ch+0.35)+
        '" fill="rgb('+r+','+gg+','+b+')" fill-opacity="'+(0.10+0.72*t).toFixed(3)+'"/>';
  }
  return s2+'</g>';
}

function laneViz(t){
  const L=LANES&&LANES[t.team];if(!L)return'';
  const get=function(k){return L[k]?+L[k].pct_of_final_third:0};
  const l=get('L'),c=get('C'),r=get('R');
  // low y is their right, high y their left, confirmed against full-back positions
  const bands=[{k:'R',lbl:'Right',v:r,y0:0,y1:33.3},{k:'C',lbl:'Centre',v:c,y0:33.3,y1:66.7},{k:'L',lbl:'Left',v:l,y0:66.7,y1:100}];
  const mx=Math.max(l,c,r)||1;
  let inner='';
  bands.forEach(function(b){
    const t2=b.v/mx;
    /* Share of involvement is a magnitude, so it reads as one ink getting
       stronger, not as the brand colour. Same ramp, neutral hue. */
    inner+='<rect x="'+PX(50)+'" y="'+PY0(b.y0,b.y1)+'" width="'+PX(50)+'" height="'+PYH(b.y0,b.y1)+
           '" fill="var(--text2)" fill-opacity="'+(0.06+0.42*t2).toFixed(3)+'"/>';
    inner+='<text x="'+PX(76)+'" y="'+(PY((b.y0+b.y1)/2)+1.2)+'" fill="var(--text)" font-size="4.6" font-weight="800" '+
           'text-anchor="middle" font-family="JetBrains Mono,monospace">'+b.v.toFixed(1)+'%</text>';
    inner+='<text x="'+PX(76)+'" y="'+(PY((b.y0+b.y1)/2)+6.2)+'" fill="var(--text3)" font-size="2.6" font-weight="700" '+
           'text-anchor="middle" letter-spacing="0.4" font-family="Inter">'+b.lbl.toUpperCase()+'</text>';
  });
  const domi=l>c&&l>r?'down the left':(r>c&&r>l?'down the right':'through the middle');
  return pitchWrap('Which side they attack the final third',
    'Share of involvement in the <b>final third only</b>, split by channel. This team works '+domi+'. '+
    'Attack runs left to right, so the top band is their right and the bottom band their left.',
    inner,
    /* The swatch is the top of the ramp: same ink, same alpha as a full band,
       over the same surface. "Stronger" rather than "darker" because a neutral
       ink over the dark theme's surface gets lighter as it gets denser. */
    '<span><i style="background:color-mix(in srgb,var(--text2) 48%,transparent)"></i>'+
    'Stronger band = more of their final-third play</span>');
}

// z-score -> the same colour language used elsewhere on the site
function zBand(z){
  if(z==null)return {c:'var(--text3)',t:''};
  if(z>=1.5) return {c:'var(--style-hi)', t:'much higher than league'};
  if(z>=0.6) return {c:'var(--style-hi)', t:'higher than league'};
  if(z<=-1.5)return {c:'var(--style-low)', t:'much lower than league'};
  if(z<=-0.6)return {c:'var(--style-low)', t:'lower than league'};
  return {c:'var(--text2)', t:'around league average'};
}

      '<div class="foot">Sequence style is shown as z-scores from the comparison pool stored by the sequence view. The centre line is that pool mean; each full half-rail spans 2.5 standard deviations. '+
      'Blue means higher than the league and amber means lower, not better and worse. Read longer bars as stronger stylistic signals and near-centre bars lightly. '+
      'Hold-up and central-prog use deliberately strict definitions \u2014 see the glossary. '+
      'Open play only; a possession is a run of controlled touches by one team, ended by a turnover, stoppage or set piece.</div>';
    wireTips();
  }catch(e){main.innerHTML=teamHead(t)+'<div class="empty">Error: '+esc(e.message)+'</div>'}
}
function seqRadar(t,Z,RAW){
  let s='<div class="dev-legend"><span class="dev-key"><i style="background:var(--style-low)"></i>Lower than league</span>'+
    '<span>\u22122.5\u03c3</span><span>League mean</span><span>+2.5\u03c3</span>'+
    '<span class="dev-key"><i style="background:var(--style-hi)"></i>Higher than league</span></div><div class="dev-groups">';
  SEQ_GROUPS.forEach(function(grp){
    s+='<div class="dev-group"><div class="dev-group-h">'+esc(grp.g)+'</div>';
    grp.m.forEach(function(m){
      const z=Z[m[0]]==null?0:+Z[m[0]],zc=Math.max(-2.5,Math.min(2.5,z));
      const end=50+(zc/2.5)*50,left=Math.min(50,end),width=Math.max(z===0?0:1,Math.abs(end-50));
      const raw=RAW[m[0]],rawtxt=raw==null?'\u2014':(+raw).toFixed(m[2])+(m[3]||'');
      const col=z<0?'var(--style-low)':'var(--style-hi)';
      s+='<div class="dev-row" title="'+esc(m[1])+': '+rawtxt+'; '+zFmt(z)+' standard deviations">'+
        '<div class="dev-lbl">'+esc(m[1])+'</div><div class="dev-track"><i class="dev-zero"></i>'+
        '<i class="dev-fill" style="left:'+left.toFixed(1)+'%;width:'+width.toFixed(1)+'%;background:'+col+'"></i></div>'+
        '<div class="dev-val">'+rawtxt+'<span class="dev-z">'+zFmt(z)+'\u03c3</span></div></div>';
    });
    s+='</div>';
  });
  s+='</div>';
  return '<div class="sect" style="margin-top:12px"><div class="viz-eyebrow">Season style</div>'+
    '<div class="viz-title">'+esc(tname(t.team))+' \u2014 deviations from league style</div>'+
    '<div class="viz-sub">The same numbers as above, grouped by football question. Each bar shows how far '+
    esc(tname(t.team))+' sits from the '+esc(lgName(lgOf(SEL)))+' average. Direction describes style, not quality; '+
    'the raw value and exact z-score remain beside every bar.</div>'+
    s+'</div>';
}

function wireTips(){
  const main=document.getElementById('main');
  if(main.dataset.tipsBound)return;
  main.dataset.tipsBound='1';
  const tip=document.getElementById('tip');
  main.addEventListener('mousemove',function(e){
    const el=e.target.closest?e.target.closest('.pt,.hit'):null;
    if(el&&el.getAttribute('data-n')){
      tip.innerHTML='<div>'+el.getAttribute('data-n')+'</div>'+
        '<div style="font-weight:500;color:var(--text3);font-size:10px;margin-top:2px">'+
        (el.getAttribute('data-v')||'')+'</div>';
      tip.style.display='block';
      tip.style.left=(e.clientX+13)+'px';tip.style.top=(e.clientY+13)+'px';
    } else tip.style.display='none';
  });
  main.addEventListener('mouseleave',function(){tip.style.display='none'});
}
function legendHtml(){return '<div class="legend">'+[['var(--elite)','Elite 80+'],['var(--above)','Above 60+'],
  ['var(--avg)','Average 40+'],['var(--below)','Below 20+'],['var(--poor)','Poor']]
  .map(function(a){return '<div class="lg"><div class="dot" style="background:'+a[0]+'"></div>'+a[1]+'</div>'}).join('')+'</div>'}
async function snap(){
  const el=document.getElementById('main'),bg=getComputedStyle(document.body).backgroundColor;
  /* The live main panel scrolls inside a fixed-height flex layout. Capture an
     expanded off-screen clone so season maps are not clipped at the viewport. */
  const stage=document.createElement('div'),clone=el.cloneNode(true);
  stage.style.cssText='position:fixed;left:-100000px;top:0;width:'+el.clientWidth+'px;background:'+bg+';z-index:-1';
  clone.style.cssText='width:100%;height:auto;max-height:none;overflow:visible;padding:13px 18px';
  clone.querySelectorAll('.vz-tog,.vz-filters').forEach(function(control){control.remove()});
  stage.appendChild(clone);document.body.appendChild(stage);
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    /* Freeze viewport-relative pitches before html2canvas changes its virtual
       window height; otherwise calc(100vh - …) expands after h is measured and
       pushes the legend outside the captured bitmap. */
    clone.querySelectorAll('.pitch-box').forEach(function(box){
      box.style.height=Math.max(230,box.getBoundingClientRect().height)+'px';
      box.style.maxHeight='none';
    });
    await new Promise(function(resolve){requestAnimationFrame(function(){requestAnimationFrame(resolve)})});
    const w=clone.scrollWidth,h=clone.scrollHeight;
    return await html2canvas(clone,{backgroundColor:bg,scale:2,width:w,height:h,windowWidth:w,windowHeight:h});
  }finally{stage.remove()}
}
async function exportPNG(){try{const c=await snap();const a=document.createElement('a');
  a.download=(SEL||'team').replace(/[^\w]+/g,'_')+'.png';a.href=c.toDataURL('image/png');a.click()}catch(e){alert(e.message)}}
async function exportPDF(){try{const c=await snap();const jsPDF=window.jspdf.jsPDF;
  const pdf=new jsPDF({orientation:c.width>=c.height?'l':'p',unit:'pt',format:'a4'});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  const r=Math.min(pw/c.width,ph/c.height);
  pdf.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',(pw-c.width*r)/2,20,c.width*r,c.height*r,undefined,'FAST');
  pdf.save((SEL||'team').replace(/[^\w]+/g,'_')+'.pdf')}catch(e){alert(e.message)}}
/* The tab strip only shows an overflow cue when it actually has more bar in
   that direction. Kept in script because CSS cannot see a scroll position. */
function syncTabCue(){
  var t=document.getElementById('tabs');if(!t)return;
  var max=t.scrollWidth-t.clientWidth;
  t.classList.toggle('cue-l',t.scrollLeft>1);
  t.classList.toggle('cue-r',t.scrollLeft<max-1);
}
(function(){var t=document.getElementById('tabs');
  if(t)t.addEventListener('scroll',syncTabCue,{passive:true});
  window.addEventListener('resize',syncTabCue);
  syncTabCue();})();

/* ---- Site nav menu -------------------------------------------------------
   Page tabs own the header strip; every cross-page destination in NAV lives
   here behind one labelled trigger. Standard menu button behaviour: the
   trigger reports aria-expanded, Escape closes it and hands focus back, the
   arrow keys walk the items, and a click or a focus landing outside closes it.
   The panel is position:fixed, so it clears the body's overflow:hidden; that
   means its position is set from script each time it opens. */
var NAVOPEN=false;
var NAVGROUPS=[['Explore','explore'],['Learn','learn']];
function renderNavMenu(){
  var host=document.getElementById('navMenu');if(!host)return;
  host.innerHTML=
    '<button type="button" class="lnk navmenu-btn" id="navMenuBtn" aria-haspopup="true" '+
      'aria-expanded="false" aria-controls="navMenuPanel">Go to</button>'+
    '<div class="navmenu-panel" id="navMenuPanel" role="menu" aria-labelledby="navMenuBtn">'+
    NAVGROUPS.map(function(g){
      var items=NAV.filter(function(n){return n[2]===g[1]});
      if(!items.length)return '';
      return '<div class="navmenu-h">'+esc(g[0])+'</div>'+
        items.map(function(n){return '<a role="menuitem" href="'+n[1]+'">'+esc(n[0])+'</a>'}).join('');
    }).join('')+'</div>';
  var btn=document.getElementById('navMenuBtn');
  btn.addEventListener('click',function(){setNavMenu(!NAVOPEN,NAVOPEN?null:0)});
  btn.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();setNavMenu(true,e.key==='ArrowUp'?-1:0)}});
  document.getElementById('navMenuPanel').addEventListener('keydown',navMenuKey);
}
function navMenuItems(){return [].slice.call(document.querySelectorAll('#navMenuPanel a'))}
/* Anchored under the trigger, then clamped into the viewport: on a narrow
   screen the trigger can sit close enough to the right edge that a panel hung
   from it would run off the left one. */
function placeNavMenu(){
  var btn=document.getElementById('navMenuBtn'),p=document.getElementById('navMenuPanel');
  if(!btn||!p)return;
  var r=btn.getBoundingClientRect(),w=window.innerWidth,top=Math.round(r.bottom+6);
  var right=Math.max(8,w-r.right);
  if(w-right-p.offsetWidth<8)right=Math.max(8,w-p.offsetWidth-8);
  p.style.top=top+'px';
  p.style.right=Math.round(right)+'px';
  p.style.maxHeight=Math.max(120,window.innerHeight-top-8)+'px';
}
function setNavMenu(open,focusIdx){
  var btn=document.getElementById('navMenuBtn'),p=document.getElementById('navMenuPanel');
  if(!btn||!p)return;
  NAVOPEN=!!open;
  p.classList.toggle('open',NAVOPEN);
  btn.setAttribute('aria-expanded',NAVOPEN?'true':'false');
  if(!NAVOPEN)return;
  placeNavMenu();
  var it=navMenuItems();
  if(focusIdx!=null&&it.length)it[focusIdx<0?it.length-1:focusIdx].focus();
}
function closeNavMenu(refocus){
  if(!NAVOPEN)return;
  setNavMenu(false);
  if(refocus){var b=document.getElementById('navMenuBtn');if(b)b.focus()}
}
function navMenuKey(e){
  var it=navMenuItems();if(!it.length)return;
  var i=it.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();it[(i+1)%it.length].focus()}
  else if(e.key==='ArrowUp'){e.preventDefault();it[(i<=0?it.length:i)-1].focus()}
  else if(e.key==='Home'){e.preventDefault();it[0].focus()}
  else if(e.key==='End'){e.preventDefault();it[it.length-1].focus()}
}
function navMenuOutside(e){
  var t=e.target;
  return !(t&&t.closest&&t.closest('#navMenu'));
}
document.addEventListener('keydown',function(e){if(NAVOPEN&&e.key==='Escape'){e.preventDefault();closeNavMenu(true)}});
document.addEventListener('pointerdown',function(e){if(NAVOPEN&&navMenuOutside(e))closeNavMenu(false)});
document.addEventListener('focusin',function(e){if(NAVOPEN&&navMenuOutside(e))closeNavMenu(false)});
window.addEventListener('resize',function(){if(NAVOPEN)placeNavMenu()});

renderNavMenu();
init();

/* Published as-of date. Derived from the last analytics rebuild that actually
   completed, not from when a summary table was last touched.
   mv_site_summary.refreshed_at reports when refresh_site_summaries last ran,
   which is independent of whether the analytics layer rebuilt: on 14 September
   it read 17:41 while every metric matview was from 1 September. A failed gate
   deliberately leaves this stamp where it was, so fresher but unverified data
   sits behind an honest stale date rather than a confident wrong one. */
var ASOF=null;
function renderAsOf(){
  var el=document.getElementById('asOf'); if(!el) return;
  if(!ASOF||!ASOF.as_of){ el.textContent='as of unavailable'; el.className='as-of warn'; return; }
  var d=new Date(ASOF.as_of);
  var txt='data as of '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+
          ' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(ASOF.is_stale) txt+=' \u00B7 '+Math.round(ASOF.hours_old)+'h old';
  el.textContent=txt;
  el.className='as-of'+(ASOF.is_stale?' warn':'');
}
fetch(SB+'/rest/v1/v_analytics_as_of?select=*',{headers:HD})
  .then(function(r){return r.ok?r.json():null})
  .then(function(rows){ ASOF=rows&&rows[0]||null; renderAsOf(); })
  .catch(function(){ renderAsOf(); });
