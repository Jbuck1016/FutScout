<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Profiles</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* Team profiles. Every colour, face, space and radius is a token from
   theme.css; chrome is shell.css and the data panels are the fs- components in
   components.css. What is left here is this page's own layout (tm-). */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.tm-body{flex:1 1 auto;min-height:0}
#side.hide{display:none}
.tm-railblock{display:flex;flex-direction:column;gap:var(--s3);min-height:0}
.tm-railblock[hidden]{display:none}
#railTeams{flex:1 1 auto}
#railTeams .fs-dir{flex:1 1 160px;min-height:120px}
#railRank .fs-dir{flex:1 0 220px;min-height:220px}
.tm-dir .fs-dir-row{flex-direction:column;align-items:stretch;gap:1px}
.tm-dir .fs-dir-meta{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tm-metrics .fs-dir-row{align-items:center;min-height:var(--tap)}
.tm-metrics .fs-dir-name{white-space:normal}
.tm-dir-h{padding:var(--s3) var(--s3) var(--s1);font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tm-jump{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.tm-jump[hidden]{display:none}
.tm-jump button{appearance:none;min-height:var(--tap);padding:var(--s1) var(--s3);background:none;border:0;border-left:3px solid transparent;border-bottom:1px solid var(--rule2);color:var(--ink);font:400 12px/1.3 var(--body);text-align:left;cursor:pointer}
.tm-jump button:hover{background:var(--panel2)}

.tm-identity{margin-bottom:var(--s4)}
.tm-identity .fs-chip{white-space:normal}
.tm-read{margin:0 0 var(--s5);font:400 12px/1.6 var(--body);color:var(--muted);max-width:110ch}
.tm-read b{color:var(--ink);font-weight:600}

/* Profile groups: three columns, each group only as tall as its rows. */
.tm-group{container-type:inline-size}
.tm-group .fs-panel-h :is(h2,h3){font-size:16px}
.tm-row{display:grid;grid-template-columns:minmax(0,1fr) auto 56px 26px auto;align-items:center;gap:var(--s1) var(--s3);width:100%;min-height:var(--tap);
  padding:var(--s1) var(--s2);background:none;border:0;border-bottom:1px solid var(--rule2);border-radius:0;color:var(--ink);font:400 12px/1.4 var(--body);text-align:left}
button.tm-row{cursor:pointer}
button.tm-row:hover{background:var(--panel2)}
button.tm-row .tm-row-lbl{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
button.tm-row:hover .tm-row-lbl,button.tm-row:focus-visible .tm-row-lbl{text-decoration-color:var(--ink)}
.tm-row-lbl{min-width:0;overflow-wrap:anywhere}
.tm-row-val{font:400 12px/1.4 var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tm-row-pct{font:500 12px/1.4 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.tm-row-tag{display:flex;gap:2px;justify-content:flex-end}
.tm-row-sub{grid-column:1/-1;font:400 11px/1.4 var(--body);color:var(--muted)}
@container (max-width:380px){
  .tm-row{grid-template-columns:minmax(0,1fr) auto 26px auto}
  .tm-row>.fs-bar,.tm-row>.tm-nobar{grid-column:1/-1;grid-row:2}
}
.tm-gnote{margin-top:var(--s3)}
.tm-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.tm-tile{appearance:none;display:flex;flex-direction:column;gap:var(--s1);min-width:0;padding:var(--s3);background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);color:var(--ink);font:400 11px/1.3 var(--body);text-align:left}
button.tm-tile{cursor:pointer}
button.tm-tile:hover{background:var(--panel2)}
.tm-tile b{font:500 20px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.tm-tile small{font:400 10px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tm-bands{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-top:var(--s5);padding-top:var(--s3);border-top:1px solid var(--rule);font:400 11px/1.4 var(--body);color:var(--muted)}
.tm-bands span,.tm-leg span{display:inline-flex;align-items:center;gap:var(--s2)}
.tm-bands i,.tm-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.fs-panel-foot .fs-push,.fs-pitchbox-foot .fs-push{display:inline-flex;gap:var(--s2)}
.tm-foot{margin-top:var(--s3);font:400 11px/1.5 var(--body);color:var(--muted);max-width:120ch}

/* Pitch boxes and plots */
.tm-pitch svg,.tm-plot{display:block;width:100%;height:auto}
.tm-svg text{font-family:var(--body)}
.tm-svg text.m{font-family:var(--mono)}
.tm-leg{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-top:var(--s3);font:400 11px/1.4 var(--body);color:var(--muted)}
.tm-leg b{font:500 11px/1.4 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.tm-leg i.is-wide{width:44px;border-radius:var(--radius)}
.shot-key svg{width:13px;height:13px;overflow:visible;flex:none}
.tm-ctrl{margin-bottom:var(--s3)}
.tm-ctrl .fs-pitchbox-show{margin-bottom:var(--s2)}
.tm-tip{position:fixed;pointer-events:none;z-index:120;display:none;max-width:280px;padding:var(--s2) var(--s3);background:var(--ink);color:var(--bg);border-radius:var(--radius);font:500 11px/1.3 var(--body)}
.tm-tip small{display:block;margin-top:2px;font:400 10px/1.3 var(--mono)}

/* Rankings */
.tm-rank{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s5);align-items:start}
.narrow .tm-rank{grid-template-columns:minmax(0,1fr)}
.tm-cellbtn{appearance:none;display:block;width:100%;min-height:calc(var(--tap) - 8px);padding:0;background:none;border:0;color:inherit;font:600 12px/1.4 var(--body);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.tm-cellbtn:hover{text-decoration-color:var(--ink)}
.tm-cell-sub{display:block;font:400 10px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tm-scale{min-width:110px;height:8px;overflow:visible}
.tm-scale>i{border-radius:var(--radius);min-width:2px}
.tm-scale .fs-tick{top:-3px;bottom:-3px}
.tm-split{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin:0 0 var(--s3);font:400 12px/1.4 var(--body)}
.tm-split b{font:500 12px/1.4 var(--mono);font-variant-numeric:tabular-nums}

/* Squad */
.tm-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2) var(--s5);margin-bottom:var(--s4)}
.tm-toolbar>span{display:inline-flex;align-items:center;gap:var(--s2)}
.tm-strip{display:flex;align-items:flex-end;gap:2px;height:56px;border-bottom:1px solid var(--ink)}
.tm-strip i{flex:1 1 0;min-width:2px;max-width:26px;background:var(--ink)}
.tm-strip i.is-below{background:var(--rule)}
.tm-strip i.is-gk{background:var(--muted)}
.tm-squad{min-width:660px}
.tm-squad table{table-layout:fixed}
.tm-squad h3{margin:var(--s5) 0 var(--s1);font:500 16px/1.2 var(--display)}
.tm-squad h3 small{margin-left:var(--s3);font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tm-squad a,.tm-link{color:inherit;font-weight:600;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.tm-squad td{overflow:hidden;text-overflow:ellipsis}
.tm-merge{text-align:center}
.tm-wl{min-width:20px;justify-content:center}

/* Sequences */
.sgrp{padding:var(--s4) 0 var(--s1);border-top:1px solid var(--rule)}
.sgrp:first-of-type{border-top:0}
.sgrp-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s2) var(--s4);margin-bottom:var(--s3);font:500 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.sgrp-d{font:400 11px/1.4 var(--body);letter-spacing:0;text-transform:none;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:var(--s3);padding-bottom:var(--s4)}
.stile{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:var(--s3) var(--s4)}
.stile-l{font:400 11px/1.4 var(--body);color:var(--muted);min-height:30px}
.stile-v{font:500 20px/1.1 var(--mono);font-variant-numeric:tabular-nums;margin-top:var(--s1)}
.stile-v.is-hi{color:var(--blue)} .stile-v.is-lo{color:var(--gold-text)}
.stile-z{font:400 10px/1.4 var(--mono);color:var(--muted);margin-top:var(--s1);min-height:14px}
.dev-legend{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:var(--s2) var(--s5);margin:var(--s4) 0 var(--s5);font:400 11px/1.4 var(--mono);color:var(--muted)}
.dev-key{display:inline-flex;align-items:center;gap:var(--s2)}
.dev-key i{display:block;width:12px;height:7px;border-radius:var(--radius)}
.dev-key i.is-hi,.dev-fill.is-hi{background:var(--blue)} .dev-key i.is-lo,.dev-fill.is-lo{background:var(--gold)}
.dev-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5)}
.narrow .dev-groups{grid-template-columns:minmax(0,1fr)}
.dev-group{border:1px solid var(--rule);border-radius:var(--radius);padding:var(--s4);background:var(--panel)}
.dev-group-h{margin-bottom:var(--s3);font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dev-row{display:grid;grid-template-columns:minmax(100px,1.05fr) minmax(100px,1.25fr) 56px;gap:var(--s3);align-items:center;padding:var(--s1) 0;font:400 12px/1.4 var(--body)}
.dev-lbl{color:var(--ink)}
.dev-track{position:relative;height:8px;background:var(--rule2);border-radius:var(--radius);overflow:hidden}
.dev-zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--ink)}
.dev-fill{position:absolute;top:1px;height:6px;border-radius:var(--radius);min-width:1px}
.dev-val{text-align:right;font:500 11px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.dev-z{display:block;font-size:10px;font-weight:400;color:var(--muted)}

.tm-export-holder{position:fixed;left:-30000px;top:0;z-index:-1}
.tm-export{background:var(--bg);color:var(--ink);padding:var(--s5)}
.tm-export .fs-canvas{padding:0;overflow:visible}
/* html2canvas misplaces tracked text inside flex boxes, so exports drop tracking. */
.tm-export *{letter-spacing:0!important}

@media (max-width:760px){
  html,body{height:auto}
  body{overflow-x:hidden;overflow-y:auto}
  .tm-body{flex:0 0 auto}
  #railTeams .fs-dir,#railRank .fs-dir{flex:0 0 auto;min-height:0;max-height:168px}
  .tm-rank{grid-template-columns:minmax(0,1fr)}
  .dev-groups{grid-template-columns:minmax(0,1fr)}
  .tm-jump{flex-direction:row;overflow-x:auto;border-top:0}
  .tm-jump button{flex:0 0 auto;border:1px solid var(--rule);border-radius:var(--radius);margin-right:var(--s2)}
  .dev-row{grid-template-columns:minmax(90px,1fr) minmax(80px,1.1fr) 52px}
}
</style>
<script src="gate.js"></script>
<meta name="robots" content="noindex,nofollow">

</head>
<body><script>window.FutScout&&FutScout.mount()</script>
<div class="fs-slots" hidden>
  <div id="lgPick" class="lgpick" data-fs-slot="scope"></div>
  <span id="hdrSub" data-fs-slot="pop">loading&hellip;</span>
  <span class="as-of" id="asOf"></span>
  <div class="tabs" id="tabs" data-fs-slot="tabs" aria-label="Team profile sections"></div>
  <span data-fs-slot="actions"><button type="button" onclick="exportPNG()">PNG</button><button type="button" onclick="exportPDF()">PDF</button></span>
</div><script>window.FutScout&&FutScout.adopt()</script>
<div class="fs-body tm-body">
  <aside class="fs-rail" id="side" aria-label="Team directory and view controls">
    <div class="tm-railblock fs-rail-full" id="railTeams">
      <div class="fs-field"><label for="teamSearch">Search team</label>
        <input id="teamSearch" type="search" placeholder="Team name" autocomplete="off" oninput="TEAMQ=this.value;renderList()"></div>
      <div class="fs-dir-count" id="tcount"></div>
      <div class="fs-dir tm-dir plist" id="tlist"></div>
      <p class="fs-note">Each row: matches, then goals scored and conceded per game. League position is not available from this endpoint.</p>
      <div class="fs-label" id="jumpLabel" hidden>Jump to group</div>
      <nav class="tm-jump" id="jump" aria-labelledby="jumpLabel" hidden></nav>
    </div>
    <div class="tm-railblock fs-rail-full" id="railRank" hidden></div>
  </aside>
  <div class="fs-canvas main" id="main" data-fs-app><div class="fs-stack" aria-busy="true"><div class="fs-skel title"></div><div class="fs-skel block"></div><div class="fs-skel block"></div></div></div>
</div>
<div class="tm-tip" id="tip"></div>
<script>
const SB='https://xrsilhiffjoulyoqhdmp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhyc2lsaGlmZmpvdWx5b3FoZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Nzc5NDAsImV4cCI6MjEwMDI1Mzk0MH0.3_ccOJi0SBKOwHGxhJL3fsWCSSLoxZumzt-KH4wO8OU';
const HD={'apikey':AK,'Authorization':'Bearer '+AK};
const TABS=['Profile','Sequences','Maps','Rankings','League Map','Matches','Squad'];
let TEAMS=[],TDEFS=[],SEL=null,TAB='Profile',PCT={},PLAYERS=[],TEAMQ='';
let DIR={},LEAGUES=[],LG=(function(){try{return localStorage.getItem('leagueScope')||'ALL'}catch(e){return 'ALL'}})();
let LM={x:'ppda',y:'field_tilt'};
let MP={kind:'passes',third:'',lane:'',outcome:'ok',mode:'pattern',defMode:'wins'};
const TEAM_DISPLAY={'Chicago':'Chicago Fire FC','Colorado':'Colorado Rapids','Columbus':'Columbus Crew',
 'Houston':'Houston Dynamo FC','Kansas City':'Sporting Kansas City','Montreal':'CF Montréal',
 'New England':'New England Revolution','New York':'New York Red Bulls','Philadelphia':'Philadelphia Union',
 'Portland':'Portland Timbers','Salt Lake':'Real Salt Lake','San Jose':'San Jose Earthquakes',
 'Seattle':'Seattle Sounders FC','Toronto':'Toronto FC','Vancouver':'Vancouver Whitecaps',
 'L.A. Galaxy':'LA Galaxy'};
function tname(t){return TEAM_DISPLAY[t]||t||''}
/* Layer colours by role: completed and failed, progressive (blue), into the
   box (purple), carries (gold). */
const TPAL={ok:'var(--p80)',fail:'var(--p0)',pass:'var(--p80)',prog:'var(--blue)',carry:'var(--gold)',box:'var(--purple)'};
let RKT={metric:'ppda'};
/* Rankings view options. Presentation only, so they are not part of the URL
   contract: the minimum never drops a team, it only decides who gets a rank. */
let RK={group:'',min:1,median:true,highlight:true};
let SQ={group:'position',pillars:'pct'},SQD=null;
let ZONES=null,CZONES=null,TSHOTS=null,ZTEAM=null,BUILD=null,LANES=null,TFIXTURES=[];
let teamViewRevision=0;
function teamRequest(){const revision=teamViewRevision,team=SEL,tab=TAB,filters=JSON.stringify([LG,MP,RKT,LM]);return ()=>revision===teamViewRevision&&team===SEL&&tab===TAB&&filters===JSON.stringify([LG,MP,RKT,LM]);}
function displayMetric(value,decimals=1,suffix=''){return value==null||String(value).trim()===''||!Number.isFinite(Number(value))?'—':Number(value).toFixed(decimals)+suffix;}
let restoringTeamURL=false;
function writeTeamURL(){
  if(restoringTeamURL||!SEL)return;
  const u=new URL(location.href);u.searchParams.set('state','1');u.searchParams.set('team',SEL);u.searchParams.set('tab',TAB);u.searchParams.set('league',LG);
  for(const k of ['kind','mode','outcome','third','lane','defMode'])if(MP[k]!=null)u.searchParams.set('map_'+k,MP[k]);
  u.searchParams.set('metric',RKT.metric);u.searchParams.set('x',LM.x);u.searchParams.set('y',LM.y);
  if(u.href!==location.href)history.pushState(null,'',u);
}
function restoreTeamURL(){
  const p=new URLSearchParams(location.search);
  if(p.has('league'))LG=p.get('league')==='ALL'||LEAGUES.some(l=>l.league===p.get('league'))?p.get('league'):'ALL';
  if(teamOf(p.get('team')))SEL=p.get('team');
  if(TABS.includes(p.get('tab')))TAB=p.get('tab');
  const allowed={kind:MAPS.map(m=>m.k),mode:['pattern','events'],outcome:['all','ok','fail'],third:['','def','mid','att'],lane:['','L','C','R'],defMode:['wins','interventions','failed']};
  Object.entries(allowed).forEach(([k,values])=>{if(values.includes(p.get('map_'+k)))MP[k]=p.get('map_'+k);});
  for(const [object,key,param] of [[RKT,'metric','metric'],[LM,'x','x'],[LM,'y','y']])if(tdefOf(p.get(param)))object[key]=p.get(param);
}
window.addEventListener('popstate',()=>{if(!TEAMS.length)return;restoringTeamURL=true;restoreTeamURL();renderLeaguePicker();renderTabs();renderList();updateHdr();draw();restoringTeamURL=false;});

async function sbAll(t,p){p=p||{};const PG=1000;let all=[],off=0;
  while(true){const u=new URL(SB+'/rest/v1/'+t);
    Object.keys(p).forEach(function(k){u.searchParams.set(k,p[k])});
    const r=await fetch(u,{headers:Object.assign({},HD,{'Range':off+'-'+(off+PG-1),'Range-Unit':'items'})});
    if(!r.ok)throw new Error(t+' '+r.status);const d=await r.json();
    if(!Array.isArray(d)||!d.length)break;all=all.concat(d);if(d.length<PG)break;off+=PG;}
  return all;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
/* Percentile bands. Only evaluative (PERF) numbers are coloured with them. */
function bandOf(p){if(p==null||isNaN(p))return'';if(p>=80)return'80';if(p>=60)return'60';if(p>=40)return'40';if(p>=20)return'20';return'0'}
function tier(p){const b=bandOf(p);return{c:b?'var(--p'+b+')':'var(--muted)'}}
function fmt(v,u){if(v==null)return'—';return (+v).toLocaleString(undefined,{maximumFractionDigits:2})+(u==='%'?'%':(u==='m'?' m':(u==='s'?' s':'')))}
function tdefOf(k){for(var i=0;i<TDEFS.length;i++)if(TDEFS[i].key===k)return TDEFS[i];return null}
function teamOf(n){for(var i=0;i<TEAMS.length;i++)if(TEAMS[i].team===n)return TEAMS[i];return null}
function lgOf(t){return (DIR[t]&&DIR[t].league)||null}
function lgName(code){
  for(var i=0;i<LEAGUES.length;i++)if(LEAGUES[i].league===code)return LEAGUES[i].display_name;
  return code||'League unavailable';
}
function lgScopeLabel(){return LG==='ALL'?'All leagues':lgName(LG)}
function slug(k){return String(k==null?'':k).toLowerCase().replace(/[^a-z0-9]/g,'-')}
function glossaryHref(key){return 'glossary.html#m-'+slug(key)}
function median(a){const s=a.filter(function(v){return Number.isFinite(v)}).sort(function(m,n){return m-n});if(!s.length)return null;
  const h=Math.floor(s.length/2);return s.length%2?s[h]:(s[h-1]+s[h])/2}
function toast(text){if(window.FutScout&&FutScout.toast)FutScout.toast(text)}

/* STYLE or PERF. team_metric_defs returns higher_is_better but no field that
   says whether a metric is evaluative, so the tag is decided here, once: PERF
   is output, efficiency and the conceded set; everything else describes how a
   team plays. It changes colour and copy only, never a value or a percentile. */
const PERF_KEYS=['d3_accuracy','escape_pct','deep_to_final_pct','passes_per_shot','box_per_entry','final_to_shot_pct',
  'prog_passes_pg','box_entries_pg','shots_pg','goals_pg','pct_ending_in_shot','shots_against_pg','goals_against_pg'];
function isPerf(key){return PERF_KEYS.indexOf(key)>=0}
function roleTag(key){return isPerf(key)
  ?'<span class="fs-tag perf" title="Evaluative: a higher percentile is better">PERF</span>'
  :'<span class="fs-tag style" title="Descriptive: a higher percentile is more of this, not better">STYLE</span>'}
/* The source stores percentiles for higher_is_better = false metrics inverted.
   On an evaluative metric that is the point. On a descriptive one it has to be
   said, because there a high percentile means a LOWER raw value. */
function isInvStyle(d){return !!d&&!isPerf(d.key)&&d.higher_is_better===false}
const INV_TAG='<span class="fs-tag def" title="Stored by the source inverted: a high percentile here means a LOWER raw value">INV</span>';
function directionText(d){
  if(!d||!d.key)return '';
  if(isPerf(d.key))return d.higher_is_better===false
    ?'Evaluative. A lower raw value is better; the source stores the percentile inverted, so a high percentile is better.'
    :'Evaluative. A higher value is better and so is a higher percentile.';
  return d.higher_is_better===false
    ?'Descriptive. A high percentile is not better. The source stores this percentile inverted, so a high percentile means a lower raw value.'
    :'Descriptive. A high percentile means more of this, not better.';
}

function scopedTeams(){return TEAMS.filter(function(t){return inScope(t.team)})}

async function init(){
  try{
    const r=await Promise.all([
      sbAll('mv_team_all',{select:'*',order:'team.asc'}),
      sbAll('team_metric_defs',{select:'*',order:'grp_order.asc,sort_order.asc'}),
      sbAll('mv_team_percentiles',{select:'team,metric,value,pct'}),
      sbAll('mv_team_buildup',{select:'*'}),
      sbAll('mv_team_lanes',{select:'*'}),
      sbAll('v_team_directory',{select:'team,league,league_name,teams_in_league'}),
      sbAll('v_league_summary',{select:'league,display_name,matches,teams'})
    ]);
    TEAMS=r[0];TDEFS=r[1];
    PCT={};r[2].forEach(function(x){if(!PCT[x.team])PCT[x.team]={};PCT[x.team][x.metric]=x});
    BUILD={};(r[3]||[]).forEach(function(b){BUILD[b.team]=b});
    LANES={};(r[4]||[]).forEach(function(l){if(!LANES[l.team])LANES[l.team]={};LANES[l.team][l.lane]=l});
    DIR={};(r[5]||[]).forEach(function(d){DIR[d.team]=d});
    LEAGUES=(r[6]||[]).filter(function(l){return l.teams>0});
    if(LEAGUES.length===1)LG=LEAGUES[0].league;
    else if(LG!=='ALL'&&!LEAGUES.some(function(l){return l.league===LG}))LG='ALL';
    const qt=new URLSearchParams(location.search).get('team');
    if(qt&&teamOf(qt)){
      SEL=qt;
      if(LG!=='ALL'&&!inScope(SEL))LG=lgOf(SEL)||'ALL';
    }else{
      // This page always shows one team, so it needs a selection. Take the
      // first in the current scope rather than a hardcoded club. SEL is also
      // the Rankings highlight, so both stop defaulting to one club.
      SEL=(scopedTeams()[0]||{}).team||null;
    }
    restoreTeamURL();renderLeaguePicker();renderTabs();renderList();wireTips();updateHdr();draw();
    if(!TEAMS.length)document.getElementById('main').innerHTML=emptyState('No teams returned','The team aggregate returned zero rows, so there is nothing to profile yet. This is an empty response, not a failed one.','<button type="button" class="fs-btn" onclick="location.reload()">Reload</button>');
  }catch(e){document.getElementById('main').innerHTML=loadFailed(e)}
}

/* Every profile stat is a way into the ranking for that metric. A metric is

function metricRow(d,r){

const NA='not available from this endpoint';

const PROFILE_COLS=[['Control','Pressing','Output'],['Build-up phase','Possession shape'],['Attacking phase','Defending','Channels']];
const GROUP_TITLE={Defending:'Defending (conceded set)',Channels:'Final-third channels'};
const GROUP_NOTE={
  Pressing:'Lower PPDA is more pressing, not better. The source stores the PPDA percentile inverted, so a high percentile here means a lower PPDA.',
  Defending:'Conceded set: opponent events in the same fixtures. Lower raw values are better, and the stored percentile is already inverted so a high percentile is better.',
  Channels:'Shares describe where final-third involvement happens across the width; higher is not better. The three shares sum to 100%.'};
function groupTitle(g){return GROUP_TITLE[g]||g}
function groupId(g){return 'grp-'+slug(g)}
function groupNames(){const out=[];TDEFS.forEach(function(d){if(out.indexOf(d.grp)<0)out.push(d.grp)});return out}
function groupCard(g,t,p){
  const ms=TDEFS.filter(function(d){return d.grp===g});if(!ms.length)return'';

    '<span class="fs-label">'+ms.length+' measure'+(ms.length===1?'':'s')+'</span></div>';
  if(g==='Channels'){
    h+='<div class="tm-tiles">'+ms.map(function(d){
      const r=p[d.key],pc=r?.pct==null?null:+r.pct,go=rankable(d.key);
      const body='<small>'+esc(d.label)+'</small><b>'+(r?fmt(r.value,d.unit):'—')+'</b>'+
        '<small>'+(pc==null?'no percentile':'pct '+pc)+'</small><span>'+roleTag(d.key)+'</span>';
      return go?'<button class="tm-tile" title="'+esc(d.definition||'')+'"'+goAttrs(d.key,d.label)+'>'+body+'</button>'
               :'<div class="tm-tile" title="'+esc(d.definition||'')+'">'+body+'</div>'}).join('')+'</div>';
  }else ms.forEach(function(d){h+=metricRow(d,p[d.key])});

       number to show. It is listed so its absence is stated, never implied. */
    h+='<div class="tm-row" title="Goals scored minus expected goals"><span class="tm-row-lbl">Goals minus xG</span><span class="tm-row-val">—</span>'+

      '<span class="tm-row-sub">Team xG is '+NA+', so this is not computed'+((+t.matches||0)<10?'; with '+mcount(t.matches)+' the sample would be too short to rank in any case':'')+'.</span></div>';

     'PPDA and the conceded metrics are inverted by the source, so on a PERF metric a high percentile always means better. '+'Channel shares are descriptive, not good or bad — a high percentile just means they use that side more than most. '+'A possession ends when the opposition touch the ball or play stops for more than eight seconds. '+

/* The fixture list for one team: the two reads the Matches tab has always
   made, in one place so the Rankings per-match panel reads exactly the same
   rows rather than a second definition of them. */
async function teamMatchList(t){
  const rows=await sbAll('mv_team_match',{team:'eq.'+encodeURIComponent(t.team).replace(/%20/g,' '),select:'*'});
  const gids=rows.map(function(r){return r.game_id});
  const ms=gids.length?await sbAll('v_league_matches',{game_id:'in.('+gids.join(',')+')',select:'game_id,date,home_team,away_team,home_score,away_score'}):[];
  const mm={};ms.forEach(function(m){mm[m.game_id]=m});
  return rows.map(function(r){
    const m=mm[r.game_id]||{};const home=m.home_team===t.team;
    const gf=home?m.home_score:m.away_score,ga=home?m.away_score:m.home_score;
    return Object.assign({},r,{date:m.date,opp:home?m.away_team:m.home_team,ha:home?'H':'A',gf:gf,ga:ga,
      res:gf>ga?'W':(gf<ga?'L':'D')});
  }).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
}

const POOL_ORDER=['GK','CB','FB','CM','AM','W','ST'];
const POOL_NAME={GK:'Goalkeepers',CB:'Centre-backs',FB:'Full-backs',CM:'Central midfielders',AM:'Attacking midfielders',W:'Wingers',ST:'Strikers'};
function hasScore(p){return p.completeness!=null||p.impact!=null}
function scoreCell(v){
  if(v==null)return '<td class="num">—</td>';

}
function squadTable(rows,showP){

    ?'<col style="width:25%"><col style="width:8%"><col style="width:8%"><col style="width:9%"><col style="width:8%"><col style="width:8%"><col style="width:11%"><col style="width:9%"><col style="width:14%">'
    :'<col style="width:40%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:12%">')+
    '</colgroup><thead><tr><th>Player</th>'+

    '<th title="Role assigned from on-ball behaviour (role cohort)">Plays</th>'+
    '<th class="num">Mins</th><th class="num">90s</th><th class="num">Starts</th>'+
    (showP?'<th class="num" title="Role-cohort percentile">Completeness</th><th class="num" title="Role-cohort percentile">Impact</th><th>Strongest</th>':'')+
    '</tr></thead><tbody>';
  rows.forEach(function(p){
    const gk=p.pool==='GK',scored=hasScore(p),href='players.html?player='+encodeURIComponent(p.player_id);
    let score='';
    if(showP){
      if(scored)score=scoreCell(p.completeness)+scoreCell(p.impact)+'<td>'+esc(p.top_pillar||'—')+'</td>';
      else if(gk)score='<td colspan="3" class="tm-merge" title="Keepers are scored on goalkeeping, not the outfield pillars"><span class="fs-missing">n/a GK</span></td>';
      else score='<td colspan="3" class="tm-merge" title="No published DNA score for this player; eligibility belongs to the DNA measure, not the general percentile threshold. The nineties threshold itself is not returned by this endpoint."><span class="fs-missing">Values on profile · no percentiles published · source rule</span></td>';
    }
    h+='<tr tabindex="0" data-href="'+href+'"'+(scored||gk?'':' class="is-greyed"')+'>'+
      '<td><a tabindex="-1" href="'+href+'">'+esc(p.player_name)+'</a></td>'+
      '<td>'+esc(p.modal_position||'—')+'</td><td>'+esc(p.pool||'—')+'</td>'+
      '<td class="num">'+(p.minutes==null?'—':p.minutes)+'</td>'+
      '<td class="num">'+(+p.nineties).toFixed(1)+'</td><td class="num">'+p.starts+'</td>'+score+'</tr>';
  });
  return h+'</tbody></table>';
}
function squadGroups(rows){
  const byMin=function(a,b){return (+b.minutes||0)-(+a.minutes||0)||b.nineties-a.nineties};
  if(SQ.group==='flat')return [{title:'',rows:rows}];
  if(SQ.group==='minutes'){
    const mx=Math.max.apply(null,rows.map(function(p){return +p.minutes||0}).concat([1]));
    const bands=[{title:'Top third of minutes',rows:[]},{title:'Middle third of minutes',rows:[]},{title:'Bottom third of minutes',rows:[]}];
    rows.slice().sort(byMin).forEach(function(p){const s=(+p.minutes||0)/mx;bands[s>=2/3?0:(s>=1/3?1:2)].rows.push(p)});
    return bands.filter(function(b){return b.rows.length});
  }
  const pools=POOL_ORDER.slice();
  rows.forEach(function(p){if(p.pool&&pools.indexOf(p.pool)<0)pools.push(p.pool)});
  const out=pools.map(function(k){return {title:(POOL_NAME[k]||k)+' ('+k+')',rows:rows.filter(function(p){return p.pool===k}).sort(byMin)}});
  out.push({title:'Role not published',rows:rows.filter(function(p){return !p.pool}).sort(byMin)});
  return out.filter(function(g){return g.rows.length});
}

  const nScored=rows.filter(hasScore).length,nGK=rows.filter(function(p){return !hasScore(p)&&p.pool==='GK'}).length,nBelow=rows.length-nScored-nGK;
  const strip='<div class="tm-strip" role="img" aria-label="Minutes per player, most used first">'+used.map(function(p){

    '</b> below it, greyed · <b>'+nGK+'</b> goalkeepers n/a. Source rule: the endpoint publishes a score or it does not; the nineties threshold is not returned, so no number is asserted here.</p>';
  const groups=squadGroups(rows);
  const tables=groups.map(function(g){return (g.title?'<h3>'+esc(g.title)+'<small>'+g.rows.length+'</small></h3>':'')+squadTable(g.rows,showP)}).join('');

      segBtn('By position',SQ.group==='position',"SQ.group='position';renderSquadView()")+
      segBtn('By minutes',SQ.group==='minutes',"SQ.group='minutes';renderSquadView()")+
      segBtn('Flat',SQ.group==='flat',"SQ.group='flat';renderSquadView()")+'</span></span>'+
    '<span><span class="fs-label">Pillars</span><span class="fs-seg">'+
      segBtn('Pct',showP,"SQ.pillars='pct';renderSquadView()")+
      segBtn('Hide',!showP,"SQ.pillars='hide';renderSquadView()")+'</span></span></div>'+
    strip+
    '<div class="fs-banner" style="margin-top:var(--s4)"><span class="fs-banner-label">Not supplied</span><span class="fs-banner-text">Age, the six pillar percentiles (Passing, Creation, Shooting, Carrying, Defending, Aerial), TM value and the listed-versus-behaviour mismatch flag are '+NA+
      '. What it does return per player is shown: listed position, behaviour role, minutes, nineties, starts, and the published role-cohort scores Completeness, Impact and strongest pillar.</span></div>'+
    '<div class="fs-table-wrap" tabindex="0"><div class="tm-squad">'+tables+'</div></div>'+
    (showP?legendHtml():'')+
    '<p class="tm-foot">Completeness and Impact are ranked within each player’s role across the league, not within this squad: they are percentiles inside each player’s own role cohort and are not comparable across different roles. '+
    '<b>n/a</b> means the player is under the published DNA coverage or is a goalkeeper; DNA eligibility is separate from general player percentiles. '+
    '<a class="fs-link" href="evidence-contracts.html#eligibility">Eligibility (source rule)</a></p>'+
    '<div class="fs-panel-foot"><span class="fs-note">Any row opens that player in Player fingerprints.</span>'+expBtns('png,pdf,csv')+'</div></section>';
}
async function renderSquad(t){
  const current=teamRequest();
  try{
    const r=await Promise.all([
      sbAll('mv_player_season',{team:'eq.'+t.team,select:'player_id,player_name,nineties,minutes,starts'}),
      sbAll('mv_player_role',{select:'player_id,pool,modal_position'}),
      sbAll('mv_player_dna',{select:'player_id,completeness,impact,top_pillar'})
    ]);
    if(!current())return;
    const rm={};r[1].forEach(function(x){rm[x.player_id]=x});
    const dm={};r[2].forEach(function(x){dm[x.player_id]=x});

}

function outcomeNote(){

function inZone(x,y){
  if(MP.third==='def'&&!(x<33.3))return false;
  if(MP.third==='mid'&&!(x>=33.3&&x<66.7))return false;
  if(MP.third==='att'&&!(x>=66.7))return false;
  // verified from the data: low y is the attacking team's right, high y their left
  if(MP.lane==='R'&&!(y<33.3))return false;
  if(MP.lane==='C'&&!(y>=33.3&&y<66.7))return false;
  if(MP.lane==='L'&&!(y>=66.7))return false;
  return true;
}
function zoneShade(){
  if(!MP.third&&!MP.lane)return'';
  const x0=MP.third==='def'?0:(MP.third==='mid'?33.3:(MP.third==='att'?66.7:0));
  const x1=MP.third==='def'?33.3:(MP.third==='mid'?66.7:(MP.third==='att'?100:100));
  const y0=MP.lane==='R'?0:(MP.lane==='C'?33.3:(MP.lane==='L'?66.7:0));
  const y1=MP.lane==='R'?33.3:(MP.lane==='C'?66.7:(MP.lane==='L'?100:100));
  /* Gold is the zone-shading role: it marks which zone the filter is on. It
     does not encode a value and it is not selection state. */
  return '<rect class="fs-pitch-zone" x="'+PX(x0)+'" y="'+PY0(y0,y1)+'" width="'+PX(x1-x0)+'" height="'+PYH(y0,y1)+

function zoneNote(){
  if(!MP.third&&!MP.lane)return'';
  const t={def:'defensive third',mid:'middle third',att:'final third'}[MP.third]||'';
  const l={L:'left',C:'central',R:'right'}[MP.lane]||'';
  return ' Filtered to '+[l,t].filter(Boolean).join(' ')+(l&&!t?' channel':'')+'.';
}

/* Small hollow ring at the point the action began. Used on the maps where the

function shotMark(x,y,r,c,op,oc){

  if(oc==='off'||oc==='post')

  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+c+'" fill-opacity="'+op+'"/>';
}
function shotOutcomeLegend(counts,forTeam){

  const labels={goal:'Goal',saved:'Saved',blocked:'Blocked',post:'Post',off:'Off target'};
  const glyph={
    goal:function(c){return '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="'+c+'" stroke-opacity=".55"/><circle cx="8" cy="8" r="3.7" fill="'+c+'"/></svg>'},

    blocked:function(c){return '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16"><path d="M8 1.5L14.5 8L8 14.5L1.5 8Z" fill="'+c+'" fill-opacity=".75"/></svg>'},
    post:function(c){return '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="'+c+'" stroke-width="2"/></svg>'},

function origin(a,c,w,op){
  const sx=(a.start_x!=null?a.start_x:a.x), sy=(a.start_y!=null?a.start_y:a.y);
  return '<circle cx="'+PX(sx)+'" cy="'+PY(sy)+'" r="'+(w*1.0).toFixed(2)+'" fill="none" stroke="'+c+
    '" stroke-width="'+(w*0.5).toFixed(2)+'" stroke-opacity="'+(op*0.85).toFixed(2)+'"/>';

/* Tapered comet, narrow at the origin and full width where the ball arrives. */
function tline(a,c,w,op){
  const x1=PX(a.x),y1=PY(a.y),x2=PX(a.end_x),y2=PY(a.end_y);
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1;
  const nx=-dy/len, ny=dx/len, t=w*0.16, h=w*0.78;
  const body='<path d="M'+(x1+nx*t).toFixed(2)+' '+(y1+ny*t).toFixed(2)+
    'L'+(x2+nx*h).toFixed(2)+' '+(y2+ny*h).toFixed(2)+
    'L'+(x2-nx*h).toFixed(2)+' '+(y2-ny*h).toFixed(2)+
    'L'+(x1-nx*t).toFixed(2)+' '+(y1-ny*t).toFixed(2)+
    'Z" fill="'+c+'" fill-opacity="'+op+'"/>';
  return body+(c===TPAL.fail?'<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+
    '" stroke="'+c+'" stroke-width="'+Math.max(.16,w*.55)+'" stroke-opacity=".9" stroke-dasharray="1.2 .8"/>':'');
}
/* Aggregate season actions into a coarse 6 x 4 grid so the default view shows
   recurring routes, not a hairball of hundreds of individual vectors. */
function flowPattern(items,color,limit){
  const NX=6,NY=4,orig={},flows={};
  function zone(x,y){const ix=Math.max(0,Math.min(NX-1,Math.floor((+x||0)/100*NX)));
    const iy=Math.max(0,Math.min(NY-1,Math.floor((+y||0)/100*NY)));return ix+','+iy}
  function centre(k){const p=k.split(',').map(Number);return{x:(p[0]+.5)*100/NX,y:(p[1]+.5)*100/NY}}
  items.forEach(function(a){
    const sx=a.start_x!=null?a.start_x:a.x,sy=a.start_y!=null?a.start_y:a.y;
    if(sx==null||sy==null||a.end_x==null||a.end_y==null)return;
    const f=zone(sx,sy),t=zone(a.end_x,a.end_y);orig[f]=(orig[f]||0)+1;
    if(f!==t){const k=f+'>'+t;flows[k]=(flows[k]||0)+1}
  });
  const os=Object.keys(orig).sort(),fs=Object.keys(flows).sort(function(a,b){return flows[b]-flows[a]||a.localeCompare(b)}).slice(0,limit||8);
  const om=Math.max.apply(null,os.map(function(k){return orig[k]}).concat([1]));
  const fm=Math.max.apply(null,fs.map(function(k){return flows[k]}).concat([1]));
  let s='<g class="pattern-layer">';
  os.forEach(function(k){const p=centre(k),q=Math.sqrt(orig[k]/om);s+='<circle cx="'+PX(p.x)+'" cy="'+PY(p.y)+
    '" r="'+(1.1+3.2*q).toFixed(2)+'" fill="'+color+'" fill-opacity="'+(0.07+0.16*q).toFixed(2)+'"/>'});
  fs.forEach(function(k,idx){const a=k.split('>'),p=centre(a[0]),q=centre(a[1]),x1=PX(p.x),y1=PY(p.y),x2=PX(q.x),y2=PY(q.y);
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    const w=.45+1.7*Math.sqrt(flows[k]/fm),ah=1.5+w*.65,bx=x2-ux*ah,by=y2-uy*ah;
    s+='<line x1="'+x1.toFixed(2)+'" y1="'+y1.toFixed(2)+'" x2="'+x2.toFixed(2)+'" y2="'+y2.toFixed(2)+
      '" stroke="'+color+'" stroke-width="'+w.toFixed(2)+'" stroke-opacity="'+(.34+.5*flows[k]/fm).toFixed(2)+'" stroke-linecap="round"'+
      (color===TPAL.fail?' stroke-dasharray="1.2 .8"':'')+'/>'+
      '<path d="M'+x2.toFixed(2)+' '+y2.toFixed(2)+'L'+(bx+nx*ah*.55).toFixed(2)+' '+(by+ny*ah*.55).toFixed(2)+
      'L'+(bx-nx*ah*.55).toFixed(2)+' '+(by-ny*ah*.55).toFixed(2)+'Z" fill="'+color+'" fill-opacity=".86"/>';
    if(idx<3){const mx=(x1+x2)/2+nx*1.8,my=(y1+y2)/2+ny*1.8;
      s+='<text class="m" x="'+mx.toFixed(2)+'" y="'+(my+.5).toFixed(2)+'" text-anchor="middle" fill="var(--ink)" font-size="1.6" font-weight="500" stroke="var(--pitch)" stroke-width=".65" paint-order="stroke">'+flows[k]+'</text>'}
  });
  return s+'</g>';
}
/* Keep explicit event drill-downs responsive across a full season. The sample is
   deterministic and evenly spaced through the returned population; the legend
   continues to report the complete population. */
function mapSample(items,limit){
  if(items.length<=limit)return items;
  const out=[],step=items.length/limit;
  for(let i=0;i<limit;i++)out.push(items[Math.floor(i*step)]);
  return out;
}
function mapSampleNote(all,shown,label){
  return shown.length<all.length?'<span>Displaying '+shown.length.toLocaleString()+' of '+all.length.toLocaleString()+' '+(label||'events')+' · evenly sampled from the returned population · use zone filters to refine</span>':'';
}

    (fail?'<span><i style="background:'+TPAL.fail+'"></i>Incomplete · dashed <b>'+fail.toLocaleString()+'</b></span>':'');

function heatLayer(rows){
  const GW=42,GH=28,cw=105/GW,ch=68/GH;
  const g=[];for(let j=0;j<GH;j++)g.push(new Float32Array(GW));
  rows.forEach(function(a){
    const i=Math.min(GW-1,Math.max(0,Math.floor(a.x/100*GW)));
    const j=Math.min(GH-1,Math.max(0,Math.floor(a.y/100*GH)));
    g[j][i]++;
  });
  let mx=0;for(let j=0;j<GH;j++)for(let i=0;i<GW;i++)if(g[j][i]>mx)mx=g[j][i];
  if(!mx)mx=1;
  let s2='<defs><filter id="hblur" x="-12%" y="-12%" width="124%" height="124%">'+
         '<feGaussianBlur stdDeviation="2.1"/></filter></defs><g filter="url(#hblur)">';
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){
    const v=g[j][i]/mx; if(v<0.04)continue;
    /* Density is a magnitude, so it is one hue getting stronger: the gold of
       the zone shading, by opacity. */
    const t=Math.pow(v,0.62);
    s2+='<rect x="'+(i*cw)+'" y="'+(j*ch)+'" width="'+(cw+0.35)+'" height="'+(ch+0.35)+
        '" fill="var(--gold)" fill-opacity="'+(0.08+0.84*t).toFixed(3)+'"/>';
  }
  return s2+'</g>';
}

function laneViz(t){
  const L=LANES&&LANES[t.team];if(!L)return'';
  const get=function(k){return L[k]?+L[k].pct_of_final_third:0};
  const l=get('L'),c=get('C'),r=get('R');
  // low y is their right, high y their left, confirmed against full-back positions
  const bands=[{k:'R',lbl:'Right',v:r,y0:0,y1:33.3},{k:'C',lbl:'Centre',v:c,y0:33.3,y1:66.7},{k:'L',lbl:'Left',v:l,y0:66.7,y1:100}];
  const mx=Math.max(l,c,r)||1;
  let inner='';
  bands.forEach(function(b){
    const t2=b.v/mx;
    /* Share of involvement is a magnitude, so it reads as one ink getting
       stronger, not as the brand colour. */
    inner+='<rect x="'+PX(50)+'" y="'+PY0(b.y0,b.y1)+'" width="'+PX(50)+'" height="'+PYH(b.y0,b.y1)+
           '" fill="var(--ink)" fill-opacity="'+(0.05+0.3*t2).toFixed(3)+'"/>';
    inner+='<text class="m" x="'+PX(76)+'" y="'+(PY((b.y0+b.y1)/2)+1.2)+'" fill="var(--ink)" font-size="4.6" font-weight="500" '+
           'text-anchor="middle">'+b.v.toFixed(1)+'%</text>';
    inner+='<text class="m" x="'+PX(76)+'" y="'+(PY((b.y0+b.y1)/2)+6.2)+'" fill="var(--muted)" font-size="2.6" '+
           'text-anchor="middle" letter-spacing="0.3">'+b.lbl.toUpperCase()+'</text>';
  });
  const domi=l>c&&l>r?'down the left':(r>c&&r>l?'down the right':'through the middle');
  return pitchWrap('Which side they attack the final third',
    'Share of involvement in the <b>final third only</b>, split by channel. This team works '+domi+'. '+
    'Attack runs left to right, so the bottom band is their right and the top band their left.',
    inner,
    '<span><i style="border-radius:var(--radius);background:color-mix(in srgb,var(--ink) 35%,transparent)"></i>'+
    'Stronger band = more of their final-third play</span>');
}

const MATCH_COL={shots_pg:'shots',goals_pg:'goals',shots_against_pg:'opp_shots',goals_against_pg:'opp_goals',

function rankData(){
  const d=tdefOf(RKT.metric)||{};
  const all=scopedTeams().map(function(t){
    const p=(PCT[t.team]||{})[RKT.metric];
    return{team:t.team,matches:+t.matches||0,value:t[RKT.metric]==null?NaN:+t[RKT.metric],pct:p?.pct==null?null:+p.pct};
  }).filter(function(r){return !isNaN(r.value)});
  all.sort(function(a,b){return (b.pct==null?-1:b.pct)-(a.pct==null?-1:a.pct)});
  const min=Math.max(1,Math.floor(+RK.min)||1);
  const ranked=all.filter(function(r){return r.matches>=min}),below=all.filter(function(r){return r.matches<min});
  const vals=all.map(function(r){return r.value});
  return {d:d,all:all,ranked:ranked,below:below,min:min,
    vmin:vals.length?Math.min.apply(null,vals):0,vmax:vals.length?Math.max.apply(null,vals):0,
    med:median(ranked.map(function(r){return r.value}))};
}

/* z-score to a direction class. Blue is higher than the stored pool and gold
   is lower: direction of style, never better and worse, so no percentile band. */
function zBand(z){
  if(z==null)return {k:'',t:'Comparison unavailable'};
  if(z>=1.5) return {k:'is-hi', t:'much higher than stored pool'};
  if(z>=0.6) return {k:'is-hi', t:'higher than stored pool'};
  if(z<=-1.5)return {k:'is-lo', t:'much lower than stored pool'};
  if(z<=-0.6)return {k:'is-lo', t:'lower than stored pool'};
  return {k:'', t:'around stored pool average'};
}

    const r=await Promise.all([
      sbAll('team_sequence_agg',{team:'eq.'+t.team,select:'*'}),
      sbAll('team_sequence_style',{team:'eq.'+t.team,select:'metric,raw,z'})
    ]);
    if(!current())return;
    const a=(r[0]||[])[0];
    if(!a){main.innerHTML=teamHead(t)+emptyState('No sequence data for this team yet.','The sequence aggregate returned no row for '+esc(tname(t.team))+'. A pool with no stored chains cannot be read as the team having none.',
      '<a class="fs-btn" href="sequences.html">Open Possession sequences</a>');return}
    const Z={},RAW={};(r[1]||[]).forEach(function(x){Z[x.metric]=x.z==null?null:+x.z;RAW[x.metric]=x.raw==null?null:+x.raw});
    let cards='<section class="fs-panel" data-tm-card><div class="fs-panel-h"><h2>Sequence output</h2>'+
      '<span class="fs-label">'+mcount(a.matches)+' · open play · colour shows distance from the stored comparison pool</span></div>';
    SEQ_GROUPS.forEach(function(grp){
      let tiles='';
      grp.m.forEach(function(c){
        const v=a[c[0]];if(v==null)return;
        const z=Z[c[0]];const b=zBand(z);
        const val=(+v).toFixed(c[2])+(c[3]==='%'?'%':'');
        tiles+='<div class="stile" title="'+esc(b.t)+(z==null?'':' ('+zFmt(z)+'σ)')+'">'+
          '<div class="stile-l">'+esc(c[1])+'</div>'+
          '<div class="stile-v '+b.k+'">'+val+'</div>'+
          '<div class="stile-z">'+(z==null?'':zFmt(z)+'σ')+'</div></div>';
      });
      if(!tiles)return;
      cards+='<div class="sgrp"><div class="sgrp-h">'+esc(grp.g)+
        '<span class="sgrp-d">'+esc(grp.d)+'</span></div>'+
        '<div class="sgrid">'+tiles+'</div></div>';
    });
    cards+='<div class="fs-panel-foot"><a class="fs-link" href="sequences.html">Open Possession sequences</a>'+expBtns('png,pdf')+'</div></section>';
    const radar=seqRadar(t,Z,RAW);
    main.innerHTML=teamHead(t)+'<div class="fs-stack">'+cards+radar+'</div>'+
      '<p class="tm-foot">Sequence style is shown as z-scores from the comparison pool stored by the sequence view. The centre line is that pool mean; each full half-rail spans 2.5 standard deviations. '+
      'Blue means higher than the stored comparison pool and gold means lower, not better and worse. Read longer bars as stronger stylistic signals and near-centre bars lightly. '+
      'Hold-up and central-prog use deliberately strict definitions — see the <a class="fs-link" href="glossary.html">glossary</a>. '+
      'Open play only; a possession is a run of controlled touches by one team, ended by a turnover, stoppage or set piece.</p>';
    wireTips();
  }catch(e){if(current())main.innerHTML=errorState(t,e)}
}
function seqRadar(t,Z,RAW){
  let s='<div class="dev-legend"><span class="dev-key"><i class="is-lo"></i>Lower than pool</span>'+
    '<span>−2.5σ</span><span>Pool mean</span><span>+2.5σ</span>'+
    '<span class="dev-key"><i class="is-hi"></i>Higher than pool</span></div><div class="dev-groups">';
  SEQ_GROUPS.forEach(function(grp){
    s+='<div class="dev-group"><div class="dev-group-h">'+esc(grp.g)+'</div>';
    grp.m.forEach(function(m){
      if(Z[m[0]]==null){s+='<div class="dev-row"><div class="dev-lbl">'+esc(m[1])+'</div><div>Comparison unavailable</div></div>';return;}
      const z=+Z[m[0]],zc=Math.max(-2.5,Math.min(2.5,z));
      const end=50+(zc/2.5)*50,left=Math.min(50,end),width=Math.max(z===0?0:1,Math.abs(end-50));
      const raw=RAW[m[0]],rawtxt=raw==null?'—':(+raw).toFixed(m[2])+(m[3]||'');
      const cls=z<0?'is-lo':'is-hi';
      s+='<div class="dev-row" title="'+esc(m[1])+': '+rawtxt+'; '+zFmt(z)+' standard deviations">'+
        '<div class="dev-lbl">'+esc(m[1])+'</div><div class="dev-track"><i class="dev-zero"></i>'+
        '<i class="dev-fill '+cls+'" style="left:'+left.toFixed(1)+'%;width:'+width.toFixed(1)+'%"></i></div>'+
        '<div class="dev-val">'+rawtxt+'<span class="dev-z">'+zFmt(z)+'σ</span></div></div>';
    });
    s+='</div>';
  });
  s+='</div>';
  return '<section class="fs-panel" data-tm-card><div class="fs-panel-h"><h2>'+esc(tname(t.team))+' — deviations from stored comparison pool</h2>'+
    '<span class="fs-label">Season style</span></div>'+
    '<p class="fs-sub">The same numbers as above, grouped by football question. Each bar shows how far '+
    esc(tname(t.team))+' sits from the stored comparison pool mean (league membership is not supplied by this view). Direction describes style, not quality; '+
    'the raw value and exact z-score remain beside every bar.</p>'+
    s+'<div class="fs-panel-foot"><span class="fs-push" data-noexport><button type="button" class="fs-btn k" data-export data-fmt="png">PNG</button><button type="button" class="fs-btn k" data-export data-fmt="pdf">PDF</button></span></div></section>';
}

function wireTips(){
  const main=document.getElementById('main');
  const hits=[...main.querySelectorAll('.hit[data-n]')];if(hits.length&&!main.querySelector('.exact-marks')){const details=document.createElement('details');details.className='fs-details exact-marks';details.style.marginTop='var(--s5)';details.setAttribute('data-tm-card','');details.innerHTML='<summary>Exact plotted observations ('+hits.length+')</summary><div class="fs-table-wrap" style="max-height:260px" tabindex="0"><table class="fs-table"><thead><tr><th>Observation</th><th>Value</th></tr></thead><tbody>'+hits.map(el=>'<tr><td>'+esc(el.dataset.n)+'</td><td class="num">'+esc(el.dataset.v||'unavailable')+'</td></tr>').join('')+'</tbody></table></div><div class="fs-panel-foot" style="margin:var(--s3) var(--s4)">'+expBtns('csv')+'</div>';main.append(details);}
  if(main.dataset.tipsBound)return;
  main.dataset.tipsBound='1';
  const tip=document.getElementById('tip');
  main.addEventListener('mousemove',function(e){
    const el=e.target.closest?e.target.closest('.pt,.hit'):null;
    if(el&&el.getAttribute('data-n')){
      tip.innerHTML='<div>'+esc(el.getAttribute('data-n'))+'</div>'+
        '<small>'+esc(el.getAttribute('data-v')||'')+'</small>';
      tip.style.display='block';
      tip.style.left=Math.min(window.innerWidth-290,e.clientX+13)+'px';tip.style.top=(e.clientY+13)+'px';
    } else tip.style.display='none';
  });
  main.addEventListener('mouseleave',function(){tip.style.display='none'});
}
/* The band key. Shown only where a PERF percentile is on screen. */
function legendHtml(){return '<div class="tm-bands"><span class="fs-label">PERF percentile bands</span>'+[['var(--p80)','Elite 80+'],['var(--p60)','Above 60+'],
  ['var(--p40)','Average 40+'],['var(--p20)','Below 20+'],['var(--p0)','Poor']]
  .map(function(a){return '<span><i style="background:'+a[0]+'"></i>'+a[1]+'</span>'}).join('')+'</div>'}

/* ---------- EXPORTS ---------- */
/* PNG and PDF are always light. The card is cloned into an off-screen
   .fs-light surface, so every token resolves to the light palette whatever the
   page theme is, and the shared exporter captures that surface. SVG marks get
   their resolved colours written inline first: an SVG is rasterised on its
   own, where a var() has nothing to resolve against. */
async function exportCard(card,format){
  if(!window.FutScoutExports){alert('Export tools are still loading. Please retry.');return;}
  const holder=document.createElement('div'),surface=document.createElement('div'),clone=card.cloneNode(true);
  holder.className='tm-export-holder';holder.style.width=Math.max(760,card.clientWidth)+'px';
  surface.className='fs-light tm-export';
  clone.removeAttribute('id');clone.classList.remove('narrow');
  clone.querySelectorAll('[data-noexport]').forEach(function(node){node.remove()});
  clone.querySelectorAll('[id]').forEach(function(node){if(!node.closest('svg'))node.removeAttribute('id')});
  surface.appendChild(clone);holder.appendChild(surface);document.body.appendChild(holder);
  try{
    surface.dataset.exportContext=JSON.stringify(window.futScoutExportContext(card));
    clone.querySelectorAll('svg *').forEach(function(node){
      const cs=getComputedStyle(node);node.style.fill=cs.fill;node.style.stroke=cs.stroke;
      if(node.tagName.toLowerCase()==='text')node.style.fontFamily=cs.fontFamily;
    });
    /* The exporter clones what it is handed before its first await. */
    const done=window.FutScoutExports.capture(surface,format);
    holder.remove();
    await done;
  }finally{holder.remove()}
}
async function exportPNG(){await exportCard(document.getElementById('main'),'png');}
async function exportPDF(){await exportCard(document.getElementById('main'),'pdf');}
function mapWords(){
  const m=MAPS.filter(function(x){return x.k===MP.kind})[0]||MAPS[0];
  const parts=[m.l];
  if(['passes','prog','box','carries','combined'].indexOf(m.k)>=0)parts.push(MP.mode==='events'?'individual events':'zone pattern');
  if(['passes','prog','box'].indexOf(m.k)>=0)parts.push(MP.outcome==='ok'?'successful only':(MP.outcome==='fail'?'unsuccessful only':'both outcomes'));
  if(m.k==='def')parts.push(MP.defMode==='wins'?'ball wins':(MP.defMode==='interventions'?'interventions':'failures'));
  parts.push({def:'defensive third',mid:'middle third',att:'final third'}[MP.third]||'all thirds');
  parts.push({L:'left channel',C:'central channel',R:'right channel'}[MP.lane]||'full width');
  return parts.join('; ');
}
/* A flat object of readable strings. The shared exporter prints it as the
   stamp under every PNG and PDF, and the CSV header is built from it. */
window.futScoutExportContext=function(){
  const t=SEL&&teamOf(SEL),lg=t?lgName(lgOf(t.team)):lgScopeLabel();
  const snap=window.FutScout&&FutScout.snapshot?FutScout.snapshot():null;
  const teamView=TAB!=='League Map'&&TAB!=='Rankings';
  const o={
    entity:teamView?(t?tname(t.team)+' ('+lg+')':'No team selected'):('All teams in '+lgScopeLabel()+(SEL?', '+tname(SEL)+' highlighted':'')),
    view:TAB,
    scope:lgScopeLabel()+'; stored season aggregate'+(t&&teamView?'; '+mcount(t.matches):''),
    cohort:popLine()
  };
  if(TAB==='Rankings'){const d=tdefOf(RKT.metric)||{};
    o.metric=(d.label||RKT.metric)+' ('+(isPerf(RKT.metric)?'PERF':'STYLE')+')';
    o.filters='min matches '+Math.max(1,Math.floor(+RK.min)||1)+'; league median '+(RK.median?'shown':'hidden')+'; highlight '+(RK.highlight?'on':'off')}
  else if(TAB==='League Map'){o.filters='x axis '+((tdefOf(LM.x)||{}).label||LM.x)+'; y axis '+((tdefOf(LM.y)||{}).label||LM.y)+'; six-match minimum'}
  else if(TAB==='Maps'){o.filters=mapWords()+'; attack left to right, team right at the bottom edge'}
  else if(TAB==='Squad'){o.filters='grouped '+(SQ.group==='position'?'by position':(SQ.group==='minutes'?'by minutes':'flat'))+'; role-cohort scores '+(SQ.pillars==='pct'?'shown':'hidden');
    o.cohort='Completeness and Impact: percentile within each player’s own role cohort across the league; source rule decides who is scored'}
  else o.filters='none';
  o.snapshot=snap?('data snapshot '+snap.text+', '+snap.age+(snap.stale?', STALE':'')):'data snapshot not reported';
  return o;
};
function csvDownload(title,rows){
  const ctx=window.futScoutExportContext();
  const head=[['FutScout',title],['League',lgScopeLabel()],['Entity',ctx.entity],['View',ctx.view],['Filters',ctx.filters],
    ['Population',ctx.cohort],['Snapshot',ctx.snapshot],['Exported',new Date().toISOString()],['Source',location.href],[]];
  const text=head.concat(rows).map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
  const url=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');
  a.href=url;a.download=('futscout-teams-'+title).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.csv';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);
  toast('CSV exported · '+Math.max(0,rows.length-1)+' rows');
}
/* CSV exports the full table, not what fits on screen. Squad and Rankings are
   built from the data; the other tables are read from the card. */
function exportCSV(card){
  if(TAB==='Squad'&&SQD&&card.querySelector('.tm-squad')){
    const rows=[['Player','Player id','Listed (modal position)','Plays (behaviour role)','Minutes','Nineties','Starts','Completeness (role-cohort pct)','Impact (role-cohort pct)','Strongest pillar','Score status']];
    SQD.rows.forEach(function(p){rows.push([p.player_name,p.player_id,p.modal_position,p.pool,p.minutes,p.nineties,p.starts,p.completeness,p.impact,p.top_pillar,
      hasScore(p)?'published':(p.pool==='GK'?'n/a GK':'no percentiles published (source rule)')])});
    return csvDownload(tname(SQD.team)+' squad',rows);
  }
  if(TAB==='Rankings'&&card.id!=='rkMatch'){
    const R=rankData(),d=R.d,rows=[['Rank','Team','League',(d.label||RKT.metric)+(d.unit?' ('+d.unit+')':''),'League percentile (stored)','Matches','Status']];
    R.ranked.forEach(function(r,i){rows.push([i+1,tname(r.team),lgName(lgOf(r.team)),r.value,r.pct,r.matches,'ranked'])});
    R.below.forEach(function(r){rows.push(['',tname(r.team),lgName(lgOf(r.team)),r.value,r.pct,r.matches,'below min matches: shown, not ranked'])});
    rows.push([]);rows.push(['Median of ranked teams','','',R.med]);
    return csvDownload((d.label||RKT.metric)+' ranking',rows);
  }
  const rows=[];
  card.querySelectorAll('table').forEach(function(table){table.querySelectorAll('tr').forEach(function(tr){
    rows.push([].map.call(tr.querySelectorAll('th,td'),function(c){return c.textContent.replace(/\s+/g,' ').trim()}))})});
  const title=card.querySelector('h2,h3,summary');
  csvDownload((SEL&&TAB!=='League Map'?tname(SEL)+' ':'')+(title?title.textContent.trim():TAB),rows);
}

/* One listener for the rows and buttons the views render. Names go through
   data attributes, so a club or player name can never break out of a handler. */
document.addEventListener('click',function(e){
  const el=e.target&&e.target.closest?e.target:null;if(!el)return;
  const ex=el.closest('[data-export][data-fmt]');
  if(ex){const card=ex.closest('[data-tm-card]')||document.getElementById('main');
    if(ex.dataset.fmt==='csv')exportCSV(card);else exportCard(card,ex.dataset.fmt);return}
  const a=el.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='pick'){pick(a.dataset.team);const on=document.querySelector('#tlist [aria-current]');if(on)on.focus({preventScroll:true})}
    else if(act==='profile')openProfile(a.dataset.team);
    else if(act==='rank')rankBy(a.dataset.key);
    else if(act==='metric'){RKT.metric=a.dataset.key;renderRankings()}
    else if(act==='jump'){const g=document.getElementById(a.dataset.target);if(g){g.scrollIntoView({block:'start'});g.focus({preventScroll:true})}}
    return}
  const row=el.closest('tr[data-href]');
  if(row&&!el.closest('a,button'))location.href=row.dataset.href;
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&e.target.matches&&e.target.matches('tr[data-href]'))location.href=e.target.dataset.href;
});

init();

/* Published as-of date. Derived from the last analytics rebuild that actually
   completed, not from when a summary table was last touched.
   mv_site_summary.refreshed_at reports when refresh_site_summaries last ran,
   which is independent of whether the analytics layer rebuilt: on 14 September
   it read 17:41 while every metric matview was from 1 September. A failed gate
   deliberately leaves this stamp where it was, so fresher but unverified data
   sits behind an honest stale date rather than a confident wrong one. */
var ASOF=null;
function renderAsOf(){
  var el=document.getElementById('asOf'); if(!el) return;
  if(!ASOF||!ASOF.as_of){ el.textContent='as of unavailable'; el.className='as-of warn'; return; }
  var d=new Date(ASOF.as_of);
  var txt='data as of '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+
          ' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(ASOF.is_stale) txt+=' · '+Math.round(ASOF.hours_old)+'h old';
  el.textContent=txt;
  el.className='as-of'+(ASOF.is_stale?' warn':'');
  if(window.FutScout)FutScout.setFreshness(ASOF);
}
fetch(SB+'/rest/v1/v_analytics_as_of?select=*',{headers:HD})
  .then(function(r){return r.ok?r.json():null})
  .then(function(rows){ ASOF=rows&&rows[0]||null; renderAsOf(); })
  .catch(function(){ renderAsOf(); });
</script>
