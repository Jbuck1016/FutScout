<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metric reference · FutScout</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=pr1">
<script src="site-tools.js?v=pr1"></script>
<style>
/* Metric reference. Tokens come from theme.css, chrome from shell.css and the
   fs- components from components.css. What is left here is the page's own
   reading layout: a directory rail beside one long document of definitions.
   Every definition is an <article id="m-<slug of the metric key>"> and every
   category a <section id="cat-<slug of the category name>">, so other pages can
   link straight to them. */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 13px/1.45 var(--body)}
.wrap{display:grid;grid-template-columns:var(--rail-wide) minmax(0,1fr);align-items:start;min-width:0}

/* Directory rail: stays beside the document while it scrolls. */
.side{position:sticky;top:0;align-self:start;max-height:100vh;min-width:0;display:flex;flex-direction:column;
  background:var(--panel);border-right:1px solid var(--rule)}
.side-top{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.list{position:relative;flex:1 1 auto;padding-bottom:var(--s6)}
.gh{position:sticky;top:0;z-index:1;display:flex;align-items:center;min-height:var(--tap);padding:0 var(--s3);
  background:var(--panel2);border-bottom:1px solid var(--rule);color:var(--muted);text-decoration:none;
  font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
a.gh:hover{color:var(--ink)}
.gh:focus-visible,.mi:focus-visible{outline-offset:-2px}
/* Picking a metric opens its entry in the document beside the list, so each
   row is a real button. */
.mi{min-height:var(--tap);align-items:center;flex:0 0 auto}
.mi-k{font:400 10px/1.2 var(--mono);color:var(--muted);white-space:nowrap;flex:0 0 auto}

/* The document */
.main{min-width:0;padding:var(--s6) 24px 60px}
.main>h1{margin:0 0 var(--s6)}
.cat{margin:0 0 32px}
.cat-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s2) var(--s4);margin:0 0 0 -13px;padding:0 0 var(--s3) var(--s4);
  border-left:3px solid transparent;border-bottom:1px solid var(--ink);font:600 24px/1.1 var(--display);scroll-margin-top:var(--s5)}
.cat-h:focus{outline:none}
.cat-h.is-target{border-left-color:var(--accent)}
.def{margin-left:-13px;padding:var(--s5) var(--s4);border-left:3px solid transparent;border-bottom:1px solid var(--rule);scroll-margin-top:var(--s4)}
.def:focus{outline:none}
.def.on{border-left-color:var(--accent);background:var(--panel)}
.def[hidden],.cat[hidden]{display:none}
.def-in{max-width:65ch;font-size:15px}
.e-eye{font:500 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.e-t{margin:var(--s2) 0 var(--s1);font:500 20px/1.2 var(--display)}
.e-k{font:400 11px/1.4 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.e-k a{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.e-k a:hover{color:var(--ink);text-decoration-color:var(--ink)}
.e-d{margin:var(--s4) 0 0;font:400 15px/1.6 var(--body);color:var(--ink)}
.blk{margin-top:var(--s5)}
.blk-h{margin:0 0 var(--s2);font:500 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.blk-b p{margin:var(--s3) 0 0;font:400 13px/1.45 var(--body)}
.calc{padding:var(--s3) var(--s4);background:var(--panel2);border:1px solid var(--rule);border-radius:var(--radius);
  font:400 12px/1.6 var(--mono);color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.def.on .calc{background:var(--bg)}
.def-tog{margin-top:var(--s5)}
.def-more[hidden]{display:none}

.stat-row{display:flex;gap:var(--s4) var(--s6);flex-wrap:wrap}
.st{min-width:80px}
.st-l{font:500 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.st-v{margin-top:var(--s1);font:500 16px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.st-v.is-muted{color:var(--muted)}

.ex{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
/* An example card with a player on it goes to that player's page, so it is a
   real link; the card with no qualifying player stays a plain div. */
.ex-c{display:block;min-width:0;padding:var(--s4);background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);color:inherit;text-decoration:none}
.def.on .ex-c{background:var(--bg)}
a.ex-c:hover{border-color:var(--ink)}
.ex-l{font:500 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ex-n{margin:var(--s3) 0 var(--s1);font:500 16px/1.2 var(--display);overflow-wrap:anywhere}
.ex-m{font:400 11px/1.4 var(--body);color:var(--muted)}
.ex-m.is-none{margin-top:var(--s3)}
.ex-v{margin-top:var(--s3);font:500 20px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.ex-go{margin-top:var(--s3);font:400 10px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
a.ex-c:hover .ex-go{color:var(--ink)}
.read{margin-top:var(--s4);font:400 13px/1.6 var(--body);color:var(--muted)}
.blk-b>.read:first-child{margin-top:0}
.read b{color:var(--ink);font-weight:600}
/* A real limitation of the metric: the gold caution rule, never the accent. */
.warn{padding:var(--s3) var(--s4);border:1px solid var(--gold);border-radius:var(--radius);font:400 13px/1.6 var(--body);color:var(--ink)}
.state{max-width:65ch}
.state .fs-skel.title{margin-bottom:var(--s5)}

@media (max-width:760px){
  /* One column, the directory above the document, its list capped and scrolling. */
  .wrap{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--ink)}
  .list{max-height:168px;padding-bottom:0}
  .main{padding:var(--s5) var(--s5) 48px}
  .ex{grid-template-columns:minmax(0,1fr)}
}
@media print{
  .fs-shell,.fs-bottom,.fs-toast,.fs-palette,.side,.def-tog{display:none!important}
  html,body{background:none}
  .wrap{display:block}
  .main{padding:0}
  .def{break-inside:avoid;background:none}
  .cat-h{break-after:avoid}
}
</style>
<script src="gate.js"></script>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="shell.css?v=pr1">
<link rel="stylesheet" href="components.css?v=pr1">
</head>
<body><script>window.FutScout&&FutScout.mount()</script>

<div class="fs-slots" hidden><span id="hs" data-fs-slot="pop">loading…</span></div><script>window.FutScout&&FutScout.adopt()</script>

<div class="wrap">
  <nav class="side" aria-label="Metric directory">
    <div class="side-top">
      <div class="fs-field"><label for="q">Filter metrics</label><input type="search" id="q" placeholder="filter metrics…" autocomplete="off" spellcheck="false"></div>
      <div class="fs-dir-count" id="qCount" role="status" aria-live="polite">loading…</div>
    </div>
    <div class="list fs-dir" id="list"><div class="state" aria-hidden="true" style="padding:var(--s4)"><div class="fs-skel row"></div><div class="fs-skel row"></div><div class="fs-skel row"></div><div class="fs-skel row"></div></div></div>
  </nav>
  <main class="main" id="main">
    <h1 class="fs-title">Metric reference</h1>
    <div id="defs"><div class="state" role="status" aria-label="Loading metric definitions"><div class="fs-skel title"></div><div class="fs-skel line"></div><div class="fs-skel line"></div><div class="fs-skel block"></div></div></div>
  </main>
</div>

<script>
const SB='https://xrsilhiffjoulyoqhdmp.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhyc2lsaGlmZmpvdWx5b3FoZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Nzc5NDAsImV4cCI6MjEwMDI1Mzk0MH0.3_ccOJi0SBKOwHGxhJL3fsWCSSLoxZumzt-KH4wO8OU';
const HD={'apikey':AK,'Authorization':'Bearer '+AK};
const TEAM_DISPLAY={'Chicago':'Chicago Fire FC','Colorado':'Colorado Rapids','Columbus':'Columbus Crew',
 'Houston':'Houston Dynamo FC','Kansas City':'Sporting Kansas City','Montreal':'CF Montréal',
 'New England':'New England Revolution','New York':'New York Red Bulls','Philadelphia':'Philadelphia Union',
 'Portland':'Portland Timbers','Salt Lake':'Real Salt Lake','San Jose':'San Jose Earthquakes',
 'Seattle':'Seattle Sounders FC','Toronto':'Toronto FC','Vancouver':'Vancouver Whitecaps',
 'L.A. Galaxy':'LA Galaxy'};
function tname(t){return TEAM_DISPLAY[t]||t||''}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
const POOL_NAME={GK:'goalkeepers',CB:'centre-backs',FB:'full-backs',CM:'central midfielders',
  AM:'attacking midfielders',W:'wide forwards',ST:'strikers'};

let DEFS=[],EX={},DIST={},SEL=null;

async function sbAll(t,p){p=p||{};const PG=1000;let all=[],off=0;
  while(true){const u=new URL(SB+'/rest/v1/'+t);
    Object.keys(p).forEach(function(k){u.searchParams.set(k,p[k])});
    const r=await fetch(u,{headers:Object.assign({},HD,{'Range':off+'-'+(off+PG-1),'Range-Unit':'items'})});
    if(!r.ok)throw new Error(t+' '+r.status);const d=await r.json();
    if(!Array.isArray(d)||!d.length)break;all=all.concat(d);if(d.length<PG)break;off+=PG;}
  return all;}

/* Stable anchors. A metric definition is #m-<slug of its key>, a category is
   #cat-<slug of its name>: lower case, every run of non-alphanumerics a single
   hyphen, no leading or trailing hyphen. Other pages link to these. */
function slug(s){return String(s==null?'':s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
let MID={},CID={},MORE=true,userMoved=false;
['wheel','touchmove','keydown','pointerdown'].forEach(function(t){
  window.addEventListener(t,function(){userMoved=true},{passive:true})});
function byKey(k){return DEFS.filter(function(x){return x.key===k})[0]}
function groupsOf(rows){const g=[];rows.forEach(function(d){if(g.indexOf(d.grp)<0)g.push(d.grp)});return g}
function matches(d,f){return !f||(d.label+' '+d.key+' '+(d.definition||'')).toLowerCase().indexOf(f)>=0}
function filterText(){return document.getElementById('q').value.toLowerCase().trim()}

async function init(){
  try{
    const r=await Promise.all([
      sbAll('metric_defs',{select:'*',order:'grp_order.asc,sort_order.asc'}),
      sbAll('mv_metric_examples',{select:'*'})
    ]);
    DEFS=r[0];EX={};
    r[1].forEach(function(e){EX[e.metric]=e});
    /* One id per definition and per category. Two keys that slug alike would
       collide, so a later one takes a numeric suffix instead of a duplicate id. */
    MID={};CID={};const used={};
    DEFS.forEach(function(d){let id='m-'+slug(d.key),n=2;while(used[id])id='m-'+slug(d.key)+'-'+(n++);used[id]=1;MID[d.key]=id});
    groupsOf(DEFS).forEach(function(g){let id='cat-'+slug(g),n=2;while(used[id])id='cat-'+slug(g)+'-'+(n++);used[id]=1;CID[g]=id});
    document.getElementById('hs').textContent=
      DEFS.length+' metrics · '+[...new Set(DEFS.map(function(d){return d.grp}))].length+
      ' groups · saved reference population; example counts shown per metric';
    if(!DEFS.length){
      renderList();
      document.getElementById('defs').innerHTML='<div class="fs-empty" role="status"><h2>No metric definitions available.</h2><p>The reference returned zero definitions, so there is nothing to list here.</p><button type="button" class="fs-btn" onclick="init()">Reload the reference</button></div>';
      return;
    }
    renderMain();
    renderList();
    /* The anchor named in the address does not exist until now, so the browser
       could not scroll to it on load. An anchor wins over ?m=; ?m= over the default. */
    if(goHash(true))return;
    const q=new URLSearchParams(location.search).get('m');
    if(q&&byKey(q))open(q,{scroll:true,history:'replace'});
    else open(DEFS[0].key,{scroll:false,history:'replace'});
  }catch(e){
    document.getElementById('hs').textContent='Reference unavailable';
    document.getElementById('qCount').textContent='Reference unavailable';
    document.getElementById('list').innerHTML='';
    document.getElementById('defs').innerHTML='<div class="fs-banner fs-banner-warn" role="alert"><span class="fs-banner-label">Error</span>'+
      '<span class="fs-banner-text">Failed: '+esc(e.message)+'. The metric reference could not be loaded; nothing else on this page changed.</span>'+
      '<button type="button" class="fs-btn" onclick="init()">Retry</button></div>';
  }
}

/* The directory. Category headings jump to the category; rows open a metric. */
function renderList(){
  const f=filterText();
  const rows=DEFS.filter(function(d){return matches(d,f)});
  let h='';
  groupsOf(rows).forEach(function(g){
    h+='<a class="gh" href="#'+CID[g]+'" aria-label="Go to the '+esc(g)+' category">'+esc(g)+'</a>';
    rows.filter(function(d){return d.grp===g}).forEach(function(d){
      h+='<button type="button" class="mi fs-dir-row'+(SEL===d.key?' on':'')+'"'+
         (SEL===d.key?' aria-current="true"':'')+
         ' aria-label="Read the '+esc(d.label)+' entry"'+
         ' data-key="'+esc(d.key)+'">'+
         '<span class="mi-n fs-dir-name">'+esc(d.label)+'</span><span class="mi-k">'+esc(d.key)+'</span></button>';
    });
  });
  document.getElementById('list').innerHTML=h||(DEFS.length?'<div class="gh">no match</div>':'');
  document.getElementById('qCount').textContent=DEFS.length
    ?(f?rows.length+' of '+DEFS.length+' metrics match':DEFS.length+' metrics · '+groupsOf(DEFS).length+' groups')
    :'No metric definitions available';
}
/* The filter narrows the directory and the document together. */
function applyFilter(){
  renderList();
  const f=filterText();let shown=0;
  document.querySelectorAll('#defs .cat').forEach(function(sec){
    let any=false;
    sec.querySelectorAll('.def').forEach(function(a){
      const ok=matches(byKey(a.dataset.key),f);a.hidden=!ok;if(ok){any=true;shown++}});
    sec.hidden=!any;
  });
  const none=document.getElementById('noMatch');
  if(none){none.hidden=shown>0||!DEFS.length;
    const w=document.getElementById('noMatchText');
    if(w)w.textContent='Nothing among the '+DEFS.length+' metric names, keys and definitions contains “'+document.getElementById('q').value.trim()+'”.';}
}
function clearFilter(){const q=document.getElementById('q');if(!q.value)return false;q.value='';applyFilter();return true}
document.getElementById('q').addEventListener('input',applyFilter);
document.getElementById('list').addEventListener('click',function(ev){
  const row=ev.target.closest('.mi');if(row)open(row.dataset.key,{scroll:true});
});
document.getElementById('main').addEventListener('click',function(ev){
  const t=ev.target.closest('.def-tog');
  if(t){const k=t.dataset.key;
    if(SEL===k){MORE=!MORE;paintOpen();}else open(k,{scroll:false});
    return;}
  if(ev.target.closest('#noMatchClear')){clearFilter();document.getElementById('q').focus();}
});

/* Every definition is in the document: name, key, definition, calculation and
   any real limitation. The saved reference population, the two example players
   and the reading note belong to the open entry and are built when it opens. */
function defHTML(d){
  const cav=caveat(d.key),id=MID[d.key];
  return '<article class="def" id="'+id+'" data-key="'+esc(d.key)+'" tabindex="-1" aria-labelledby="'+id+'-t">'+
    '<div class="def-in entry">'+
    '<div class="e-eye">'+esc(d.grp)+(d.higher_is_better===false?' · lower is better':'')+'</div>'+
    '<h3 class="e-t" id="'+id+'-t">'+esc(d.label)+'</h3>'+
    '<div class="e-k">'+esc(d.key)+' · <a href="#'+id+'" aria-label="Link to the '+esc(d.label)+' definition">#'+id+'</a></div>'+
    '<div class="e-d">'+esc(d.definition||'')+'</div>'+
    '<div class="blk"><div class="blk-h">How it is calculated</div><div class="blk-b">'+
     '<div class="calc">'+esc(d.calc||'Counted directly from the event feed, then divided by minutes played over 90.')+'</div></div></div>'+
    (cav?'<div class="blk"><div class="blk-h">Worth knowing</div><div class="blk-b">'+
      '<div class="warn">'+cav+'</div></div></div>':'')+
    '<button type="button" class="fs-btn def-tog" data-key="'+esc(d.key)+'" aria-expanded="false" aria-controls="'+id+'-more">Show reference population and examples</button>'+
    '<div class="def-more" id="'+id+'-more" hidden></div>'+
    '</div></article>';
}
function moreHTML(d){
  const e=EX[d.key];
  const unit=d.unit==='%'?'%':(d.unit==='m'?' m':(d.unit==='s'?' s':''));
  const fmt=function(v){return v==null||String(v).trim()===''||!Number.isFinite(Number(v))?'—':Number(v).toLocaleString(undefined,{maximumFractionDigits:3})+unit};
  let h='';
  if(e){
    const lo=e.min_v, md=e.med_v, hi=e.max_v;
    h+='<div class="blk"><div class="blk-h">Saved reference population</div><div class="blk-b">'+
      '<div class="stat-row">'+
        '<div class="st"><div class="st-l">Lowest</div><div class="st-v">'+fmt(lo)+'</div></div>'+
        '<div class="st"><div class="st-l">Median</div><div class="st-v">'+fmt(md)+'</div></div>'+
        '<div class="st"><div class="st-l">Highest</div><div class="st-v">'+fmt(hi)+'</div></div>'+
        '<div class="st"><div class="st-l">Players</div><div class="st-v is-muted">'+esc(e.n)+'</div></div>'+
      '</div>'+
      '<p>Observed minimum, median and maximum across '+esc(e.n)+' qualifying players. These summaries do not describe the frequency distribution. Saved population: league '+esc(e.league||'unavailable')+'; role '+esc(e.pool||'mixed roles / not supplied')+'; season '+esc(e.season||'unavailable')+'. This is not the current profile filter cohort.</p>'+
      '</div></div>';

    const best=(d.higher_is_better===false)?
      {n:e.lo_name,t:e.lo_team,p:e.lo_pool,v:e.lo_value,id:e.lo_id}:
      {n:e.hi_name,t:e.hi_team,p:e.hi_pool,v:e.hi_value,id:e.hi_id};
    const worst=(d.higher_is_better===false)?
      {n:e.hi_name,t:e.hi_team,p:e.hi_pool,v:e.hi_value,id:e.hi_id}:
      {n:e.lo_name,t:e.lo_team,p:e.lo_pool,v:e.lo_value,id:e.lo_id};

    h+='<div class="blk"><div class="blk-h">What it looks like in practice</div><div class="blk-b">'+
      '<div class="ex">'+
      exCard(d.higher_is_better===false?'Lowest saved reference value':'Highest saved reference value',best,unit)+
      exCard(d.higher_is_better===false?'Highest saved reference value':'Lowest saved reference value',worst,unit)+
      '</div>'+
      '<div class="read">'+readLine(d,best,worst,md,unit)+'</div>'+
      '</div></div>';
  }
  h+='<div class="blk"><div class="blk-h">How to read it</div><div class="blk-b"><div class="read">'+
     'Player metrics retain their stated units: per 90, percentages, seconds or counts. Eligible metrics also show a '+
     '<b>percentile</b> against the same role. A striker on 0.6 xG per 90 sits in a different distribution '+
     'from a centre-back. Read the role, league and qualifying sample on the profile. The repository contains distinct three- and six-ninety percentile views; eligibility depends on the data source, not one universal site threshold. Separate reference and sequence samples also differ.'+
     '</div></div></div>';
  return h;
}
function renderMain(){
  let h='';
  groupsOf(DEFS).forEach(function(g){
    const rows=DEFS.filter(function(d){return d.grp===g});
    h+='<section class="cat" id="'+CID[g]+'" aria-labelledby="'+CID[g]+'-h">'+
       '<h2 class="cat-h" id="'+CID[g]+'-h" tabindex="-1">'+esc(g)+' <span class="fs-label">'+rows.length+' metric'+(rows.length===1?'':'s')+'</span></h2>';
    rows.forEach(function(d){h+=defHTML(d)});
    h+='</section>';
  });
  h+='<div class="fs-empty" id="noMatch" role="status" hidden><h2>No metric matches this filter</h2>'+
     '<p id="noMatchText"></p><button type="button" class="fs-btn" id="noMatchClear">Clear the filter</button></div>';
  document.getElementById('defs').innerHTML=h;
  applyFilter();
}
/* Paint which entry is open. The open entry carries the 3px accent rule, the
   same mark a selected row carries everywhere else on the site. */
function paintOpen(){
  document.querySelectorAll('#defs .def').forEach(function(a){
    const on=a.dataset.key===SEL,more=a.querySelector('.def-more'),tog=a.querySelector('.def-tog');
    a.classList.toggle('on',on);
    const show=on&&MORE;
    if(show&&!more.innerHTML)more.innerHTML=moreHTML(byKey(SEL));
    if(!on)more.innerHTML='';
    more.hidden=!show;
    tog.setAttribute('aria-expanded',String(show));
    tog.textContent=show?'Hide reference population and examples':'Show reference population and examples';
  });
}
function settle(el){
  /* Web fonts can land after the first scroll and move the target. Scroll again
     once they have, unless the reader has already moved the page. */
  userMoved=false;
  el.scrollIntoView({block:'start'});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){
    if(!userMoved&&el.isConnected&&!el.hidden)el.scrollIntoView({block:'start'})});
}

function open_(k){open(k,{scroll:true})}
function open(k,opt){
  opt=opt||{};
  const d=byKey(k);if(!d)return;
  /* A filter that hides the entry being opened is cleared, so it can be seen. */
  if(!matches(d,filterText())&&clearFilter()&&window.FutScout&&FutScout.toast)FutScout.toast('Filter cleared to show '+d.label);
  SEL=k;MORE=true;renderList();
  document.querySelectorAll('#defs .cat-h.is-target').forEach(function(h){h.classList.remove('is-target')});
  paintOpen();
  const art=document.getElementById(MID[k]);
  const row=document.querySelector('#list .mi.on'),list=document.getElementById('list');
  if(row&&(row.offsetTop<list.scrollTop+30||row.offsetTop+row.offsetHeight>list.scrollTop+list.clientHeight))
    list.scrollTop=Math.max(0,row.offsetTop-list.clientHeight/3);
  if(opt.scroll&&art){settle(art);try{art.focus({preventScroll:true})}catch(e){}}
  const url='?m='+encodeURIComponent(k);
  if(opt.history==='replace')history.replaceState(null,'',url+(opt.hash?'#'+MID[k]:''));
  else if(opt.history!=='none'&&new URLSearchParams(location.search).get('m')!==k)history.pushState(null,'',url);
}
/* #m-<slug> opens and marks that definition; #cat-<slug> lands on that category. */
function goHash(initial){
  let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){h=location.hash.slice(1)}
  if(!h||!DEFS.length)return false;
  const d=DEFS.filter(function(x){return MID[x.key]===h})[0];
  if(d){open(d.key,{scroll:true,history:'replace',hash:true});return true}
  const g=groupsOf(DEFS).filter(function(x){return CID[x]===h})[0];
  if(g){
    /* A category every one of whose metrics is filtered out would be hidden. */
    if(!DEFS.some(function(x){return x.grp===g&&matches(x,filterText())})&&clearFilter()&&window.FutScout&&FutScout.toast)FutScout.toast('Filter cleared to show '+g);
    document.querySelectorAll('#defs .cat-h.is-target').forEach(function(x){x.classList.remove('is-target')});
    const head=document.getElementById(h+'-h');
    head.classList.add('is-target');
    settle(document.getElementById(h));
    try{head.focus({preventScroll:true})}catch(e){}
    return true;
  }
  if(/^(m|cat)-/.test(h)&&window.FutScout&&FutScout.toast)FutScout.toast('No definition at #'+h);
  return false;
}
window.addEventListener('hashchange',function(){goHash(false)});
window.addEventListener('popstate',function(){const key=new URLSearchParams(location.search).get('m');if(key!==SEL&&DEFS.some(d=>d.key===key))open(key,{scroll:true,history:'none'});});

function exCard(label,p,unit){
  if(!p||!p.n)return '<div class="ex-c"><div class="ex-l">'+label+'</div><div class="ex-m is-none">no qualifying player</div></div>';
  return '<a class="ex-c" href="players.html?player='+encodeURIComponent(p.id)+'"'+
    ' aria-label="Open the '+esc(p.n)+' profile, the '+esc(String(label).toLowerCase())+' for this metric">'+
    '<div class="ex-l">'+label+'</div>'+
    '<div class="ex-n">'+esc(p.n)+'</div>'+
    '<div class="ex-m">'+esc(tname(p.t))+' · '+esc(POOL_NAME[p.p]||p.p)+'</div>'+
    '<div class="ex-v">'+(+p.v).toLocaleString(undefined,{maximumFractionDigits:3})+unit+'</div>'+
    '<div class="ex-go">open profile →</div></a>';
}

function readLine(d,best,worst,med,unit){
  const u=function(v){return (+v).toLocaleString(undefined,{maximumFractionDigits:3})+unit};
  if(!best||!best.n)return '';
  if([best.v,worst?.v,med].some(v=>v==null||String(v).trim()===''||!Number.isFinite(Number(v))))return 'Some saved reference values are unavailable; no relative comparison is calculated.';
  const dir=(d.higher_is_better===false)?'lowest':'highest';
  return '<b>'+esc(best.n)+'</b> posts the '+dir+' figure in the saved reference at <b>'+u(best.v)+
    '</b>, against a median of <b>'+u(med)+'</b> — roughly '+
    (med&&+med!==0?(Math.abs(+best.v/+med)).toFixed(1)+'×':'well clear of')+
    ' the typical player. At the other end, <b>'+esc(worst.n)+'</b> records '+u(worst.v)+
    '. Click either card to see the full profile and the actions behind the number.';
}

/* Honest notes where a metric has a real limitation */
function caveat(k){
  const C={
    xg_90:'This empirical shot model is fitted on the current-season event data. The earlier external Opta correlation claim was withdrawn because it could not be reproduced. The model cannot see defenders, keeper position, or whether a shot was first-time; two shots from the same spot receive the same value unless the big-chance flag separates them. The current xG per 90 aggregate includes penalties.',
    xg_per_shot:'Driven heavily by where a player shoots from. A poacher will beat a midfielder here without being the better finisher.',
    finishing:'Over a partial season this is mostly noise. It takes several hundred shots before over- or under-performance means much.',
    sot_90:'The provider files a defender\u2019s block as a save. Those are excluded here, which is why this reads lower than most public sources.',
    carries_90:'Carries are not in the raw feed. They are inferred from the gap between where the ball arrived and where the player\u2019s next action began, capped at 20 seconds.',
    median_ttr:'Includes every receipt, not just passes. A player who is dispossessed often will look slower than he is.',
    aq_per_duel:'Follows only the single next event. A ball that is scrambled clear and then recovered still counts as lost.',
    padj_def_90:'The adjustment matters far more between teams than within one. Two players at the same club get almost the same correction.',
    sp_xg_90:'A set-piece phase counts the ten seconds after any dead ball, including throw-ins, so this runs slightly generous versus a corners-and-free-kicks-only definition.',
    def_height:'A high figure can mean an aggressive press or simply a team pinned in the opposition half. Read it next to PPDA.',
    goals_prevented_90:'Uses pre-shot xG, not post-shot. It does not know how well the shot was struck.',
    weak_foot_share:'Foot is recorded on about four shots in five, so this is based on a subset.',
    hs_passes_90:'Half-spaces here are the strips between the box edge and the six-yard line extended, attacking half only.'
  };
  return C[k]||'';
}
init();

/* Printing: every definition, on the light palette whatever the screen theme:
   the root theme is set to light for the print and put back afterwards. */
window.addEventListener('beforeprint',function(){var r=document.documentElement;if(!r.hasAttribute('data-print-theme')){r.setAttribute('data-print-theme',r.getAttribute('data-theme')||'');r.setAttribute('data-theme','light')}});
window.addEventListener('afterprint',function(){var r=document.documentElement;if(r.hasAttribute('data-print-theme')){var t=r.getAttribute('data-print-theme');if(t)r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');r.removeAttribute('data-print-theme')}});
</script>
