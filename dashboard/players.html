<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Fingerprints</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=pr1">
<script src="site-tools.js?v=pr1"></script>
<style>
/* Player fingerprints: page-level layout only. Every colour, face, radius and
   spacing value is a token from theme.css; the chrome is shell.css and the data
   panels are the fs-* components in components.css. Nothing here declares a
   palette. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.wrap{flex:1 1 auto;min-height:0}
.fs-rail.hide{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* ---------- Rail ---------- */
#side .directory-toggle{display:none}
.fs-table td.r,.fs-table th.r{white-space:nowrap}
#main .fs-catrow{padding:0}
#side .fs-dir{flex:1 1 auto}
.pitem{align-items:center}
.pitem>span:first-child{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.pitem:focus-visible{outline-offset:-2px}
.rail-set{border:0;display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.rail-set legend{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s1)}
.rail-set .fs-check b{margin-left:auto;font:400 11px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rail-set .fs-check input:disabled+span{color:var(--muted)}
.rail-btns{display:flex;flex-wrap:wrap;gap:var(--s2)}
.rail-sep{border-top:1px solid var(--rule);padding-top:var(--s4)}
.hi-chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.hi-chips button{appearance:none;background:none;border:0;color:var(--muted);font:500 12px/1 var(--mono);cursor:pointer;padding:0 var(--s1)}

/* ---------- Shared page pieces ---------- */
.pl-head{display:flex;align-items:flex-end;flex-wrap:wrap;gap:var(--s3) var(--s5)}
.pl-head>div:first-child{flex:1 1 320px;min-width:0}
.pl-actions{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:var(--s5);align-items:start}
.narrow .pl-grid{grid-template-columns:minmax(0,1fr)}
.fs-panel-foot .fs-push,.pl-actions .fs-push{display:flex;flex-wrap:wrap;gap:var(--s2)}
.fs-panel-h .fs-push{margin-left:auto}
.legend-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s4);font:400 11px/1.4 var(--body);color:var(--muted)}
.legend-row i{display:inline-block;width:8px;height:8px;border-radius:var(--radius);margin-right:var(--s1)}
.lgk80{background:var(--p80)}.lgk60{background:var(--p60)}.lgk40{background:var(--p40)}.lgk20{background:var(--p20)}.lgk0{background:var(--p0)}
.fs-swatch.cA{background:var(--blue)}.fs-swatch.cB{background:var(--purple)}
/* A name or a value that opens something is a real button, reset to read as text. */
.pname-link,.val-link{appearance:none;background:none;border:0;border-bottom:1px dotted var(--muted);padding:0 0 1px;color:var(--ink);
  font:inherit;line-height:1.2;text-align:left;cursor:pointer;vertical-align:baseline}
.pname-link{font-weight:600}
.val-link{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
td:first-child .val-link,.mt-name .val-link{font-family:var(--body);text-align:left}
.pname-link:hover,.val-link:hover{border-bottom-color:var(--ink)}
.dico{margin-left:var(--s1);color:var(--muted);font-size:10px}
.mt .fs-bar{min-width:64px}
.mt td.mt-name{min-width:150px}
.mt-name span[title]{cursor:help}
.c-val{display:block;font:400 12px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.c-pct{display:block;font:500 11px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.fit{font:500 13px/1 var(--mono);font-variant-numeric:tabular-nums}
.fs-table td .fs-tag{margin-left:var(--s2)}
.fs-table .is-zero{color:var(--muted)}
.rankbar{height:6px;min-width:120px;background:var(--rule2);border-radius:var(--radius);position:relative;overflow:hidden}
.rankbar-f{position:absolute;top:0;height:100%;background:var(--ink)}
.rankbar-zero{position:absolute;top:0;bottom:0;width:1px;background:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:var(--s2) var(--s3);font:400 11px/1.4 var(--body);z-index:50;display:none;max-width:320px}
.tip small{display:block;font:400 10px/1.4 var(--mono)}
.export-surface{background:var(--panel);color:var(--ink);padding:var(--s5);font:400 13px/1.45 var(--body)}

/* ---------- Player start ---------- */
#main .player-start{max-width:1000px}
#main .player-start .eyebrow{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#main .player-start h1{font:600 30px/1.05 var(--display);letter-spacing:-.01em;margin:var(--s3) 0}
#main .player-start>p{font:400 13px/1.45 var(--body);color:var(--muted);max-width:65ch}
#main .player-start-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);margin:var(--s6) 0}
#main.narrow .player-start-grid{grid-template-columns:minmax(0,1fr)}
#main .player-start-card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);padding:var(--s5);min-width:0}
#main .player-start-card h2{font:500 20px/1.2 var(--display);margin:0 0 var(--s2)}
#main .player-start-card p{font:400 13px/1.45 var(--body);color:var(--muted);margin-bottom:var(--s4)}
#main .player-start button{appearance:none;min-height:var(--tap);padding:5px 10px;background:var(--panel);color:var(--ink);border:1px solid var(--ink);border-radius:var(--radius);
  font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
#main .player-start button:hover{background:var(--panel2)}
#main .player-start-note{font:400 11px/1.4 var(--body)!important;border-top:1px solid var(--rule);padding-top:var(--s4)}

/* ---------- Player: overview, pitch box, measures ---------- */
.fs-overview-grid[hidden]{display:none}
.fs-pillar .fs-bar{width:100%}
.fs-pillar.is-static{cursor:default}
.fs-pillar.is-static:hover{background:var(--panel)}
.ov-note{grid-column:1/-1}
.fs-pitchbox-head .fs-push{margin-left:auto}
.fs-pitchbox .layer-glyph,.viz-leg .layer-glyph,.plot-check .layer-glyph{display:inline-block;width:12px;height:12px;overflow:visible;flex:0 0 auto;vertical-align:-2px}
.fs-pitchbox .pitch-box svg{width:100%;height:100%}
.pitch-box{height:clamp(210px,calc(100dvh - 560px),540px)}
.narrow .pitch-box,.pitch-box.is-natural{height:auto;aspect-ratio:111.5/78}
.fs-layer.off{color:var(--muted)}
.fs-layer.off .layer-glyph{opacity:.35}
.pitch-dir{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 var(--s4);margin-top:var(--s1)}
.pitch-dir .fs-orient{margin:0}
.attack-direction{display:flex;justify-content:center;align-items:center;gap:var(--s3);font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.attack-direction span{font-size:16px;line-height:1}
.viz-leg{display:flex;gap:var(--s1) var(--s5);flex-wrap:wrap;align-items:center;margin-top:var(--s3);font:400 11px/1.4 var(--body);color:var(--muted)}
.viz-leg b{font-weight:600;color:var(--ink)}
.viz-leg .layer-glyph{margin-right:var(--s1)}
.viz-leg .size-key,.viz-leg .shot-key{display:inline-flex;align-items:center;gap:var(--s2)}
.fs-pitchbox .size-key svg,.viz-leg .size-key svg{width:112px;height:27px;overflow:visible}
.fs-pitchbox .shot-key svg,.viz-leg .shot-key svg{width:15px;height:15px;overflow:visible}
.pitch-ground{fill:var(--pitch)}
.zone-line{stroke:var(--pitchline);stroke-width:.14;stroke-dasharray:.8 .8;opacity:.6}

/* ---------- Pitch evidence dialog ---------- */
.drill-wrap{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 42%,transparent);z-index:120;display:none;align-items:center;justify-content:center;padding:24px}
.drill-card{background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius);padding:var(--s6);width:min(1080px,96vw);max-height:94vh;overflow:auto;position:relative}
.drill-x{position:absolute;top:var(--s3);right:var(--s3);min-width:var(--tap);min-height:var(--tap);background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius);color:var(--ink);cursor:pointer;font:500 15px/1 var(--mono)}
.drill-x:hover{background:var(--panel2)}
#drillBody{display:flex;flex-direction:column;gap:var(--s3)}
#drillBody .viz-title{margin:0;padding-right:44px;font:500 20px/1.2 var(--display)}
.event-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:var(--s3) var(--s4);padding:var(--s4);background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius)}
.event-filters .wide,.event-filter-note{grid-column:1/-1}

/* ---------- Scatter ---------- */
.sc-cols{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:var(--s5);align-items:start}
.narrow .sc-cols{grid-template-columns:minmax(0,1fr)}
.sc-svg{display:block;width:100%;height:auto}
.sc-svg text{font-family:var(--mono);fill:var(--muted)}
.sc-svg .pt{cursor:pointer;outline:none}
.sc-svg .pt:focus-visible{stroke:var(--accent);stroke-width:2.5}
.sc-grid{stroke:var(--rule2)}
.sc-axis{stroke:var(--ink)}
.sc-med{stroke:var(--gold);stroke-dasharray:5 4}
.sc-card dl{margin-top:var(--s3)}
.sc-near{margin-top:var(--s4)}

/* ---------- Scout ---------- */
.sk-editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:var(--s5) var(--s6);align-items:start}
.narrow .sk-editor{grid-template-columns:minmax(0,1fr)}
.sk-left{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.sk-weights{min-width:0}
.fs-weight button{appearance:none;min-width:var(--tap);min-height:var(--tap);background:none;border:1px solid var(--rule);border-radius:var(--radius);color:var(--ink);font:500 13px/1 var(--mono);cursor:pointer}
.fs-weight button:hover{background:var(--panel2)}

/* ---------- Compare ---------- */
.cmp-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);align-items:start}
.narrow .cmp-cols{grid-template-columns:minmax(0,1fr)}
.cmp-card{border-top-width:3px}
.cmp-card.cA{border-top-color:var(--blue)}
.cmp-card.cB{border-top-color:var(--purple)}
.cmp-id{margin:var(--s3) 0}
.cmp-id .fs-chips{flex-direction:column;align-items:flex-start}
.cmp-id h3{font:600 24px/1.1 var(--display);overflow-wrap:anywhere}
.cmp-grp th{background:var(--panel2);border-bottom:1px solid var(--rule);color:var(--ink)}

/* ---------- Plot studio: the preview is the export card ---------- */
.studio-stage{position:relative;width:100%;aspect-ratio:1200/800;overflow:hidden}
.studio-stage>.studio-card{position:absolute;left:0;top:0;transform-origin:0 0;transform:scale(var(--k,.5))}
.studio-card{width:1200px;height:800px;background:var(--panel);color:var(--ink);border:1px solid var(--ink);border-radius:var(--radius);padding:26px 30px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:16px;font:400 13px/1.45 var(--body);overflow:hidden}
.sc-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px 24px;border-bottom:1px solid var(--ink);padding-bottom:12px}
.sc-mark{font:600 18px/1 var(--display);letter-spacing:.02em}
.sc-mark span{color:var(--accent)}
.sc-type{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.sc-title{font:600 30px/1.05 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.sc-meta{font:400 12px/1.4 var(--body);color:var(--muted);text-align:right}
.sc-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;min-height:0}
.sc-plot{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center}
.sc-plot .pizza-svg{display:block;width:100%;height:100%;max-height:610px}
.sc-plot .pitch-box{height:430px;aspect-ratio:auto}
.sc-plot .fs-pitchbox{border:0;padding:0}
.sc-side{display:flex;flex-direction:column;gap:14px;min-height:0;border-left:1px solid var(--rule);padding-left:18px;font:400 12px/1.4 var(--body)}
.sc-side h4{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.studio-card table.fs-table td{font-size:12px!important;line-height:1.4!important;padding:3px 6px}
.sc-key{display:flex;flex-direction:column;gap:4px}
.sc-key span{display:flex;align-items:center;gap:6px}
.sc-key i{width:10px;height:10px;border-radius:var(--radius);flex:0 0 auto}
.sc-key i.is-missing{background:none;border:1px dashed var(--muted)}
.sc-stamp{margin-top:auto;border-top:1px solid var(--ink);padding-top:10px;font:400 10px/1.55 var(--mono);color:var(--muted);overflow-wrap:anywhere}
.sc-stamp b{font-weight:500;color:var(--ink)}
.pizza-svg text{font-family:var(--body);fill:var(--ink)}
.pizza-svg .pz-num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pizza-svg .pz-mut{fill:var(--muted)}
.pizza-ring{fill:none;stroke:var(--rule);stroke-dasharray:3 3}
.pizza-ring.outer{stroke:var(--pitchline);stroke-dasharray:none}
.pizza-track{fill:var(--panel2);stroke:var(--panel);stroke-width:2}
.pizza-missing{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.dialog-pizza{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(200px,1fr);gap:var(--s5);align-items:center}
.dialog-pizza .pizza-svg{width:100%;height:auto;max-height:560px}
.slices{list-style:none;display:flex;flex-direction:column}
.slice{display:grid;grid-template-columns:16px minmax(0,1fr) 34px auto;align-items:center;gap:var(--s2);padding:var(--s1) 0;border-bottom:1px solid var(--rule2);border-left:3px solid transparent;font:400 12px/1.3 var(--body)}
.slice.drag-over{border-left-color:var(--accent);background:var(--bg)}
.slice .grip{cursor:grab;color:var(--muted);font:400 12px/1 var(--mono);text-align:center}
.slice small{display:block;font:400 11px/1.3 var(--body);color:var(--muted)}
.slice b{font:400 12px/1 var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.slice .acts{display:flex;gap:2px}
.slice .acts button{appearance:none;width:24px;min-height:24px;background:none;border:1px solid var(--rule);border-radius:var(--radius);color:var(--ink);font:400 11px/1 var(--mono);cursor:pointer}
.slice .acts button:hover{background:var(--panel2)}
.slice .acts button:disabled{color:var(--muted);cursor:not-allowed}
.check-group{display:flex;flex-direction:column}
.plot-check{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:var(--s2);align-items:center;min-height:var(--tap);padding:0 var(--s1);border-bottom:1px solid var(--rule2);font:400 12px/1.3 var(--body);cursor:pointer}
.plot-check:hover{background:var(--panel2)}
.plot-check input{accent-color:var(--ink)}
.plot-check b{font:400 11px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.role-glyph{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:var(--s2);padding:var(--s3) 0}
.role-glyph span{font:400 11px/1.3 var(--body);color:var(--muted)}
.role-glyph b{display:block;color:var(--ink);font:400 12px/1.3 var(--mono);font-variant-numeric:tabular-nums}
.chain-details td{padding-top:0}
.chain-details summary{cursor:pointer;font:400 11px/1.4 var(--body);color:var(--muted)}

/* ---------- 760px and under ---------- */
@media(max-width:760px){
  html,body{height:auto;min-height:100%}
  body{overflow:visible}
  .wrap{min-height:0}
  #side .directory-toggle{display:flex;justify-content:flex-start}
  #side.compact-directory>:not(.directory-toggle){display:none}
  #side .fs-dir{flex:0 0 auto}
  .pitch-box{height:auto;aspect-ratio:111.5/78}
  .drill-wrap{padding:8px}.drill-card{padding:var(--s5) var(--s4)}
  .dialog-pizza{grid-template-columns:minmax(0,1fr)}
  .sc-cols,.sk-editor,.cmp-cols,.pl-grid,#main .player-start-grid{grid-template-columns:minmax(0,1fr)}
  .slice .acts button{width:36px;min-height:36px}
}
</style>

  <div id="lgPick" class="lgpick" data-fs-slot="scope"></div>
  <span id="hdrSub" data-fs-slot="pop">loading&hellip;</span>
  <span class="as-of" id="asOf"></span>
  <div class="tabs" id="tabs" data-fs-slot="tabs" aria-label="Player analysis sections"></div>
  <span data-fs-slot="actions"><button type="button" onclick="exportPNG()">PNG</button><button type="button" onclick="exportPDF()">PDF</button></span>
</div><script>window.FutScout&&FutScout.adopt()</script>

<div class="fs-body wrap" id="app">
  <aside class="fs-rail side" id="side" aria-label="Player directory">
    <button type="button" class="directory-toggle fs-btn fs-rail-full" aria-expanded="true" onclick="const closed=document.getElementById('side').classList.toggle('compact-directory');this.setAttribute('aria-expanded',!closed)">Choose player / directory filters</button>
    <div class="fs-field"><label for="teamSel">Team</label>
      <select aria-label="Directory team" id="teamSel" onchange="renderList()"><option value="">All teams</option></select></div>

</div>
<div class="tip" id="tip"></div>
<div class="drill-wrap" id="drillWrap" role="dialog" aria-modal="true" aria-label="Metric pitch evidence">

    <div id="drillBody"></div></div>
</div>

      sbAll('role_pillar_weights',{select:'pool,pillar,weight'}),

      sbAll('v_team_directory',{select:'team,league,league_name'}),

function metricCard(g,pm,full){
  const ms=DEFS.filter(function(d){return d.grp===g});if(!ms.length)return'';
  const vals=[];ms.forEach(function(d){const r=pm[d.key];if(r&&r.pct!=null)vals.push(+r.pct)});
  const avg=vals.length?Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length):null;
  let h='<section class="fs-panel mt-panel"><div class="fs-panel-h"><h3>'+esc(g)+' · '+ms.length+' measures</h3>'+
     '<span class="fs-note fs-push">'+(avg!=null?'mean pct '+pctText(avg)+' of '+vals.length+' ranked':'no ranked measures')+'</span></div>'+
     '<div class="fs-table-wrap"><table class="fs-table mt"><thead><tr><th>Measure</th><th class="r">Value</th><th class="r">Pct</th><th>Cohort</th></tr></thead><tbody>';

let STUDIO_LAYERS=[];
function studioEventPlot(){
  const layers=plotLayers(),active=layers.filter(function(l){return PB.layers.indexOf(l.k)>=0});
  STUDIO_LAYERS=[];
  if(!active.length)return '<div class="fs-pitch-empty">Select one or more event layers in the rail. Dense combinations are easier to read in Pattern mode.</div>';
  const owner=new Map();active.forEach(function(l){l.items.forEach(function(a){owner.set(a,l.k)})});
  const shown=active.map(function(l){return Object.assign({},l,{items:l.items.filter(function(a){return owner.get(a)===l.k})})});
  STUDIO_LAYERS=shown.map(function(l){return{label:l.label,n:l.items.length}});
  let inner='';shown.forEach(function(l){if(PB.pattern&&l.movement)inner+=flowPattern(l.items,l.color,7);else l.items.forEach(function(a){inner+=l.draw(a)})});
  const legend=shown.map(function(l){return lg(l.color,l.label,l.items.length,l.shape)+' <b>'+l.items.length+'</b>'}).join('')+
    (shown.some(function(l){return l.movement})?movementKey(PB.pattern):'')+
    (PB.pattern?'<span>Movement layers are aggregated into repeated zone flows; point events remain exact.</span>':'');
  return pitchWrap('Custom event map',owner.size+' distinct actions plotted. Overlapping categories use the most specific selected layer. Pattern groups movements; Events shows individual actions.',inner,legend,'',null,
    {card:true,zones:PB.pattern});
}
function studioTitle(p){return PB.title||((p.player_name||'Player')+(PB.mode==='pizza'?' · percentile profile':' · event map'))}
function studioSource(){return location.origin+location.pathname+(SEL?'?player='+encodeURIComponent(SEL):'')}
function fitStudio(){
  const stage=document.querySelector('.studio-stage');
  if(stage&&stage.clientWidth)stage.style.setProperty('--k',(stage.clientWidth/1200).toFixed(4));
}
window.addEventListener('resize',function(){requestAnimationFrame(fitStudio)});
window.addEventListener('fs:narrow',function(){requestAnimationFrame(fitStudio)});
if(window.ResizeObserver)new ResizeObserver(function(){fitStudio()}).observe(document.getElementById('main'));
function studioExport(fmt,button){
  const card=document.getElementById('studioCard');if(!card)return;
  const stamp=document.getElementById('scExported');
  if(stamp)stamp.textContent=new Date().toISOString().replace('T',' ').slice(0,16)+' UTC';
  return exportCard(card,fmt,button);
}

function studioCard(p){
  const pizza=PB.mode==='pizza',keys=pbKeys(),defs=keys.map(defOf);
  const plot=pizza?(keys.length>=3?pizzaSvg(keys,studioTitle(p),PB.color):'<div class="fs-pitch-empty">Choose at least three measures. Start with a template, or add a measure from any category: the slice list keeps them as you move between categories.</div>'):studioEventPlot();
  const missing=pizza?keys.filter(function(k){const r=PMCACHE[k];return !r||nullableMetric(r.pct)===null}).length:0;
  const side=pizza
    ? '<div><h4>How to read</h4><p>Each wedge is a percentile against the cohort above, from 0 at the hub to 100 at the rim; rings mark 25, 50 and 75. Longer means a higher relative rank, not more volume. A hollow dashed wedge is missing data, never zero.</p></div>'+
      '<div><h4>Colour · '+({cat:'by category',band:'by percentile band',single:'single'}[PB.color]||'by category')+'</h4>'+colourKey(defs,PB.color)+
        (missing?'<div class="sc-key" style="margin-top:4px"><span><i class="is-missing"></i>Missing · '+missing+' slice'+(missing===1?'':'s')+'</span></div>':'')+'</div>'+
      (keys.length?'<div><h4>Values</h4><table class="fs-table"><tbody>'+defs.map(function(d){const r=PMCACHE[d.key];
        return '<tr><td>'+esc(d.label)+'</td><td class="r">'+(r&&nullableMetric(r.value)!==null?esc(fmt(r.value,d.unit)):'—')+'</td><td class="r">'+(r&&nullableMetric(r.pct)!==null?esc(r.pct):'miss')+'</td></tr>'}).join('')+'</tbody></table></div>':'')
    : '<div><h4>How to read</h4><p>'+(PB.pattern?'Pattern mode: nodes are origin volume and arrows are the strongest repeated flows on a 6 by 4 zone grid, so an arrow is not one action. Point events stay exact.':'Events mode: every mark is one action; a hollow ring is where it started and a solid dot where it ended.')+' Attack is left to right.</p></div>'+
      '<div><h4>Evidence window</h4><p>'+esc(eventFilterWords())+'.</p></div>'+
      '<div><h4>Layers · actions plotted</h4><table class="fs-table"><tbody>'+(STUDIO_LAYERS.length?STUDIO_LAYERS.map(function(l){return '<tr><td>'+esc(l.label)+'</td><td class="r">'+l.n+'</td></tr>'}).join(''):'<tr><td>No layer selected</td><td class="r">0</td></tr>')+'</tbody></table></div>';
  return '<article class="studio-card fs-light" id="studioCard" aria-label="Export card preview, 1200 by 800, always light">'+
    '<header class="sc-head"><div><div class="sc-mark">FUTSCOUT<span>_</span></div><h2 class="sc-title" data-chart-title="studio">'+esc(studioTitle(p))+'</h2></div>'+
    '<div><div class="sc-type">'+(pizza?'Percentile pizza · '+keys.length+' slice'+(keys.length===1?'':'s'):'Event map · '+(PB.pattern?'pattern':'events'))+'</div>'+
    '<div class="sc-meta">'+esc(p.player_name)+' · '+esc(tname(p.team))+' · '+esc(leagueLabel(p.team))+' · '+(+p.nineties||0).toFixed(1)+' × 90</div></div></header>'+
    '<div class="sc-body"><div class="sc-plot">'+plot+'</div><aside class="sc-side">'+
    '<div><h4>Cohort</h4><p>'+esc(cohortLine(p))+'</p></div>'+side+
    '<div class="sc-stamp"><b>Data snapshot</b> '+esc(snapshotLine())+'<br><b>Exported</b> <span id="scExported">stamped at export</span><br>'+
    '<b>Percentile basis</b> own league and role · '+esc(sourceRule())+' (source rule)<br><b>Source</b> '+esc(studioSource())+'</div>'+
    '</aside></div></article>';
}
function renderPlotStudio(){
  const main=document.getElementById('main');
  if(!SEL){const first=PLAYERS.filter(function(p){return teamInLeague(p.team)&&p.pool})[0];if(first){return loadStudioPlayer(first.player_id)}setRail('',true);main.innerHTML=emptyState('No player to plot','No classified player is available in '+scopeLabel()+'. The studio needs a player before it can draw anything.','<button type="button" class="fs-btn k" onclick="setTab(\'Player\')">Open the directory</button>');return}
  if(EVIDENCE_PID!==SEL){return loadStudioPlayer(SEL)}
  const p=playerOf(SEL),groups=groupsFor(p.pool).filter(function(g){return g!=='Combined'&&groupMetrics(g).length});
  if(groups.indexOf(PB.group)<0)PB.group=groups[0]||'Passing';if(!PB.ready){PB.metrics=suggestedMixedMetrics();PB.ready=true}
  setRail(studioRail(p,groups),true);
  const over=PB.mode==='pizza'&&PB.metrics.length>PB_MAX;
  main.innerHTML='<div class="fs-stack"><div class="pl-head"><div><h2 class="fs-title">Plot studio</h2>'+
    '<p class="fs-sub">'+esc(p.player_name)+'. The preview below is the export itself: a 1200 by 800 card that always renders light, whatever the page theme. Percentile pizzas compare the player with his role peers; event maps show the actions underneath.</p></div></div>'+
    (over?'<div class="fs-banner"><span class="fs-banner-label">'+PB_MAX+' slices</span><span class="fs-banner-text">This selection carries '+PB.metrics.length+' measures. One card draws the first '+PB_MAX+' in the listed order; reorder or remove slices in the rail to choose which.</span></div>':'')+
    (!p.pool||p.nineties<MIN90?'<div class="fs-banner fs-banner-warn"><span class="fs-banner-label">Ineligible</span><span class="fs-banner-text">Below the source rule ('+esc(sourceRule())+') or not yet classified: no percentiles exist for this player, so pizza slices are missing. Event maps remain available.</span></div>':'')+
    '<div><div class="studio-stage">'+studioCard(p)+'</div>'+
    '<div class="fs-panel-foot"><span class="fs-note">Preview scaled to fit; the file is 1200 by 800 plus the provenance footer.</span>'+
    '<span class="fs-push viz-exp"><button type="button" class="fs-btn k primary" onclick="studioExport(\'png\',this)">Export PNG</button>'+
    '<button type="button" class="fs-btn k" onclick="studioExport(\'pdf\',this)">PDF</button>'+
    '<button type="button" class="fs-btn k" onclick="studioCopy()">Copy data</button></span></div></div></div>';
  fitStudio();
}

/* ---------- SCATTER ---------- */
function metricOptions(sel){
  let out='',g='';
  DEFS.forEach(function(d){
    if(d.grp==='Chain roles')return; // these live in the separate chain-role data view
    if(d.grp!==g){if(g)out+='</optgroup>';out+='<optgroup label="'+esc(d.grp)+'">';g=d.grp}
    out+='<option value="'+d.key+'"'+(sel===d.key?' selected':'')+'>'+esc(d.label)+'</option>';
  });
  return out+'</optgroup>';
}
let SC_PTS=[],SC_PIN=null,SC_STATS=null;
function scatterMin(){const v=Math.floor(+SC.min90);return Number.isFinite(v)&&v>MIN90?v:MIN90}
function scatterRail(){
  const seg=function(label,items){return '<div class="fs-field fs-rail-full"><span class="fs-label">'+label+'</span><div class="fs-seg" role="group" aria-label="'+label+'">'+items+'</div></div>'};
  const check=function(id,key,label){return '<label class="fs-check fs-rail-full"><input type="checkbox" id="'+id+'"'+(SC[key]?' checked':'')+' onchange="SC.'+key+'=this.checked;renderScatter()"><span>'+label+'</span></label>'};
  let h='<div class="fs-field fs-rail-full"><label for="scX">X measure</label><select id="scX" onchange="SC.x=this.value;renderScatter()">'+metricOptions(SC.x)+'</select></div>'+
    '<div class="fs-field fs-rail-full"><label for="scY">Y measure</label><select id="scY" onchange="SC.y=this.value;renderScatter()">'+metricOptions(SC.y)+'</select></div>'+
    seg('Axis unit','<button type="button" id="scUnitVal" aria-pressed="'+(SC.unit!=='pct')+'" onclick="SC.unit=\'val\';renderScatter()">Value</button>'+
      '<button type="button" id="scUnitPct" aria-pressed="'+(SC.unit==='pct')+'" onclick="SC.unit=\'pct\';renderScatter()">Percentile</button>')+
    '<div class="fs-field"><label for="scPool">Role pool</label><select id="scPool" onchange="SC.pool=this.value;SC.hi=[];renderScatter()">'+
      POOLS.map(function(p){return '<option value="'+p+'"'+(SC.pool===p?' selected':'')+'>'+POOL_NAME[p]+'</option>'}).join('')+'</select></div>'+
    '<div class="fs-field"><label for="scMin">Min nineties</label><input id="scMin" type="number" min="'+MIN90+'" step="1" value="'+scatterMin()+'" title="The source rule is '+sourceRule()+'. A higher number filters the points shown; it does not recompute percentiles." onchange="SC.min90=Math.max('+MIN90+',Math.floor(+this.value)||'+MIN90+');renderScatter()"></div>'+
    seg('Labels',[['none','None'],['out','Outliers'],['all','All']].map(function(o){
      return '<button type="button" id="scLab_'+o[0]+'" aria-pressed="'+(SC.labels===o[0])+'" onclick="SC.labels=\''+o[0]+'\';renderScatter()">'+o[1]+'</button>'}).join(''))+
    check('scMed','med','Median lines')+check('scSel','sel','Highlight selected player')+check('scSize','size','Size by nineties')+
    '<div class="fs-field fs-rail-full rail-sep"><label for="scHi">Highlight player</label>'+
      '<input id="scHi" list="scatterPlayers" onchange="scatterPlayerSearch(this.value);this.value=\'\'" placeholder="Search player or team">'+playerChoiceList('scatterPlayers',SC.pool,SC.hi)+'</div>';
  if(SC.hi.length){
    h+='<div class="hi-chips fs-rail-full">'+SC.hi.map(function(id,i){const p=playerOf(id)||{};
      return '<span class="fs-chip"><i class="fs-swatch s1"></i>'+esc(p.player_name)+
             '<button type="button" aria-label="Remove highlight on '+esc(p.player_name)+'" onclick="delHi('+i+')">&times;</button></span>'}).join('')+'</div>';
  }
  return h;
}
function addHi(id){if(id&&SC.hi.indexOf(id)<0){SC.hi.push(id);renderScatter()}}
function delHi(i){SC.hi.splice(i,1);renderScatter()}
function scatterHead(count){
  const dx=defOf(SC.x)||{},dy=defOf(SC.y)||{},min=scatterMin();
  return '<div class="pl-head"><div><h2 class="fs-title" data-chart-title="scatter">'+esc((dy.label||SC.y)+' vs '+(dx.label||SC.x))+'</h2>'+
    '<p class="fs-sub">'+esc(POOL_NAME[SC.pool])+' · '+esc(scopeLabel())+' · source rule '+esc(sourceRule())+(min>MIN90?' · filtered to '+min+'+ nineties':'')+
    (count==null?'':' · '+count+' players')+' · '+(SC.unit==='pct'?'axes are own league-and-role percentiles, 0 to 100':'axes are raw values in their labelled units ('+esc(metricUnit(SC.x))+' / '+esc(metricUnit(SC.y))+'), not percentiles')+'</p></div></div>';
}
async function renderScatter(){
  const request=++viewGeneration;
  const main=document.getElementById('main');
  setRail(scatterRail());
  main.innerHTML='<div class="fs-stack">'+scatterHead(null)+loadingPanel('Building scatter plot','Loading both selected measures for the role pool.')+'</div>';
  try{
    const rows=await sbAll('mv_player_percentiles',scopeQuery(
      {pool:'eq.'+SC.pool,metric:'in.('+SC.x+','+SC.y+')',select:'player_id,metric,value,pct,league'}));
    if(request!==viewGeneration||TAB!=='Scatter')return;
    const by={};rows.forEach(function(r){if(r.value==null||!Number.isFinite(+r.value))return;if(!by[r.player_id])by[r.player_id]={};by[r.player_id][r.metric]=r});
    const pts=[],min=scatterMin();let noPct=0;
    Object.keys(by).forEach(function(pid){
      const v=by[pid];if(!v[SC.x]||!v[SC.y])return;
      const p=playerOf(pid)||{};if(!p.player_name||!teamInLeague(p.team))return;
      if(+p.nineties<min)return;
      const pt={id:pid,name:p.player_name||'?',team:p.team||'',n90:+p.nineties||0,vx:+v[SC.x].value,vy:+v[SC.y].value,
                px:nullableMetric(v[SC.x].pct),py:nullableMetric(v[SC.y].pct),hi:SC.hi.indexOf(pid)>=0};
      if(SC.unit==='pct'){if(pt.px===null||pt.py===null){noPct++;return}pt.x=pt.px;pt.y=pt.py}else{pt.x=pt.vx;pt.y=pt.vy}
      pts.push(pt);
    });
    pts.sort(function(a,b){return a.x-b.x||a.y-b.y});
    SC_PTS=pts;if(SC_PIN&&!pts.some(function(p){return p.id===SC_PIN}))SC_PIN=null;
    if(!pts.length){SC_STATS=null;main.innerHTML='<div class="fs-stack">'+scatterHead(0)+emptyState('Nothing qualifies for this plot',
      'No '+POOL_NAME[SC.pool]+' in '+scopeLabel()+' has both measures at '+min+'+ nineties'+(noPct?' ('+noPct+' have values but no percentile)':'')+'. That is an empty population at these settings, not a zero.',
      '<button type="button" class="fs-btn k" onclick="SC.min90=MIN90;SC.unit=\'val\';renderScatter()">Reset to the source rule and values</button>')+'</div>';return}
    const first=SC_PIN||(SC.sel&&SEL&&pts.some(function(p){return p.id===String(SEL)})?String(SEL):(SC.hi.filter(function(id){return pts.some(function(p){return p.id===id})})[0]||null));
    main.innerHTML='<div class="fs-stack">'+scatterHead(pts.length)+
      (noPct?'<div class="fs-banner"><span class="fs-banner-label">No cohort</span><span class="fs-banner-text">'+noPct+' player'+(noPct===1?' has':'s have')+' a value but no percentile on one of these measures and cannot be placed on percentile axes.</span></div>':'')+
      '<div class="sc-cols">'+scatterSvg(pts)+'<aside id="scSide" aria-live="polite">'+scatterSide(first)+'</aside></div>'+scatterData(pts)+'</div>';
    scatterRing(first);
    wireTips();
  }catch(e){if(request===viewGeneration&&TAB==='Scatter')main.innerHTML='<div class="fs-stack">'+scatterHead(null)+errorBanner('The scatter measures could not be loaded',e.message,'renderScatter()')+'</div>'}
}
let viewGeneration=0;
function metricUnit(key){const d=defOf(key)||{};return d.unit||(/_90$/.test(key)?'per 90':'raw value')}
function scatterCsv(){
  const dx=defOf(SC.x)||{},dy=defOf(SC.y)||{};
  downloadCsv('scatter_'+SC.x+'_'+SC.y,'Scatter · '+POOL_NAME[SC.pool]+' · '+(dy.label||SC.y)+' vs '+(dx.label||SC.x)+' · source rule '+sourceRule()+' · min nineties '+scatterMin()+' · axes '+(SC.unit==='pct'?'percentiles':'values'),
    ['Player','Team','League','90s',(dx.label||SC.x)+' ('+metricUnit(SC.x)+')',(dx.label||SC.x)+' pct',(dy.label||SC.y)+' ('+metricUnit(SC.y)+')',(dy.label||SC.y)+' pct'],

function scoutFit(v){

async function renderScout(){
  const request=++viewGeneration;
  scoutMain(loadingPanel('Ranking the role pool','Loading the selected measures for every qualifying player.'));
  if(!SK.metrics.length){scoutMain(emptyState('Add at least one metric','Fit is a weighted average of the measures you choose, so with none chosen there is nothing to rank.',''));return}
  try{
    const keys=SK.metrics.map(function(m){return m.k}).join(',');
    const rows=await sbAll('mv_player_percentiles',scopeQuery(
      {pool:'eq.'+SK.pool,metric:'in.('+keys+')',select:'player_id,metric,value,pct,league'}));
    const by={};rows.forEach(function(r){if(!by[r.player_id])by[r.player_id]={};by[r.player_id][r.metric]=r});
    if(request!==viewGeneration||TAB!=='Scout')return;
    SK.rows=[];SK.incomplete=0;
    Object.keys(by).forEach(function(pid){
      const v=by[pid],fit=scoutFit(v);
      const p=playerOf(pid)||{};if(!p.player_name||!teamInLeague(p.team))return;
      if(fit==null){SK.incomplete++;return}

    });

function scoutPartial(r){return SK.metrics.some(function(m){return !r.v[m.k]||r.v[m.k].pct==null})}
function scoutMode(){
  return 'Scout \u00B7 '+POOL_NAME[SK.pool]+' \u00B7 source rule '+sourceRule()+' \u00B7 weights '+SK.metrics.map(function(m){return ((defOf(m.k)||{}).label||m.k)+' \u00D7'+m.w}).join(', ')+
    ' \u00B7 sorted by '+(SK.sort.col==='fit'?'Fit':(SK.sort.col==='n90'?'90s':((defOf(SK.sort.col)||{}).label||SK.sort.col)))+(SK.sort.dir===1?' ascending':' descending');
}
function scoutData(){
  const header=['Rank','Player','Team','League','90s','Fit','Partial'];
  SK.metrics.forEach(function(m){const d=defOf(m.k)||{},l=d.label||m.k;header.push(l+' ('+metricUnit(m.k)+')',l+' pct')});
  const rows=scoutSorted().map(function(r,i){
    const out=[i+1,r.name,tname(r.team),leagueLabel(r.team),r.n90.toFixed(1),Math.round(r.fit),scoutPartial(r)?'partial':''];
    SK.metrics.forEach(function(m){const c=r.v[m.k];out.push(c&&nullableMetric(c.value)!==null?c.value:'',c&&nullableMetric(c.pct)!==null?c.pct:'')});
    return out;
  });
  return{header:header,rows:rows};
}
function scoutCopyCsv(){
  const d=scoutData();
  copyText(exportStamp(scoutMode()).map(csvCell).concat([d.header.map(csvCell).join(',')],d.rows.map(function(r){return r.map(csvCell).join(',')})).join('\n'),'Shortlist copied as CSV \u00B7 '+d.rows.length+' rows');
}
function scoutCsv(){const d=scoutData();downloadCsv('scout_'+SK.pool+'_shortlist',scoutMode(),d.header,d.rows)}
function drawScout(){
  const sorted=scoutSorted(),rows=sorted.slice(0,50);
  if(!rows.length){
    scoutMain(emptyState('Nothing qualifies at these thresholds','No '+POOL_NAME[SK.pool]+' in '+scopeLabel()+' has a percentile for every measure weighted above zero'+
      (SK.incomplete?' ('+SK.incomplete+' player'+(SK.incomplete===1?' is':'s are')+' missing at least one)':'')+'. That is an empty shortlist for this metric set, not a zero score.',
      '<button type="button" class="fs-btn k" onclick="SK.metrics=[{k:\'prog_carries_90\',w:3},{k:\'key_pass_90\',w:3}];renderScout()">Reset to the default metrics</button>'));
    return;
  }
  const current=SEL?playerOf(SEL):null,place=current?sorted.findIndex(function(r){return String(r.id)===String(SEL)}):-1;
  const selectedNote=!current?'':(place>=0?(place>=rows.length?' \u00B7 selected player '+current.player_name+' is #'+(place+1)+' in this order, outside the rows shown':'')
    :' \u00B7 selected player '+current.player_name+' is not in this list ('+(current.pool!==SK.pool?'different role pool':'outside SCOPE, below the source rule or missing a weighted measure')+')');
  const sortAttr=function(c){return ' aria-sort="'+(SK.sort.col===c?(SK.sort.dir===1?'ascending':'descending'):'none')+'"'};
  const head=function(c,label,cls,title){return '<th'+(cls?' class="'+cls+'"':'')+sortAttr(c)+(title?' title="'+esc(title)+'"':'')+'><button type="button" onclick="sortScout(\''+c+'\')">'+label+'</button></th>'};
  let h='<section class="fs-panel scout-results"><div class="fs-panel-h"><h3 data-chart-title="scout">Who fits this profile?</h3>'+
    '<span class="fs-note fs-push scout-result-count">Top '+rows.length+' of '+SK.rows.length+' qualifying players</span></div>'+
    '<p class="fs-note">Ranked by your weighted, role-relative metric selections\u2014not overall player quality. Check playing time before trusting a high fit.</p>'+
    '<div class="fs-table-wrap" style="margin-top:var(--s3)"><table class="fs-table"><thead><tr>'+
    '<th class="r">#</th>'+head('name','Player')+head('team','Team')+head('n90','90s','r','Nineties played')+head('fit','Fit','r','Weighted average of the selected percentiles')+
    SK.metrics.map(function(m){const d=defOf(m.k)||{};
      const u=d.unit==='%'?' (%)':(d.unit==='m'?' (m)':(d.unit==='s'?' (s)':''));
      return head(m.k,esc(d.label||m.k)+u+(m.w<=0?' \u00B7 \u00D70':''),'r'+(m.w<=0?' is-zero':''),d.definition||'')}).join('')+
    '<th>Action</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    const selected=SEL&&String(SEL)===String(r.id);
    h+='<tr'+(selected?' class="sel"':'')+'><td class="r scout-rank">'+(i+1)+'</td>'+
       '<td><button type="button" class="pname-link" aria-label="Show '+esc(r.name)+' profile" onclick="pick(\''+r.id+'\')">'+esc(r.name)+'</button>'+(selected?'<span class="fs-tag selected">Selected</span>':'')+'</td>'+
       '<td class="scout-team">'+esc(tname(r.team))+'</td>'+
       '<td class="r">'+r.n90.toFixed(1)+'</td>'+
       '<td class="r"><span class="fit fs-band'+bandOf(r.fit)+'">'+Math.round(r.fit)+'</span>'+(scoutPartial(r)?'<span class="fs-tag partial" title="At least one listed measure has no percentile for this player. Fit uses only the measures weighted above zero, all of which are present.">Partial</span>':'')+'</td>'+
       SK.metrics.map(function(m){return cell(r.v[m.k],m.k,m.w<=0)}).join('')+
       '<td><button type="button" class="fs-btn sm" aria-label="Compare '+esc(r.name)+'" onclick="compareWith(\''+r.id+'\')">Compare</button></td></tr>';
  });
  h+='</tbody></table></div><div class="fs-panel-foot"><span class="fs-note">Top '+rows.length+' of '+SK.rows.length+' qualifying'+
     (SK.incomplete?' \u00B7 '+SK.incomplete+' not ranked: missing a percentile on a weighted measure':'')+
     ' \u00B7 playing time: check 90s before trusting a high Fit'+esc(selectedNote)+
     ' \u00B7 a dash is missing, not zero</span>'+
     exportButtons('.fs-panel','<button type="button" class="fs-btn k" onclick="scoutCopyCsv()">Copy CSV</button><button type="button" class="fs-btn k" onclick="scoutCsv()">CSV</button>')+'</div>'+
     '<div style="margin-top:var(--s3)">'+legendHtml()+'</div></section>';
  h+=scoutChart(rows.slice(0,15));
  scoutMain(h);
}
function scoutChart(rows){
  if(!rows.length)return'';
  const W=1100,BH=22,MT=30,ML=190,H=MT+rows.length*BH+10;
  let s='<section class="fs-panel scout-chart"><div class="fs-panel-h"><h3 data-chart-title="scout-chart">Fit \u2014 top '+rows.length+'</h3></div>'+
        '<svg class="sc-svg" role="img" aria-label="Top '+rows.length+' '+esc(POOL_NAME[SK.pool])+' scout fits for '+esc(scopeLabel())+'." viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  [0,25,50,75,100].forEach(function(v){
    const x=ML+(v/100)*(W-ML-40);
    s+='<line class="sc-grid" x1="'+x+'" y1="'+(MT-8)+'" x2="'+x+'" y2="'+(MT+rows.length*BH)+'"/>';
    s+='<text x="'+x+'" y="'+(MT-14)+'" font-size="10" text-anchor="middle">'+v+'</text>';
  });
  rows.forEach(function(r,i){
    const y=MT+i*BH,w=(r.fit/100)*(W-ML-40),t=tier(r.fit);
    s+='<text x="'+(ML-8)+'" y="'+(y+14)+'" font-size="12" text-anchor="end" style="fill:var(--ink);font-family:var(--body)">'+esc(r.name)+'</text>';
    s+='<rect x="'+ML+'" y="'+(y+5)+'" width="'+w+'" height="10" style="fill:'+t.c+'"></rect>';
    s+='<text x="'+(ML+w+7)+'" y="'+(y+14)+'" font-size="11" style="fill:var(--ink)">'+Math.round(r.fit)+'</text>';
  });
  s+='</svg><p class="fs-note">'+esc(scopeLabel())+' \u00B7 minimum '+MIN90+' nineties \u00B7 fit is the weighted average of the selected metrics\u2019 league-and-role percentiles inside '+POOL_NAME[SK.pool]+'.</p>'+
     '<div class="fs-panel-foot">'+exportButtons('.fs-panel')+'</div></section>';
  return s;
}

let CMP_LAST=null;
function compareGroups(){const groups=[];DEFS.forEach(function(d){if(groups.indexOf(d.grp)<0)groups.push(d.grp)});return groups}
function compareCsv(){
  if(!CMP_LAST)return;const c=CMP_LAST;
  downloadCsv('compare_'+c.pa.player_name+'_'+c.pb.player_name,'Compare · category '+(CMP.grp||'All')+' · A: '+c.pa.player_name+' · cohort '+cohortLine(c.pa)+' · B: '+c.pb.player_name+' · cohort '+cohortLine(c.pb),

    c.rows.map(function(d){const a=c.A[d.key],b=c.B[d.key];
      return [d.grp,d.label,metricUnit(d.key),a&&nullableMetric(a.value)!==null?a.value:'',a&&nullableMetric(a.pct)!==null?a.pct:'',b&&nullableMetric(b.value)!==null?b.value:'',b&&nullableMetric(b.pct)!==null?b.pct:'']}));

async function renderCompare(){
  const request=++viewGeneration;
  const main=document.getElementById('main');
  const pool=PLAYERS.filter(function(p){return p.pool===CMP.pool&&p.nineties>=MIN90&&teamInLeague(p.team)})
                    .sort(function(a,b){return (a.player_name||'').localeCompare(b.player_name||'')});
  if(!CMP.a&&pool[0])CMP.a=pool[0].player_id;
  if(!CMP.b){const other=pool.find(function(p){return p.player_id!==CMP.a});if(other)CMP.b=other.player_id}
  const groups=compareGroups();
  if(CMP.grp!=='All'&&groups.indexOf(CMP.grp)<0)CMP.grp='All';
  const ctrl='<div class="pl-head"><div><h2 class="fs-title">Compare</h2>'+
    '<p class="fs-sub">Two players, each read against his own league-and-role cohort. The bars are not a league-strength adjustment.</p></div></div>'+

      POOLS.map(function(p){return '<option value="'+p+'"'+(CMP.pool===p?' selected':'')+'>'+POOL_NAME[p]+'</option>'}).join('')+'</select></div>'+
    '<div class="fs-field"><label for="cmpGrp">Category · drives both tables</label><select id="cmpGrp" onchange="CMP.grp=this.value;renderCompare()"><option value="All"'+(CMP.grp==='All'?' selected':'')+'>All categories</option>'+
      groups.map(function(g){return '<option value="'+esc(g)+'"'+(CMP.grp===g?' selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select></div></div>'+playerChoiceList('comparePlayers',CMP.pool);
  const pa0=playerOf(CMP.a),pb0=playerOf(CMP.b);
  main.innerHTML='<div class="fs-stack">'+ctrl+loadingPanel('Comparing player profiles','Loading role-relative metrics for both players.')+'</div>';
  if(!CMP.a||!CMP.b){CMP_LAST=null;main.innerHTML='<div class="fs-stack">'+ctrl+'<div class="cmp-cols">'+compareCard('a',pa0,null,groups)+compareCard('b',pb0,null,groups)+'</div>'+
    emptyState('Pick two players','Compare needs a player in both slots. Search in each card, or use Compare on a profile, a Scout row or a scatter point.','')+'</div>';return}
  try{
    const res=await Promise.all([

    const rows=DEFS.filter(function(d){return (CMP.grp==='All'||d.grp===CMP.grp)&&(A[d.key]||B[d.key])});
    CMP_LAST={pa:pa,pb:pb,A:A,B:B,rows:rows};
    let h='<div class="fs-stack">'+ctrl+'<div class="cmp-export"><div class="cmp-cols">'+
      compareCard('a',pa,{mine:A,rows:rows},groups)+compareCard('b',pb,{mine:B,rows:rows},groups)+'</div>'+
      (rows.length?'':emptyState('No measures to compare','Neither player has a row in '+(CMP.grp==='All'?'any category':CMP.grp)+'. That is missing data for this pair, not a zero.','<button type="button" class="fs-btn k" onclick="CMP.grp=\'All\';renderCompare()">Show all categories</button>'))+
      '<p class="fs-note" style="margin-top:var(--s4)">Bars show each player’s own league-and-role percentile, not a league-strength adjustment. Raw values retain their stated units. Minimum '+MIN90+' nineties (source rule). Eligible role-directory peers: '+esc(pa.player_name)+' '+eligiblePeers(pa)+'; '+esc(pb.player_name)+' '+eligiblePeers(pb)+'. Per-metric cohort N unavailable.</p>'+
      '<div class="fs-panel-foot">'+legendHtml()+exportButtons('.cmp-export','<button type="button" class="fs-btn k" onclick="compareCsv()">CSV</button>')+'</div></div></div>';

}

/* ---------- RANK / LEADERBOARD ---------- */
/* The rail is a population builder. Leagues come from SCOPE: with one league in
   scope the population is that league; with All leagues in scope any subset can
   be ticked, and more than one ticked league is a pooled population. Pillar
   rankings keep their own league choice, as before. */
let PILLAR=null,pillarRequest=0,RANK_LAST=null;
function leagueName(code){return LEAGUE_DISPLAY[code]||code}
function scopeLeagues(){return PLEAGUES.filter(function(l){return PLGSCOPE==='ALL'||l.league===PLGSCOPE}).map(function(l){return l.league})}
function rankAvailable(){return PILLAR?PLEAGUES.map(function(l){return l.league}):scopeLeagues()}
function rankLeagues(){
  const avail=rankAvailable();let sel;
  if(PILLAR)sel=Array.isArray(PILLAR.leagues)?PILLAR.leagues:(PILLAR.league==='ALL'?avail:[PILLAR.league]);
  else sel=Array.isArray(RK.leagues)?RK.leagues:avail;
  sel=avail.filter(function(l){return sel.indexOf(l)>=0});
  return sel.length?sel:avail;
}
function rankMin(){const v=Math.floor(+RK.min90);return Number.isFinite(v)&&v>MIN90?v:MIN90}
function toggleRankLeague(code,on){
  const avail=rankAvailable();let sel=rankLeagues().filter(function(l){return l!==code});if(on)sel.push(code);
  if(!sel.length){say('A population needs at least one league');renderRank();return}
  sel=avail.filter(function(l){return sel.indexOf(l)>=0});
  if(PILLAR){PILLAR.leagues=sel;PILLAR.league=sel.length===1?sel[0]:'ALL'}
  else RK.leagues=sel.length===avail.length?null:sel;
  renderRank();
}
function pillarNames(){const out=[];Object.keys(WEIGHTS||{}).forEach(function(pool){Object.keys(WEIGHTS[pool]).forEach(function(n){if(out.indexOf(n)<0)out.push(n)})});return out}
function setRankBy(v){
  if(v.indexOf('pillar:')===0){
    const name=v.slice(7),current=playerOf(SEL);
    if(PILLAR)PILLAR=Object.assign({},PILLAR,{name:name});
    else{const sel=rankLeagues();PILLAR={name:name,pool:RK.pool||(current&&current.pool)||'W',league:sel.length===1?sel[0]:'ALL',leagues:sel,selected:SEL?String(SEL):''}}
  }else{PILLAR=null;RK.metric=v}
  renderRank();
}
function setRankRole(v){if(PILLAR){if(v)PILLAR.pool=v}else RK.pool=v;renderRank()}
function rankPopulation(leagues,role,min,count,note){
  return leagues.map(leagueName).join(' + ')+(leagues.length>1?' (pooled)':'')+' · '+(role?POOL_NAME[role]:'all roles')+' · source rule '+sourceRule()+
    (min>MIN90?' · filtered to '+min+'+ nineties':'')+(count==null?'':' · '+count+' players')+(note?' · '+note:'');
}
function rankCtrls(){
  const avail=rankAvailable(),sel=rankLeagues(),role=PILLAR?PILLAR.pool:RK.pool,min=rankMin();
  const count=function(code){return PLAYERS.filter(function(p){return lgOfTeam(p.team)===code&&+p.nineties>=min&&(role?p.pool===role:!!p.pool)}).length};
  let h='<fieldset class="rail-set fs-rail-full"'+(PILLAR?' aria-label="Pillar league"':' aria-label="Population leagues"')+'><legend>Leagues · eligible players</legend>'+

      return '<label class="fs-check"'+(inScope?'':' title="Outside SCOPE. Set SCOPE to All leagues in the top bar to pool leagues."')+'><input type="checkbox" id="rkLeague'+i+'"'+(on?' checked':'')+(inScope?'':' disabled')+
        ' onchange="toggleRankLeague(\''+esc(l.league)+'\',this.checked)"><span>'+esc(l.display_name)+'</span><b>'+count(l.league)+'</b></label>'}).join('')+
    '<p class="fs-note">'+(sel.length>1?'<b>Pooled:</b> '+sel.length+' leagues are read as one population.':'One league: a within-league population.')+
      (!PILLAR&&PLGSCOPE!=='ALL'?' SCOPE is '+esc(scopeLabel())+'; set SCOPE to All leagues to pool.':'')+'</p></fieldset>'+
    '<div class="fs-field fs-rail-full"><label for="rkPool">Role</label><select id="rkPool"'+(PILLAR?' aria-label="Pillar role"':'')+' onchange="setRankRole(this.value)">'+
      (PILLAR?'':'<option value="">All roles</option>')+
      POOLS.map(function(p){return '<option value="'+p+'"'+(role===p?' selected':'')+'>'+POOL_NAME[p]+'</option>'}).join('')+
      '</select></div>'+
    '<div class="fs-field fs-rail-full"><label for="rkBy">Rank players by</label>'+
      '<select id="rkBy" onchange="setRankBy(this.value)"><optgroup label="Pillars · composite score">'+
      pillarNames().map(function(n){return '<option value="pillar:'+esc(n)+'"'+(PILLAR&&PILLAR.name===n?' selected':'')+'>'+esc(n)+' pillar</option>'}).join('')+'</optgroup>'+
      metricOptions(PILLAR?'':RK.metric)+'</select></div>'+
    '<div class="fs-field"><label for="rkMin">Min nineties</label><input id="rkMin" type="number" min="'+MIN90+'" step="1" value="'+min+'" title="The source rule is '+sourceRule()+'. A higher number narrows the population shown; own-league percentiles stay as published." onchange="RK.min90=Math.max('+MIN90+',Math.floor(+this.value)||'+MIN90+');renderRank()"></div>'+
    '<div class="fs-field"><label for="rkN">Show</label><select id="rkN" onchange="RK.n=+this.value;renderRank()">'+
      [10,25,50,100].map(function(n){return '<option value="'+n+'"'+(RK.n===n?' selected':'')+'>Top '+n+'</option>'}).join('')+
      '</select></div>';
  if(PILLAR)h+='<div class="rail-btns fs-rail-full"><button type="button" class="fs-btn" onclick="PILLAR=null;setTab(\'Player\')">← Player profile</button>'+

/* ---------- PITCH VISUALISATIONS ---------- */
/* Pitch drawn in metres (105 x 68). WhoScored coords are 0-100 on both axes,
   so x scales by 1.05 and y by 0.68 to keep the aspect ratio honest.
   Attack is always left-to-right. */
function PX(x){return x*1.05}
function PY(y){return (100-y)*0.68}
function PY0(a,b){return Math.min(PY(a),PY(b))}
function PYH(a,b){return Math.abs(PY(a)-PY(b))}
function pitchMarks(zones){
  const st='fill="none" stroke="var(--pitchline)" stroke-width="0.32"';
  let grid='';
  /* Pattern mode aggregates into a 6 by 4 zone grid, so the grid is drawn. */
  if(zones){
    for(let i=1;i<6;i++)grid+='<line class="zone-line" x1="'+(105*i/6).toFixed(2)+'" y1="0" x2="'+(105*i/6).toFixed(2)+'" y2="68"/>';
    for(let j=1;j<4;j++)grid+='<line class="zone-line" x1="0" y1="'+(68*j/4)+'" x2="105" y2="'+(68*j/4)+'"/>';
  }
  return '<rect class="pitch-ground" x="0" y="0" width="105" height="68"/>'+grid+
    '<rect x="0" y="0" width="105" height="68" '+st+'/>'+
    '<line x1="52.5" y1="0" x2="52.5" y2="68" stroke="var(--pitchline)" stroke-width="0.32"/>'+
    '<circle cx="52.5" cy="34" r="9.15" '+st+'/>'+
    '<circle cx="52.5" cy="34" r="0.45" fill="var(--pitchline)"/>'+
    '<rect x="0" y="13.84" width="16.5" height="40.32" '+st+'/>'+
    '<rect x="88.5" y="13.84" width="16.5" height="40.32" '+st+'/>'+
    '<rect x="0" y="24.84" width="5.5" height="18.32" '+st+'/>'+
    '<rect x="99.5" y="24.84" width="5.5" height="18.32" '+st+'/>'+
    '<circle cx="11" cy="34" r="0.4" fill="var(--pitchline)"/>'+
    '<circle cx="94" cy="34" r="0.4" fill="var(--pitchline)"/>'+
    '<rect x="-1.3" y="30.34" width="1.3" height="7.32" '+st+'/>'+
    '<rect x="105" y="30.34" width="1.3" height="7.32" '+st+'/>';
}
/* Pitch box: header, controls, pitch, direction and orientation, caption,
   legend, then a footer that carries the links and the exports. The pitch is
   never rotated and the orientation line travels with it into every export. */
function pitchWrap(title,sub,inner,legend,ctrl){

    pitchMarks(opts.zones)+inner+
    '</svg></div><div class="pitch-dir"><p class="fs-orient orient-note">Orientation · attack left → right · team right = bottom edge</p>'+
    '<div class="attack-direction" aria-label="Attacking left to right">ATTACKING <span aria-hidden="true">→</span></div></div>'+
    (sub?'<p class="fs-pitch-caption viz-sub">'+sub+'</p>':'')+

      '<button type="button" class="fs-btn k" onclick="exportViz(\'pdf\',this)">PDF</button></span></div>')+'</section>';

/* On a wide canvas the pitch is sized so the whole box sits in the first
   screen; once the canvas is one column it keeps its natural aspect ratio. */
function fitPlayerPitches(){
  const main=document.getElementById('main');if(!main)return;
  const natural=window.innerWidth<=760||main.classList.contains('narrow');
  document.querySelectorAll('#main .pitch-viz .pitch-box').forEach(function(box){
    if(box.closest('.studio-card'))return;
    if(natural){box.style.height='';return}
    const rect=box.getBoundingClientRect(),host=box.closest('.pitch-viz').getBoundingClientRect();
    const below=Math.max(0,host.bottom-rect.bottom);
    box.style.height=Math.max(180,Math.min(540,window.innerHeight-(rect.top+main.scrollTop)-below-18))+'px';
  });
}
window.addEventListener('resize',function(){requestAnimationFrame(fitPlayerPitches)});
window.addEventListener('fs:narrow',function(){requestAnimationFrame(fitPlayerPitches)});
function markerKey(shape,c){
  shape=shape||'circle';
  const p={circle:'<circle cx="8" cy="8" r="4.5"',square:'<rect x="3.5" y="3.5" width="9" height="9"',
    diamond:'<path d="M8 2L14 8L8 14L2 8Z"',triangle:'<path d="M8 2L14 13L2 13Z"',
    cross:'<path d="M3 3L13 13M13 3L3 13"',ring:'<circle cx="8" cy="8" r="5"'};
  const open=shape==='cross'||shape==='ring';
  return '<svg class="layer-glyph" aria-hidden="true" viewBox="0 0 16 16">'+p[shape]+
    (open?' fill="none" stroke="'+c+'" stroke-width="2"/>':' fill="'+c+'" fill-opacity=".82"/>')+'</svg>';
}
function lg(c,t,n,shape){return '<span>'+markerKey(shape,c)+t+'</span>'}
function movementKey(pattern){return pattern?'<span><b>Arrows</b> show repeated direction</span>':'<span><b>Hollow ring</b> = start · <b>solid dot</b> = destination</span>'}
function eventTip(a){
  if(!a||a.game_id==null)return'';
  const date=a.kickoff?new Date(a.kickoff).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'Fixture';
  const clock=a.minute==null?'time unknown':(+a.minute+'\''+(a.second!=null?' '+String(+a.second).padStart(2,'0')+'s':''));
  const state=a.score_state?String(a.score_state).replace(/^./,function(c){return c.toUpperCase()}):'state unknown';
  return date+' vs '+(a.opponent||'opponent unknown')+' · '+clock+' · '+state+(a.score_margin!=null?' ('+(+a.score_margin>0?'+':'')+a.score_margin+')':'')+' · '+(a.sp_phase?'Set piece':'Open play');
}
function eventSvg(a,markup){const tip=eventTip(a);return tip?'<g><title>'+esc(tip)+'</title>'+markup+'</g>':markup}
/* Origin ring: hollow circle where the ball starts, hairline through the middle,
   solid dot where it arrives. Reads as a journey rather than a vector, and keeps
   both ends legible when lines overlap. */
function line(a,c,w,op,dash,headShape,strong){
  const x1=PX(a.x),y1=PY(a.y),x2=PX(a.end_x),y2=PY(a.end_y);
  const W=Math.max(w||0.34,0.28), o=Math.max(op==null?0.85:op,0.85);
  const shaft='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+
    '" stroke-width="'+(W*0.85).toFixed(3)+'" stroke-opacity="'+(o).toFixed(3)+
    '" stroke-linecap="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
  const ring='<circle cx="'+x1+'" cy="'+y1+'" r="'+(W*1.12).toFixed(3)+'" fill="none" stroke="'+c+
    '" stroke-width="'+(W*0.52).toFixed(3)+'" stroke-opacity="'+(o*0.8).toFixed(3)+'"/>';
  const radius=W*1.5;
  const head=headShape==='diamond'?'<path d="M'+x2+' '+(y2-radius)+'L'+(x2+radius)+' '+y2+'L'+x2+' '+(y2+radius)+'L'+(x2-radius)+' '+y2+'Z" fill="'+c+'" fill-opacity="'+Math.min(1,o*1.15).toFixed(3)+'"/>':
    '<circle cx="'+x2+'" cy="'+y2+'" r="'+(W*1.15).toFixed(3)+'" fill="'+c+

/* Pattern mode uses a deliberately coarse 6 x 4 grid: enough to reveal lanes
   and repeated routes without implying false coordinate precision. */
function flowPattern(items,color,limit){
  const NX=6,NY=4,orig={},flows={};
  function zone(x,y){const ix=Math.max(0,Math.min(NX-1,Math.floor((+x||0)/100*NX)));
    const iy=Math.max(0,Math.min(NY-1,Math.floor((+y||0)/100*NY)));return ix+','+iy}
  function centre(k){const p=k.split(',').map(Number);return{x:(p[0]+.5)*100/NX,y:(p[1]+.5)*100/NY}}
  items.forEach(function(a){
    const sx=a.start_x!=null?a.start_x:a.x,sy=a.start_y!=null?a.start_y:a.y;
    if(sx==null||sy==null||a.end_x==null||a.end_y==null)return;
    const f=zone(sx,sy),t=zone(a.end_x,a.end_y);orig[f]=(orig[f]||0)+1;
    if(f!==t){const k=f+'>'+t;flows[k]=(flows[k]||0)+1}
  });
  const os=Object.keys(orig).sort(),fs=Object.keys(flows).sort(function(a,b){return flows[b]-flows[a]||a.localeCompare(b)}).slice(0,limit||8);
  const om=Math.max.apply(null,os.map(function(k){return orig[k]}).concat([1]));
  const fm=Math.max.apply(null,fs.map(function(k){return flows[k]}).concat([1]));
  let s='<g class="pattern-layer">';
  os.forEach(function(k){const p=centre(k),q=Math.sqrt(orig[k]/om);s+='<circle cx="'+PX(p.x)+'" cy="'+PY(p.y)+
    '" r="'+(1.1+3.2*q).toFixed(2)+'" fill="'+color+'" fill-opacity="'+(0.07+0.16*q).toFixed(2)+'"/>'});
  fs.forEach(function(k,idx){const a=k.split('>'),p=centre(a[0]),q=centre(a[1]),x1=PX(p.x),y1=PY(p.y),x2=PX(q.x),y2=PY(q.y);
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    const w=.45+1.7*Math.sqrt(flows[k]/fm),ah=1.5+w*.65,bx=x2-ux*ah,by=y2-uy*ah;
    s+='<line x1="'+x1.toFixed(2)+'" y1="'+y1.toFixed(2)+'" x2="'+x2.toFixed(2)+'" y2="'+y2.toFixed(2)+
      '" stroke="'+color+'" stroke-width="'+w.toFixed(2)+'" stroke-opacity="'+(.34+.5*flows[k]/fm).toFixed(2)+'" stroke-linecap="round"'+
      (color===PAL.fail?' stroke-dasharray="1.2 .8"':'')+'/>'+
      '<path d="M'+x2.toFixed(2)+' '+y2.toFixed(2)+'L'+(bx+nx*ah*.55).toFixed(2)+' '+(by+ny*ah*.55).toFixed(2)+
      'L'+(bx-nx*ah*.55).toFixed(2)+' '+(by-ny*ah*.55).toFixed(2)+'Z" fill="'+color+'" fill-opacity=".86"/>';
    if(idx<3){const mx=(x1+x2)/2+nx*1.8,my=(y1+y2)/2+ny*1.8;
      s+='<text x="'+mx.toFixed(2)+'" y="'+(my+.5).toFixed(2)+'" text-anchor="middle" fill="'+color+'" font-size="1.5" font-weight="800" stroke="var(--panel)" stroke-width=".65" paint-order="stroke">'+flows[k]+'</text>'}
  });
  return s+'</g>';
}

function vizPanel(grp,p){
  if(!PACT)return noData('Loading actions…');
  const cfg=vizLayers(grp,p);
  if(!cfg)return noData('No pitch view is defined for '+grp+': these measures are not drawn from plotted actions. The table carries the evidence.');
  if(!VZ.off[grp])VZ.off[grp]=(grp==='Passing'?{fail:true}:(grp==='Carrying'?{other:true}:(grp==='Defending'?{Clearance:true,BlockedPass:true,Challenge:true,Save:true}:{})));
  const off=VZ.off[grp];
  const live=cfg.layers.filter(function(l){return l.items.length});
  if(!live.length)return noData('No '+grp.toLowerCase()+' actions were returned for this player, so there is nothing to plot. Every layer counts 0.');

  const supportsPattern=(grp==='Passing'||grp==='Carrying'||grp==='Combined');
  if(supportsPattern&&!VZ.mode[grp])VZ.mode[grp]='pattern';
  const isPattern=supportsPattern&&VZ.mode[grp]!=='events';
  let inner=cfg.base||'';
  live.forEach(function(l){
    if(off[l.k])return;
    if(isPattern)inner+=flowPattern(l.items,l.color,grp==='Passing'?7:(grp==='Combined'?5:6));
    else l.items.forEach(function(it){inner+=l.draw(it)});
  });

  const chips='<div class="fs-pitchbox-show vz-filters">'+(cfg.tog||'')+'<span class="fs-label vz-flabel">Show</span>'+
    live.map(function(l){
      return '<button type="button" class="fs-layer lchip'+(off[l.k]?' off':'')+(l.k==='fail'?' is-incomplete':'')+'" aria-pressed="'+(!off[l.k])+'" onclick="tglLayer(\''+grp+'\',\''+l.k+'\')">'+
        markerKey(l.shape,l.color)+esc(l.label)+' <b>'+l.items.length+'</b></button>';
    }).join('')+
    (live.length>1?'<button type="button" class="fs-btn sm lchip solo" onclick="allLayers(\''+grp+'\')">reset</button>':'')+
    '</div>';

  const legend=(cfg.outcomeKey?shotOutcomeLegend(live,off):live.filter(function(l){return !off[l.k]})
    .map(function(l){return lg(l.color,l.label,l.items.length,l.shape)}).join(''))+
    (cfg.sizeKey?shotSizeKey():'')+
    (live.some(function(l){return !off[l.k]&&l.items.some(function(a){return a.end_x!=null})})?movementKey(isPattern):'')+
    (isPattern?'<span>Nodes = origin volume · arrows = strongest repeated zone flows · top three labelled</span>':'');

  const mode=supportsPattern?'<div class="fs-seg" role="group" aria-label="Pitch mode">'+
    '<button type="button" class="vzb'+(isPattern?' on':'')+'" aria-pressed="'+isPattern+'" onclick="VZ.mode[\''+grp+'\']=\'pattern\';refreshViz()">Pattern</button>'+
    '<button type="button" class="vzb'+(!isPattern?' on':'')+'" aria-pressed="'+(!isPattern)+'" onclick="VZ.mode[\''+grp+'\']=\'events\';refreshViz()">Events</button></div>':'';
  const links='<a class="fs-link" href="'+(grp==='Combined'?'glossary.html':glossaryCat(grp))+'">Data table</a>'+
    '<a class="fs-link" href="methodology.html#zone-definitions">Zone definitions</a>';
  return pitchWrap(cfg.title,cfg.sub+(isPattern?' Aggregated into a 6 by 4 zone grid.':''),inner,legend,chips,
    cfg.focus&&VZ.shotFocus?'49 -3 59 74':'-3 -3 111.5 74',{mode:mode,links:links,zones:isPattern});
}

  const d=defOf(key)||{}; const kind=DRILL[key];

  const G=PAL.ok,R=PAL.fail,AC=PAL.box,B=PAL.prog,Y=PAL.carry,N='var(--muted)';

  const carry=function(f,c,w,op){C.filter(f).forEach(function(c2){

  if(kind==='passes')      pass(function(a){return a.type==='Pass'&&a.is_open_play&&a.ok},G,0.16,0.3);
  else if(kind==='prog')   pass(function(a){return a.prog&&a.ok},B,0.3,0.75);

  else if(kind==='through')pass(function(a){return a.through},B,0.36,0.9);
  else if(kind==='cross')  pass(function(a){return a.cross_},AC,0.3,0.75);
  else if(kind==='key')    pass(function(a){return a.keypass},G,0.32,0.85);
  else if(kind==='assist') pass(function(a){return a.assist},AC,0.5,1);
  else if(kind==='xtpass'||kind==='xtall'||kind==='xtcarry'){
    if(kind!=='xtcarry'){
      A.filter(function(a){return a.type==='Pass'&&a.ok&&a.is_open_play&&a.end_x!=null}).forEach(function(a){
        const g=xtOf(a.end_x,a.end_y)-xtOf(a.x,a.y);
        if(g<=0.004)return;
        inner+=line(a,B,0.16+Math.min(0.5,g*7),0.35+Math.min(0.6,g*9));n++;});
    }
    if(kind!=='xtpass'){
      C.filter(function(c2){return c2.is_progressive}).forEach(function(c2){
        const g=xtOf(c2.end_x,c2.end_y)-xtOf(c2.start_x,c2.start_y);
        if(g<=0.004)return;
        inner+=line(Object.assign({},c2,{x:c2.start_x,y:c2.start_y}),Y,0.16+Math.min(0.5,g*7),0.4);n++;});
    }

    leg=(kind!=='xtcarry'?lg(B,'Passes that added threat'):'')+(kind!=='xtpass'?lg(Y,'Carries that added threat'):'');
  }
  else if(kind==='carries')     carry(function(){return true},N,0.16,0.28);
  else if(kind==='progcarries') carry(function(c2){return c2.is_progressive},Y,0.3,0.8);
  else if(kind==='carrybox')    carry(function(c2){return c2.into_box},AC,0.34,0.9);

             sot:function(a){return a.is_shot&&(a.shot_outcome==='saved'||a.shot_outcome==='goal')},
             goals:function(a){return a.is_shot&&a.is_goal},
             bigchance:function(a){return a.is_shot&&a.bigchance},
             hsshot:function(a){return a.is_shot&&a.x>=50&&((a.y>=21.1&&a.y<=36.8)||(a.y>=63.2&&a.y<=78.9))},
             spshot:function(a){return a.is_shot&&a.sp_phase}}[kind];
    let sx=0,knownCount=0;
    A.filter(f).forEach(function(a){
      const xg=a.xg==null?null:+a.xg;if(xg!=null&&Number.isFinite(xg)){sx+=xg;knownCount++}const r=xg==null?0.65:Math.max(0.52,0.26+Math.sqrt(Math.max(0,xg))*0.92);

    sub='Filtered evidence: '+sx.toFixed(2)+' known xG; '+knownCount+'/'+n+' shots have xG. Missing xG is not zero. Open-play shots exclude penalties; season-reference xG/90 includes them.';
    leg=lg(AC,'Goal')+lg(G,'Saved')+lg(B,'Blocked')+lg(R,'Off target');
  }
  else if(kind==='takeon'||kind==='tackle'||kind==='int'||kind==='recov'||kind==='clear'||kind==='aerial'||kind==='def'){
    const types={takeon:['TakeOn'],tackle:['Tackle'],int:['Interception'],recov:['BallRecovery'],

  else if(kind==='hspass'||kind==='hsprog'){
    inner+='<rect x="'+PX(50)+'" y="'+PY0(21.1,36.8)+'" width="'+PX(50)+'" height="'+PYH(21.1,36.8)+'" class="fs-pitch-zone"/>'+

  if(!n){inner+='<text x="50" y="35" text-anchor="middle" fill="var(--muted)" font-size="2.6">No actions match these filters</text>';
    sub+=' No actions match these filters. Clear the fixture or match-state filters to inspect the full sample.'}

  const r=ctx.pmcache[key]||null;

    '<div class="pitch-box" style="height:min(58vh,540px)"><svg role="img" aria-label="'+esc((d.label||key)+' actions for '+p.player_name+'. Attack is left to right; the attacking team’s right side is the bottom edge.')+'" viewBox="-3 -3 111.5 78" preserveAspectRatio="xMidYMid meet" '+

function playerState(){const state={v:1,tab:TAB,league:PLGSCOPE,player:SEL,group:GRP};const team=document.getElementById('teamSel').value,pool=document.getElementById('poolSel').value,q=document.getElementById('search').value;if(team)state.team=team;if(pool)state.pool=pool;if(q)state.q=q;if(TAB==='Rank'){state.rank=RK;if(PILLAR)state.pillar=PILLAR}if(TAB==='Scatter')state.scatter=SC;if(TAB==='Compare')state.compare=CMP;if(TAB==='Scout')state.scout={pool:SK.pool,metrics:SK.metrics,sort:SK.sort,show:SK.show};const evidence=Object.fromEntries(Object.entries(EVF).filter(function(x){return x[1]!==''}));if(Object.keys(evidence).length)state.evidence=evidence;state.map=VZ;if(TAB==='Plot studio')state.studio=PB;return state;}
function savePlayerState(replace){if(restoringPlayerState||!PLAYERS.length)return;const u=new URL(location.href),s=playerState();u.searchParams.set('state',JSON.stringify(s));u.searchParams.set('view',TAB);if(SEL)u.searchParams.set('player',SEL);else u.searchParams.delete('player');if(u.href!==location.href)history[replace?'replaceState':'pushState']({},'',u);}

    if(s.scatter&&metric(s.scatter.x)&&metric(s.scatter.y)&&POOLS.includes(s.scatter.pool))Object.assign(SC,{x:s.scatter.x,y:s.scatter.y,pool:s.scatter.pool,hi:(s.scatter.hi||[]).filter(function(id){return !!playerOf(id)}),unit:s.scatter.unit==='pct'?'pct':'val',min90:Number.isFinite(+s.scatter.min90)&&+s.scatter.min90>MIN90?Math.floor(+s.scatter.min90):MIN90,labels:['none','out','all'].includes(s.scatter.labels)?s.scatter.labels:'out',med:s.scatter.med!==false,sel:s.scatter.sel!==false,size:s.scatter.size===true});
    if(s.compare&&POOLS.includes(s.compare.pool))CMP={pool:s.compare.pool,a:playerOf(s.compare.a)?s.compare.a:null,b:playerOf(s.compare.b)?s.compare.b:null,grp:typeof s.compare.grp==='string'?s.compare.grp:'All'};
    if(s.scout&&POOLS.includes(s.scout.pool)){SK.pool=s.scout.pool;SK.metrics=(s.scout.metrics||[]).filter(function(m){return metric(m.k)&&Number.isFinite(m.w)&&m.w>=0&&m.w<=5}).slice(0,10);SK.show=['both','val','pct'].includes(s.scout.show)?s.scout.show:'both';SK.sort=s.scout.sort&&typeof s.scout.sort.col==='string'?{col:s.scout.sort.col,dir:s.scout.sort.dir===1?1:-1}:{col:'fit',dir:-1}}

    if(s.studio&&typeof s.studio==='object'){PB.mode=s.studio.mode==='events'?'events':'pizza';PB.metrics=(s.studio.metrics||[]).filter(metric);PB.layers=(s.studio.layers||[]).filter(k=>['pass','fail','prog','box','key','through','carry','progc','carrybox','receipt','shot','tackle','int','recov'].includes(k));PB.ready=true;if(typeof s.studio.group==='string')PB.group=s.studio.group;PB.pattern=s.studio.pattern!==false;PB.color=['cat','band','single'].includes(s.studio.color)?s.studio.color:'cat';PB.title=typeof s.studio.title==='string'?s.studio.title.slice(0,90):'';}

  }finally{if(restore===playerRestoreGeneration)restoringPlayerState=false}
}

/* Published as-of date. Derived from the last analytics rebuild that actually
   completed, not from when a summary table was last touched.
   mv_site_summary.refreshed_at reports when refresh_site_summaries last ran,
   which is independent of whether the analytics layer rebuilt: on 14 September
   it read 17:41 while every metric matview was from 1 September. A failed gate
   deliberately leaves this stamp where it was, so fresher but unverified data
   sits behind an honest stale date rather than a confident wrong one. */
var ASOF=null;
function renderAsOf(){
  var el=document.getElementById('asOf'); if(!el) return;
  if(!ASOF||!ASOF.as_of){ el.textContent='as of unavailable'; el.className='as-of warn'; return; }
  var d=new Date(ASOF.as_of);
  var txt='data as of '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+
          ' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(ASOF.is_stale) txt+=' \u00B7 '+Math.round(ASOF.hours_old)+'h old';
  el.textContent=txt;
  el.className='as-of'+(ASOF.is_stale?' warn':'');
  if(window.FutScout)FutScout.setFreshness(ASOF);
}
fetch(SB+'/rest/v1/v_analytics_as_of?select=*',{headers:HD})
  .then(function(r){return r.ok?r.json():null})
  .then(function(rows){ ASOF=rows&&rows[0]||null; renderAsOf(); })
  .catch(function(){ renderAsOf(); });
