<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Fingerprints</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=pr1">
<script src="site-tools.js?v=pr1"></script>
<style>
/* Light canvas, surfaces, lines, text and the font tokens are in theme.css.
   Light accent is the shared brand accent from there, so the tints below match
   it; the percentile tier ramp and shadow stay page level. */
:root{
  --accent-glow:rgba(239,1,7,0.18);
  --above:var(--p60);--below:var(--p20);
  
}
html.dark{
  --accent-dim:rgba(216,179,132,0.12);
  --bg2:var(--panel);
  --surface2:rgba(255,255,255,0.07);
  --border2:var(--rule);
  --text2:var(--ink);
  --above:var(--p80);--below:var(--p20);
  
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body)}
body{display:flex;flex-direction:column;overflow:hidden}

/* Header base is in shell.css. These are this page's differences from it. */
.hdr-logo{font:800 13px/1 var(--body);color:var(--bg)}
.tabs{min-width:0;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.lnk{background:var(--surface);border:1px solid var(--border);color:var(--text2);font:500 11px/1 var(--body);padding:6px 12px;border-radius:var(--radius);cursor:pointer;text-decoration:none;transition:.15s;white-space:nowrap}
.lnk:hover{background:var(--surface2);color:var(--text)}
.lnk.acc{background:var(--accent-dim);border-color:var(--accent-glow);color:var(--accent)}

.wrap{flex:1;display:flex;overflow:hidden}
.side{width:284px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.side.hide{display:none}
.side-top{padding:12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.inp,.sel{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font:500 12px/1 var(--body);padding:8px 10px;border-radius:var(--radius);outline:none}
.inp:focus,.sel:focus{border-color:var(--accent)}
.plist{flex:1;overflow-y:auto;padding:6px}
/* Picking a player from the sidebar is an action on this page, so it is a real
   button. The reset strips the browser's own button skin so the row looks and
   sits exactly where it did as a div. */
.pitem{padding:8px 10px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;gap:8px;transition:.12s;
  width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left}
.pitem:hover{background:var(--surface)}
.pitem.on{background:var(--accent-dim);box-shadow:inset 2px 0 0 var(--accent)}
.pitem:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pitem-nm{font:600 12.5px/1.2 var(--f-body);letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem-meta{font:500 10px/1.2 var(--body);color:var(--text3);margin-top:2px}
.badge{font:700 9px/1 var(--f-data);padding:3px 6px;border-radius:var(--radius);background:var(--surface2);color:var(--text2);flex-shrink:0}

.main{flex:1;overflow-y:auto;padding:13px 18px}
.empty{height:100%;display:grid;place-items:center;color:var(--text3);font:500 13px/1 var(--body)}

.pcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);display:flex;gap:20px;align-items:flex-start;border-left:4px solid var(--accent);margin-bottom:14px;flex-wrap:wrap}
.pcard-l{flex:1;min-width:240px}
.pname{font:800 27px/1.08 var(--f-display);letter-spacing:-.025em;margin:0}
.pmeta{font:500 11px/1.5 var(--body);color:var(--text2);margin-top:5px}
.chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.chip{font:600 10px/1 var(--body);padding:5px 9px;border-radius:var(--radius);background:var(--surface2);color:var(--text2)}
.chip.acc{background:var(--accent-dim);color:var(--accent)}
.chip.warn{background:rgba(251,146,60,.15);color:var(--below)}
.pcard-r{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:190px}
.pool-lbl{font:700 9px/1 var(--f-body);color:var(--text3);letter-spacing:.14em;text-transform:uppercase}
.pool-val{font:700 17px/1.1 var(--f-display);letter-spacing:-.015em;color:var(--accent);margin-top:6px}
.pool-sub{font:500 10px/1.5 var(--body);color:var(--text3);margin-top:5px}
.value-card .pool-val{font-variant-numeric:tabular-nums}
.value-card .pool-sub{max-width:24ch}

.dna{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.dcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;min-width:96px;flex:1;box-shadow:var(--shadow)}
.dcard-l{font:700 9px/1 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--text3);display:flex;justify-content:space-between;gap:6px}
.dcard-v{font:700 21px/1 var(--f-data);letter-spacing:-.03em;margin:6px 0 5px;font-variant-numeric:tabular-nums}
.dcard-b{height:4px;background:var(--surface2);border-radius:var(--radius);overflow:hidden}
.dcard-b span{display:block;height:100%;border-radius:var(--radius)}
.dtag{font:700 8px/1 var(--body);color:var(--text3)}
.ocard{background:var(--bg3);border:1px solid var(--accent-glow);border-radius:var(--radius);padding:9px 10px;min-width:108px}
@media(min-width:1181px){
  .dna{display:grid;grid-template-columns:repeat(9,minmax(0,1fr))}
  .dcard,.ocard{min-width:0}
}

.gtabs{display:flex;gap:3px;background:var(--surface);border-radius:var(--radius);padding:3px;margin-bottom:9px;flex-wrap:wrap}
.gtab{background:none;border:none;color:var(--text3);font:600 11px/1 var(--body);padding:7px 12px;border-radius:var(--radius);cursor:pointer}
.gtab:hover{color:var(--text)}
.gtab.on{color:var(--text);background:var(--bg3);box-shadow:var(--shadow)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.sect{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;box-shadow:var(--shadow)}
.sect-h{font:700 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--text2);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:grid;grid-template-columns:160px 68px 1fr 34px;align-items:center;gap:10px;padding:5px 0}
.row-lbl{font:500 12px/1.35 var(--f-body);color:var(--text2);cursor:help;border-bottom:1px dotted var(--border2);justify-self:start}
.row-val{font:500 11px/1 var(--f-data);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:9px;background:var(--surface2);border-radius:var(--radius);overflow:hidden}
.bar-f{height:100%;border-radius:var(--radius);transition:width .35s ease}
.rankbar{height:9px;background:var(--surface2);border-radius:var(--radius);position:relative;overflow:hidden}
.rankbar-f{position:absolute;top:0;height:100%;border-radius:var(--radius);transition:left .35s ease,width .35s ease}
.rankbar-zero{position:absolute;top:0;bottom:0;width:1px;background:var(--text3);opacity:.7}
.row-pct{font:700 11px/1 var(--f-data);text-align:right;font-variant-numeric:tabular-nums}
.na{color:var(--text3);font:500 10px/1 var(--body)}

.ctrls{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow)}
.crow{display:flex;gap:13px;flex-wrap:wrap;align-items:flex-end}
.cfield{display:flex;flex-direction:column;gap:5px;min-width:170px}
.clbl{font:700 9px/1 var(--f-body);color:var(--text3);letter-spacing:.13em;text-transform:uppercase}
.btn{background:var(--accent);border:none;color:var(--bg);font:600 12px/1 var(--body);padding:9px 15px;border-radius:var(--radius);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surface2);color:var(--text2)}

.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.mchip{display:flex;align-items:center;gap:8px;background:var(--accent-dim);border:1px solid var(--accent-glow);border-radius:var(--radius);padding:6px 9px}
.mchip-nm{font:600 10px/1 var(--body);color:var(--accent)}
.mchip input[type=range]{width:76px;accent-color:var(--accent)}
.mchip-w{font:700 10px/1 var(--body);color:var(--text2);min-width:12px;text-align:center}
.mchip button{background:none;border:none;color:var(--text3);cursor:pointer;font:700 12px/1 var(--body)}
.hchip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:5px 9px}
.hchip-nm{font:600 10px/1 var(--body);color:var(--text)}

table{width:100%;border-collapse:collapse;font:500 11px/1.4 var(--body)}
th{text-align:left;font:700 9px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding:8px 9px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--text)}
th.sorted{color:var(--accent)}
td{padding:8px 9px;border-bottom:1px solid var(--border)}
tr:hover td{background:var(--surface)}
.num{text-align:right;font-family:var(--f-data);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fit{font:700 12.5px/1 var(--f-data);font-variant-numeric:tabular-nums}
.c-val{font:600 11.5px/1.15 var(--f-data);color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.c-pct{font:600 9px/1.15 var(--f-data);font-variant-numeric:tabular-nums;margin-top:2px;opacity:.92}
/* A name in a table loads that player, so it is a button. Everything the
   browser would add to a button is reset, leaving the dotted-underline name
   exactly as it read as a span.
   A button is an atomic inline box, so unlike the span its height feeds into
   the line box and would push every table row 2px taller. line-height:1 with
   1px beneath keeps the row at its old height and puts the dotted underline
   back on the pixel it was on. */
.pname-link{font-weight:700;color:var(--text);cursor:pointer;border-bottom:1px dotted var(--border2);
  background:none;border-top:0;border-left:0;border-right:0;padding:0 0 1px;font-family:inherit;font-size:inherit;
  line-height:1;text-align:left;vertical-align:baseline}
.pname-link:hover{color:var(--accent)}
.pname-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.split{display:grid;grid-template-columns:minmax(360px,0.85fr) minmax(420px,1.15fr);gap:12px;align-items:start}
@media(max-width:1180px){.split{grid-template-columns:1fr}.split-r{order:-1}}
.pitch-box{height:calc(100vh - 452px);min-height:230px;max-height:640px}
@media(max-width:820px){
  .pcard-l{min-width:0;width:100%;flex:1 0 100%}.hdr>div{min-width:0;max-width:100%}.directory-toggle{display:block!important;width:100%;padding:10px;text-align:left}.side.compact-directory .side-top,.side.compact-directory .plist{display:none}.cmp-row{gap:4px}.cmp-row .bar{max-width:50px}
  body{overflow:auto}.hdr{height:auto;min-height:52px;flex-wrap:wrap;padding:8px 10px}.tabs{order:3;width:100%;overflow-x:auto;margin-left:0}
  .hdr-right{flex-wrap:wrap;justify-content:flex-end;row-gap:5px}
  .wrap{display:block;overflow:visible}.side{width:100%;height:auto;max-height:44vh;border-right:0;border-bottom:1px solid var(--border)}
  .side-top{display:grid;grid-template-columns:1fr 1fr}.side-top .inp{grid-column:1/-1}.plist{max-height:25vh}
  .main{overflow:visible;padding:10px}.pcard{align-items:flex-start;flex-wrap:wrap}.pcard-r{display:block;min-width:0;flex:1 1 140px}.pcard-r.value-card{display:block;min-width:0;flex:1 1 140px}.pitch-box{height:auto;min-height:0;aspect-ratio:111.5/78}
  .vz-filters,.groups{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.lchip,.gbtn{flex:0 0 auto;min-height:36px}
  .player-overview>summary{display:flex}.player-overview:not([open]){margin-bottom:10px}.player-overview .dna{margin-top:9px}
}
.player-overview{border:0}.player-overview>summary{display:flex;cursor:pointer;align-items:center;justify-content:space-between;
  padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  color:var(--text2);font:700 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.player-overview>summary::after{content:'Show'}.player-overview[open]>summary::after{content:'Hide'}
@media(max-width:820px){.player-overview>summary{display:flex}}
.viz-eyebrow{font:700 8px/1 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.viz-title{font:700 18px/1.15 var(--f-display);letter-spacing:-.02em;color:var(--text);margin-bottom:5px}
.viz-sub{font:500 12px/1.55 var(--f-body);color:var(--text2);margin:0 0 9px;max-width:86ch}
.orient-note{font:700 8px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:-1px 0 7px}
.viz-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.viz-exp{display:flex;gap:5px;flex-shrink:0}
.viz-exp button{background:var(--surface);border:1px solid var(--border);color:var(--text3);
  font:600 9.5px/1 var(--f-body);letter-spacing:.06em;padding:6px 9px;border-radius:var(--radius);cursor:pointer}
.viz-exp button:hover{color:var(--accent);border-color:var(--accent-glow)}
.lchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  color:var(--text2);font:600 10px/1 var(--f-body);padding:6px 9px;border-radius:var(--radius);cursor:pointer;transition:.12s}
.lchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.lchip .layer-glyph{width:12px;height:12px;display:block;overflow:visible;flex:0 0 auto}
.lchip b{font-weight:700;color:var(--text3)}
.lchip:hover{border-color:var(--border2);color:var(--text)}
.lchip:focus-visible,.vzb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lchip.off{opacity:.34}
.lchip.off i{background:var(--text3)!important}
.lchip.solo{color:var(--text3);font-weight:500}
.vz-tog{display:flex;gap:4px;margin:0 0 9px;background:var(--surface);border-radius:var(--radius);padding:3px;width:fit-content}
.vzb{background:none;border:none;color:var(--text3);font:600 10px/1 var(--body);padding:6px 11px;border-radius:var(--radius);cursor:pointer}
.vzb:hover{color:var(--text)}
.vzb.on{color:var(--text);background:var(--bg3);box-shadow:var(--shadow)}
.viz-leg{display:flex;gap:13px;flex-wrap:wrap;margin-top:7px;padding-top:7px;border-top:1px solid var(--border);font:500 10px/1 var(--body);color:var(--text3)}
.viz-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.viz-leg .layer-glyph{display:inline-block;width:13px;height:13px;margin-right:5px;vertical-align:-3px;overflow:visible}
.viz-leg b{font-weight:700;color:var(--text2)}
.viz-leg .size-key{display:inline-flex;align-items:center;gap:6px}
.viz-leg .size-key svg{width:112px;height:27px;overflow:visible}
.viz-leg .shot-key{display:inline-flex;align-items:center;gap:5px}
.viz-leg .shot-key svg{width:15px;height:15px;overflow:visible}
.legend{display:flex;gap:12px;margin:0 0 10px;padding:7px 10px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--bg2);flex-wrap:wrap;align-items:center}
/* keep the pitch inside the viewport so the panel beside it does not leave a tall gap */
.split{align-items:start}
.split-r .pbox,.split-r canvas{max-height:calc(100vh - 300px)}
.split-r canvas{width:auto;max-width:100%;margin:0 auto;display:block}
.lg{display:flex;align-items:center;gap:5px;font:500 10px/1 var(--body);color:var(--text3)}
.dot{width:8px;height:8px;border-radius:50%}
.foot{margin-top:12px;font:500 10px/1.6 var(--body);color:var(--text3)}
.spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
/* Both of these open the pitch-evidence dialog, so both are real buttons. The
   resets keep the grid row and the underlined value looking untouched; .row
   already supplies the display, padding and column track. */
.row.drill{cursor:pointer;border-radius:var(--radius);transition:background .12s;
  width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;justify-items:stretch}
/* Same reasoning as .pname-link. The one thing that cannot be reproduced is
   this value's underline: on an inline span, padding-bottom sat below the line
   box for free, so the rule could push the dots 1px clear of the digits. On an
   atomic box that same padding lengthens the row. The row height wins, since it
   compounds down the whole table, and the dots sit 1px higher than they did. */
.val-link{font-weight:700;cursor:pointer;border-bottom:1px dotted var(--text3);
  background:none;border-top:0;border-left:0;border-right:0;padding:0 0 1px;
  font-family:inherit;font-size:inherit;line-height:1;color:inherit;text-align:right;vertical-align:baseline}
.val-link:hover{color:var(--accent);border-bottom-color:var(--accent)}
.row.drill:hover{background:var(--surface2)}
.row.drill:focus-visible,.val-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dico{margin-left:5px;color:var(--text3);font-size:8px;opacity:.65}
.drill-wrap{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);z-index:120;display:none;align-items:center;justify-content:center;padding:24px}
.drill-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:20px 22px;width:min(1080px,96vw);max-height:94vh;overflow:auto;position:relative;box-shadow:none}
.drill-x{position:absolute;top:10px;right:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);width:26px;height:26px;border-radius:var(--radius);cursor:pointer;font:700 15px/1 var(--body)}
.drill-x:hover{color:var(--text)}
.tip{position:fixed;pointer-events:none;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:6px 9px;font:600 11px/1.3 var(--body);box-shadow:none;z-index:50;display:none;color:var(--text)}
.cmp-row{display:grid;grid-template-columns:1fr 130px 1fr;align-items:center;gap:10px;padding:5px 0}
.cmp-lbl{font:600 10px/1.2 var(--body);color:var(--text2);text-align:center;cursor:help}

/* Selects: the open option list is drawn by the browser on a white base, so a
   translucent surface colour plus light text renders as white on white. Force an
   opaque background and colour the options explicitly. */
select{background-color:var(--bg2,var(--panel,var(--panel)));color:var(--text,var(--ink))}
select option,select optgroup{background-color:var(--bg2,var(--panel,var(--panel)));color:var(--text,var(--ink))}

.simhelp{font:400 12px/1.6 var(--f-body,inherit);color:var(--text2);padding:2px 0 12px;max-width:860px}
.simhelp b{color:var(--text);font-weight:700}
.as-of{font:500 9.5px/1.2 var(--f-data,monospace);color:var(--text3);white-space:nowrap}
.as-of.warn{color:var(--gold,var(--gold-text))}

/* Custom player-plot studio. The chart and its controls remain separate so a
   long metric list never competes with the visual for width. */
.studio-intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;margin-bottom:12px}
.studio-intro h2{font:800 24px/1.1 var(--f-display);letter-spacing:-.025em}
.studio-intro p{font:500 12px/1.6 var(--f-body);color:var(--text2);margin-top:5px;max-width:78ch}
.studio-modes{display:flex;gap:4px;background:var(--surface);border-radius:var(--radius);padding:3px}
.studio-grid{display:grid;grid-template-columns:minmax(250px,320px) minmax(480px,1fr);gap:12px;align-items:start}
.studio-controls{min-width:0;max-height:calc(100vh - 220px);overflow-y:auto;overflow-x:hidden}
.studio-help{font:500 11px/1.55 var(--f-body);color:var(--text2);padding:9px 10px;border-left:3px solid var(--accent);background:var(--accent-dim);margin-bottom:12px}
.studio-actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.check-group{display:grid;gap:5px;margin-bottom:12px}
.check-group h3{font:700 9px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin:5px 0 2px}
.plot-check{display:grid;grid-template-columns:18px 1fr auto;gap:7px;align-items:center;padding:6px 7px;border:1px solid transparent;border-radius:var(--radius);color:var(--text2);font:500 11px/1.3 var(--f-body);cursor:pointer}

async function sbAll(tbl,p){
  p=p||{};const PG=1000;let all=[],off=0;
  while(true){

    Object.keys(p).forEach(function(k){u.searchParams.set(k,p[k])});

    if(!r.ok)throw new Error(tbl+' '+r.status);
    const d=await r.json();

    all=all.concat(d);if(d.length<PG)break;off+=PG;
  }
  return all;

       '<b>How this is calculated.</b> Every player is described by eleven role percentages, '+

function nullableMetric(v){return v===null||v===undefined||v===''||!Number.isFinite(Number(v))?null:Number(v)} function metricFixed(v,n){const x=nullableMetric(v);return x===null?'unavailable':x.toFixed(n)} function tier(p){
  if(nullableMetric(p)===null)return{c:'var(--text3)'};
  if(p>=80)return{c:'var(--elite)'};if(p>=60)return{c:'var(--above)'};
  if(p>=40)return{c:'var(--avg)'};if(p>=20)return{c:'var(--below)'};
  return{c:'var(--poor)'};
}
function metricRateSuffix(d){return /_90$/.test(d.key||'')?' per 90':'';}
function fmt(v,unit){
  if(nullableMetric(v)===null)return'\u2014';
  return (+v).toLocaleString(undefined,{maximumFractionDigits:2})+(unit==='%'?'%':(unit==='m'?' m':(unit==='s'?' s':'')));
}
function ordinal(n){
  n=Math.round(+n||0);const m=n%100;if(m>=11&&m<=13)return n+'th';
  return n+(n%10===1?'st':(n%10===2?'nd':(n%10===3?'rd':'th')));
}
function formatEuro(v){
  if(!Number.isFinite(v))return 'Not available';
  if(v>=1000000000)return '€'+(v/1000000000).toFixed(v>=10000000000?0:2).replace(/\.00$/,'')+'bn';
  if(v>=1000000)return '€'+(v/1000000).toFixed(v>=100000000?0:1).replace(/\.0$/,'')+'m';
  if(v>=1000)return '€'+Math.round(v/1000)+'k';
  return '€'+Math.round(v).toLocaleString();
}
function defOf(k){for(var i=0;i<DEFS.length;i++)if(DEFS[i].key===k)return DEFS[i];return null}
function playerOf(id){for(var i=0;i<PLAYERS.length;i++)if(PLAYERS[i].player_id===id)return PLAYERS[i];return null}
function poolLabel(pool){return POOL_NAME[pool]||pool||'Role not yet classified'}
// A player with lineup rows but no on-pitch minutes was named and never used.
// Say so, rather than printing a bare zero or falling back to the lineup count.
function isUnusedSub(p){return (+p.minutes||0)===0&&(+p.apps||0)>0}
function minsLabel(p){return Math.round(+p.minutes||0)+' mins ('+(+p.nineties||0).toFixed(1)+' \u00D7 90)'}
function startsLabel(p){const s=+p.starts||0;return s+' start'+(s===1?'':'s')}

async function init(){
  try{
    const res=await Promise.all([
      sbAll('mv_player_season',{select:'player_id,player_name,team,nineties,apps,starts,minutes'}),
      sbAll('mv_player_role',{select:'player_id,modal_position,listed_pool,pool,reassigned,confidence'}),
      sbAll('metric_defs',{select:'key,label,grp,unit,higher_is_better,definition,sort_order,grp_order',order:'grp_order.asc,sort_order.asc'}),
      sbAll('role_pillar_weights',{select:'pool,pillar,weight'}),
      // appended, not inserted: the four above are read positionally as res[0..3]
      sbAll('v_team_directory',{select:'team,league,league_name'}),
      // League availability is derived from the already-loaded player rows.
      // v_league_summary scans the event corpus and can exceed the browser API timeout.
      Promise.resolve([]),
      // Valuations enrich the page, but a provider/view outage must not take
      // the core player analysis down with it.
      sbAll('v_player_market_values_latest',{select:'player_id,market_value_eur,market_value_display,observed_on,confidence'}).catch(function(){return []})
    ]);
    const season=res[0],role=res[1];DEFS=res[2];
    WEIGHTS={};res[3].forEach(function(r){if(!WEIGHTS[r.pool])WEIGHTS[r.pool]={};WEIGHTS[r.pool][r.pillar]=+r.weight});
    const rmap={};role.forEach(function(r){rmap[r.player_id]=r});
    // The directory is an appearance list, not a percentile list. Substitute-only
    // players may not yet have a role row, but must still remain selectable.
    // minutes, nineties and starts are correct at source now: mv_player_minutes
    // derives participation from the listed position rather than the untrustworthy
    // lineups.is_starter, and scales each spell to 90 by match length. Read them
    // back rather than re-deriving here, so the page cannot drift from the views
    // its percentiles come from.
    PLAYERS=season.map(function(s){return Object.assign({},s,rmap[s.player_id]||{})})
      .filter(function(p){return +(p.apps||0)>0||+(p.minutes||0)>0});
    PLAYERS.sort(function(a,b){return b.nineties-a.nineties});
    (res[4]||[]).forEach(function(d){PLG[d.team]=d.league});
    const presentLeagues={};PLAYERS.forEach(function(p){const league=PLG[p.team];if(league)presentLeagues[league]=true});
    PLEAGUES=Object.keys(presentLeagues).sort().map(function(league){return{league:league,display_name:LEAGUE_DISPLAY[league]||league}});
    (res[6]||[]).forEach(function(v){MARKET_VALUES[v.player_id]=v});
    if(PLGSCOPE!=='ALL'&&!PLEAGUES.some(function(l){return l.league===PLGSCOPE}))PLGSCOPE='ALL';
    const qp=new URLSearchParams(location.search).get('player');
    if(qp&&playerOf(qp)&&PLGSCOPE!=='ALL'&&!teamInLeague(playerOf(qp).team)){
      const targetLeague=lgOfTeam(playerOf(qp).team);
      PLGSCOPE=PLEAGUES.some(function(l){return l.league===targetLeague})?targetLeague:'ALL';
    }
    renderLeaguePick();
    fillTeamSel();
    updateHdrSub();
    renderTabs();renderList();
    if(qp&&playerOf(qp)){
      const tp=playerOf(qp);
      document.getElementById('teamSel').value=tp.team;
      renderList();pick(qp);
    } else setTab('Player');
    restorePlayerState();
  }catch(e){document.getElementById('main').innerHTML='<div class="empty">Failed to load: '+esc(e.message)+'</div>'}
}

function scatterSvg(pts){
  if(!pts.length)return'<div class="empty">No data for that combination</div>';
  const W=1100,H=470,MT=18,MR=26,MB=46,ML=62;
  const xs=pts.map(function(p){return p.x}),ys=pts.map(function(p){return p.y});
  const x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  const y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  const padX=(x1-x0)*0.09||1,padY=(y1-y0)*0.09||1;
  /* Do not invent negative space for metrics whose observed population is
     entirely non-negative. Signed metrics keep their natural padded domain. */
  const xmin=x0>=0?Math.max(0,x0-padX):x0-padX,xmax=x1+padX;
  const ymin=y0>=0?Math.max(0,y0-padY):y0-padY,ymax=y1+padY;
  function SX(v){return ML+((v-xmin)/(xmax-xmin))*(W-ML-MR)}
  function SY(v){return H-MB-((v-ymin)/(ymax-ymin))*(H-MT-MB)}
  function med(a){const s=a.slice().sort(function(p,q){return p-q});return s[Math.floor(s.length/2)]}
  const mx=med(xs),my=med(ys);
  const dx=defOf(SC.x)||{},dy=defOf(SC.y)||{};
  const xdir=dx.higher_is_better===false?' (lower is better)':'';
  const ydir=dy.higher_is_better===false?' (lower is better)':'';
  const chartTitle=(dy.label||SC.y)+' vs '+(dx.label||SC.x);
  const chartSub=POOL_NAME[SC.pool]+' · '+scopeLabel()+' · '+pts.length+' players · X: '+metricUnit(SC.x)+'; Y: '+metricUnit(SC.y)+' · dashed guides are population medians';
  let s='<div class="sect"><div class="viz-eyebrow">Relationship</div>'+
        '<div class="viz-title" data-chart-title="scatter">'+esc(chartTitle)+'</div>'+
        '<div class="viz-sub">'+esc(chartSub)+'</div>'+
        '<svg role="img" aria-label="'+esc(POOL_NAME[SC.pool]+' scatter plot for '+scopeLabel()+': '+(dx.label||SC.x)+' versus '+(dy.label||SC.y))+'." viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" '+
        'style="width:100%;height:auto;max-height:calc(100vh - 250px);display:block">';
  s+='<line x1="'+SX(mx)+'" y1="'+MT+'" x2="'+SX(mx)+'" y2="'+(H-MB)+'" stroke="var(--border2)" stroke-dasharray="4 4"/>';
  s+='<line x1="'+ML+'" y1="'+SY(my)+'" x2="'+(W-MR)+'" y2="'+SY(my)+'" stroke="var(--border2)" stroke-dasharray="4 4"/>';
  if(SC.x==='prog_carries_90'&&SC.y==='key_pass_90'){
    const q=function(x,y,t,a){s+='<text x="'+x+'" y="'+y+'" text-anchor="'+a+'" fill="var(--text3)" font-size="9" font-weight="700" opacity=".72">'+t+'</text>'};
    q(ML+8,MT+14,'PASSING CREATOR','start'); q(W-MR-8,MT+14,'DUAL-THREAT CREATOR','end');
    q(ML+8,H-MB-10,'LOW-VOLUME PROFILE','start'); q(W-MR-8,H-MB-10,'BALL-PROGRESSING CARRIER','end');
  }
  s+='<line x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'" stroke="var(--border)"/>';
  s+='<line x1="'+ML+'" y1="'+MT+'" x2="'+ML+'" y2="'+(H-MB)+'" stroke="var(--border)"/>';
  [0,0.25,0.5,0.75,1].forEach(function(f){
    const vx=xmin+f*(xmax-xmin),vy=ymin+f*(ymax-ymin);
    s+='<text x="'+SX(vx)+'" y="'+(H-MB+17)+'" fill="var(--text3)" font-size="10" text-anchor="middle" font-family="Inter">'+(+vx).toFixed(1)+'</text>';
    s+='<text x="'+(ML-8)+'" y="'+(SY(vy)+3)+'" fill="var(--text3)" font-size="10" text-anchor="end" font-family="Inter">'+(+vy).toFixed(1)+'</text>';
  });
  pts.filter(function(p){return !p.hi}).forEach(function(p){
    s+='<circle class="pt" cx="'+SX(p.x)+'" cy="'+SY(p.y)+'" r="5" fill="'+tier(p.px===null||p.py===null?null:(p.px+p.py)/2).c+'" fill-opacity="0.65" '+
       'data-n="'+esc(p.name)+' \u00B7 '+esc(tname(p.team))+'" data-v="'+esc(dx.label||'')+' '+p.x+' \u00B7 '+esc(dy.label||'')+' '+p.y+'"></circle>';
  });
  pts.filter(function(p){return p.hi}).forEach(function(p){
    const cx=SX(p.x),cy=SY(p.y);
    const right=cx < W-190;
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="10" fill="var(--accent)" fill-opacity="0.22"></circle>';
    s+='<circle class="pt" cx="'+cx+'" cy="'+cy+'" r="6.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="1.6" '+
       'data-n="'+esc(p.name)+' \u00B7 '+esc(tname(p.team))+'" data-v="'+esc(dx.label||'')+' '+p.x+' \u00B7 '+esc(dy.label||'')+' '+p.y+'"></circle>';
    s+='<text x="'+(right?cx+13:cx-13)+'" y="'+(cy+4)+'" fill="var(--accent)" font-size="12" font-weight="700" '+
       'text-anchor="'+(right?'start':'end')+'" font-family="Inter">'+esc(p.name)+'</text>';
  });
  s+='<text x="'+(W/2)+'" y="'+(H-6)+'" fill="var(--text2)" font-size="11" font-weight="600" text-anchor="middle" font-family="Inter">'+esc((dx.label||'')+xdir)+'</text>';
  s+='<text transform="translate(13,'+(H/2)+') rotate(-90)" fill="var(--text2)" font-size="11" font-weight="600" text-anchor="middle" font-family="Inter">'+esc((dy.label||'')+ydir)+'</text>';
  s+='</svg>'+legendHtml()+'<div class="foot" style="margin-top:4px">'+pts.length+' players \u00B7 '+POOL_NAME[SC.pool]+
     ' \u00B7 '+esc(scopeLabel())+' \u00B7 minimum '+MIN90+' nineties \u00B7 axes use their labelled metric units, not percentiles \u00B7 dashed lines are medians of the players shown \u00B7 dot colour averages each player\u2019s two league-and-role percentiles'+
     (SC.x==='prog_carries_90'&&SC.y==='key_pass_90'?' \u00B7 quadrant names describe wide-player involvement, not overall quality':'')+'</div></div>';
  return s;
}

function addMetric(k){if(!k||SK.metrics.length>=10)return;for(var i=0;i<SK.metrics.length;i++)if(SK.metrics[i].k===k)return;SK.metrics.push({k:k,w:3});renderScout()}
function delMetric(i){SK.metrics.splice(i,1);renderScout()}
function setW(i,v){SK.metrics[i].w=+v;renderScout()}
function sortScout(col){
  if(SK.sort.col===col)SK.sort.dir=-SK.sort.dir; else {SK.sort.col=col;SK.sort.dir=-1}
  drawScout();
}
function scoutFit(v){
  let acc=0,used=0,required=0,found=0;
  SK.metrics.forEach(function(m){
    if(m.w<=0)return;required++;
    if(v[m.k]&&v[m.k].pct!=null){acc+=(+v[m.k].pct)*m.w;used+=m.w;found++}
  });
  return required&&found===required&&used?acc/used:null;
}
async function renderScout(){
  const request=++viewGeneration;

  main.innerHTML=scoutCtrls()+'<div class="spin"></div>';
  if(!SK.metrics.length){main.innerHTML=scoutCtrls()+'<div class="empty">Add at least one metric</div>';return}
  try{
    const keys=SK.metrics.map(function(m){return m.k}).join(',');
    const rows=await sbAll('mv_player_percentiles',scopeQuery(
      {pool:'eq.'+SK.pool,metric:'in.('+keys+')',select:'player_id,metric,value,pct,league'}));
    const by={};rows.forEach(function(r){if(!by[r.player_id])by[r.player_id]={};by[r.player_id][r.metric]=r});
    if(request!==viewGeneration||TAB!=='Scout')return;
    SK.rows=[];
    Object.keys(by).forEach(function(pid){
      const v=by[pid],fit=scoutFit(v);if(fit==null)return;
      const p=playerOf(pid)||{};if(!p.player_name||!teamInLeague(p.team))return;
      SK.rows.push({id:pid,name:p.player_name,team:p.team,n90:+p.nineties,fit:fit,v:v});
    });

  }catch(e){if(request===viewGeneration&&TAB==='Scout')main.innerHTML=scoutCtrls()+'<div class="empty">Error: '+esc(e.message)+'</div>'}
}
function drawScout(){

    let av,bv;

    else if(SK.sort.col==='team'){av=(a.team||'').toLowerCase();bv=(b.team||'').toLowerCase()}

    if(av<bv)return -SK.sort.dir; if(av>bv)return SK.sort.dir; return 0;
  }).slice(0,50);

  let h='<div class="sect scout-results"><div class="scout-result-head"><div><h2>Who fits this profile?</h2><p>Ranked by your weighted, role-relative metric selections—not overall player quality. Check playing time before trusting a high fit.</p></div><div class="scout-result-count">Top '+rows.length+' of '+SK.rows.length+' qualifying players</div></div><div style="max-height:calc(100vh - 360px);overflow:auto"><table><thead><tr>'+

    '<th'+cls('team')+' onclick="sortScout(\'team\')">Team'+ar('team')+'</th>'+
    '<th class="num"'+(SK.sort.col==='n90'?' style="color:var(--accent)"':'')+' onclick="sortScout(\'n90\')">90s'+ar('n90')+'</th>'+
    '<th class="num"'+(SK.sort.col==='fit'?' style="color:var(--accent)"':'')+' onclick="sortScout(\'fit\')">Fit'+ar('fit')+'</th>'+
    SK.metrics.map(function(m){const d=defOf(m.k)||{};
      const u=d.unit==='%'?' (%)':(d.unit==='m'?' (m)':(d.unit==='s'?' (s)':''));
      return '<th class="num"'+(SK.sort.col===m.k?' style="color:var(--accent)"':'')+
             ' onclick="sortScout(\''+m.k+'\')" title="'+esc(d.definition||'')+'">'+
             esc(d.label||m.k)+u+ar(m.k)+'</th>'}).join('')+
    '</tr></thead><tbody>';
  rows.forEach(function(r,i){
    h+='<tr><td class="num scout-rank">'+(i+1)+'</td>'+
       '<td><button type="button" class="pname-link" aria-label="Show '+esc(r.name)+' profile" onclick="pick(\''+r.id+'\')">'+esc(r.name)+'</button></td>'+

function scoutChart(rows){

  let s='<div class="sect scout-chart" style="margin-top:12px"><div class="sect-h"><span>Fit \u2014 top '+rows.length+'</span></div>'+
        '<svg role="img" aria-label="Top '+rows.length+' '+esc(POOL_NAME[SK.pool])+' scout fits for '+esc(scopeLabel())+'." viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block">';
  [0,25,50,75,100].forEach(function(v){
    const x=ML+(v/100)*(W-ML-30);
    s+='<line x1="'+x+'" y1="'+(MT-8)+'" x2="'+x+'" y2="'+(MT+rows.length*BH)+'" stroke="var(--border)" stroke-dasharray="3 3"/>';
    s+='<text x="'+x+'" y="'+(MT-14)+'" fill="var(--text3)" font-size="9" text-anchor="middle" font-family="Inter">'+v+'</text>';
  });

    s+='<rect x="'+ML+'" y="'+(y+4)+'" width="'+w+'" height="12" rx="3" fill="'+tier(r.fit).c+'" fill-opacity="0.85"></rect>';
    s+='<text x="'+(ML+w+7)+'" y="'+(y+14)+'" fill="'+tier(r.fit).c+'" font-size="10" font-weight="700" font-family="Inter">'+Math.round(r.fit)+'</text>';
  });
  s+='</svg><div class="foot">'+esc(scopeLabel())+' \u00B7 minimum '+MIN90+' nineties \u00B7 fit is the weighted average of the selected metrics\u2019 league-and-role percentiles inside '+POOL_NAME[SK.pool]+'.</div></div>';
  return s;
}

function pillarRows(rows,peers){

    const peers=PLAYERS.filter(function(p){return p.pool===state.pool&&+p.nineties>=MIN90&&(state.league==='ALL'||lgOfTeam(p.team)===state.league)});

    for(let i=0;i<peers.length;i+=100){
      const q={pillar:'eq.'+state.name,pool:'eq.'+state.pool,player_id:'in.('+peers.slice(i,i+100).map(function(p){return p.player_id}).join(',')+')',select:'player_id,score,league'};

/* Pitch drawn in metres (105 x 68). WhoScored coords are 0-100 on both axes,
   so x scales by 1.05 and y by 0.68 to keep the aspect ratio honest.
   Attack is always left-to-right. */
function PX(x){return x*1.05}
function PY(y){return (100-y)*0.68}
function PY0(a,b){return Math.min(PY(a),PY(b))}
function PYH(a,b){return Math.abs(PY(a)-PY(b))}
function pitchMarks(){

window.addEventListener('resize',function(){requestAnimationFrame(fitPlayerPitches)});
function markerKey(shape,c){
  shape=shape||'circle';
  const p={circle:'<circle cx="8" cy="8" r="4.5"',square:'<rect x="3.5" y="3.5" width="9" height="9"',
    diamond:'<path d="M8 2L14 8L8 14L2 8Z"',triangle:'<path d="M8 2L14 13L2 13Z"',
    cross:'<path d="M3 3L13 13M13 3L3 13"',ring:'<circle cx="8" cy="8" r="5"'};
  const open=shape==='cross'||shape==='ring';
  return '<svg class="layer-glyph" aria-hidden="true" viewBox="0 0 16 16">'+p[shape]+
    (open?' fill="none" stroke="'+c+'" stroke-width="2"/>':' fill="'+c+'" fill-opacity=".82"/>')+'</svg>';
}
function lg(c,t,n,shape){return '<span>'+markerKey(shape,c)+t+'</span>'}
function movementKey(pattern){return pattern?'<span><b>Arrows</b> show repeated direction</span>':'<span><b>Hollow ring</b> = start · <b>solid dot</b> = destination</span>'}
function eventTip(a){
  if(!a||a.game_id==null)return'';
  const date=a.kickoff?new Date(a.kickoff).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'Fixture';
  const clock=a.minute==null?'time unknown':(+a.minute+'\''+(a.second!=null?' '+String(+a.second).padStart(2,'0')+'s':''));
  const state=a.score_state?String(a.score_state).replace(/^./,function(c){return c.toUpperCase()}):'state unknown';
  return date+' vs '+(a.opponent||'opponent unknown')+' · '+clock+' · '+state+(a.score_margin!=null?' ('+(+a.score_margin>0?'+':'')+a.score_margin+')':'')+' · '+(a.sp_phase?'Set piece':'Open play');
}
function eventSvg(a,markup){const tip=eventTip(a);return tip?'<g><title>'+esc(tip)+'</title>'+markup+'</g>':markup}
/* Origin ring: hollow circle where the ball starts, hairline through the middle,
   solid dot where it arrives. Reads as a journey rather than a vector, and keeps
   both ends legible when lines overlap. */
function line(a,c,w,op,dash,headShape,strong){
  const x1=PX(a.x),y1=PY(a.y),x2=PX(a.end_x),y2=PY(a.end_y);
  const W=Math.max(w||0.34,0.28), o=Math.max(op==null?0.85:op,0.85);
  const shaft='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+
    '" stroke-width="'+(W*0.85).toFixed(3)+'" stroke-opacity="'+(o).toFixed(3)+
    '" stroke-linecap="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
  const ring='<circle cx="'+x1+'" cy="'+y1+'" r="'+(W*1.12).toFixed(3)+'" fill="none" stroke="'+c+
    '" stroke-width="'+(W*0.52).toFixed(3)+'" stroke-opacity="'+(o*0.8).toFixed(3)+'"/>';
  const radius=W*1.5;
  const head=headShape==='diamond'?'<path d="M'+x2+' '+(y2-radius)+'L'+(x2+radius)+' '+y2+'L'+x2+' '+(y2+radius)+'L'+(x2-radius)+' '+y2+'Z" fill="'+c+'" fill-opacity="'+Math.min(1,o*1.15).toFixed(3)+'"/>':
    '<circle cx="'+x2+'" cy="'+y2+'" r="'+(W*1.15).toFixed(3)+'" fill="'+c+
    '" fill-opacity="'+Math.min(1,o*1.15).toFixed(3)+'"/>';
  return eventSvg(a,shaft+ring+head);
}
function dot(a,c,r,op){
  return eventSvg(a,'<circle cx="'+PX(a.x)+'" cy="'+PY(a.y)+'" r="'+((r||0.85)*0.68).toFixed(2)+'" fill="'+c+'" fill-opacity="'+(op==null?0.8:op)+'"/>');
}
function actionMark(a,c,r,op,shape){
  const x=PX(a.x),y=PY(a.y),d=(r||.85)*.72,o=op==null?.8:op;
  if(shape==='square')return eventSvg(a,'<rect x="'+(x-d)+'" y="'+(y-d)+'" width="'+(2*d)+'" height="'+(2*d)+'" fill="'+c+'" fill-opacity="'+o+'"/>');
  if(shape==='diamond')return eventSvg(a,'<path d="M'+x+' '+(y-d*1.3)+'L'+(x+d*1.3)+' '+y+'L'+x+' '+(y+d*1.3)+'L'+(x-d*1.3)+' '+y+'Z" fill="'+c+'" fill-opacity="'+o+'"/>');
  if(shape==='triangle')return eventSvg(a,'<path d="M'+x+' '+(y-d*1.4)+'L'+(x+d*1.3)+' '+(y+d)+'L'+(x-d*1.3)+' '+(y+d)+'Z" fill="'+c+'" fill-opacity="'+o+'"/>');
  if(shape==='cross')return eventSvg(a,'<path d="M'+(x-d)+' '+(y-d)+'L'+(x+d)+' '+(y+d)+'M'+(x+d)+' '+(y-d)+'L'+(x-d)+' '+(y+d)+'" fill="none" stroke="'+c+'" stroke-width=".42" stroke-opacity="'+o+'"/>');
  if(shape==='ring')return eventSvg(a,'<circle cx="'+x+'" cy="'+y+'" r="'+d+'" fill="none" stroke="'+c+'" stroke-width=".34" stroke-opacity="'+o+'"/>');
  return dot(a,c,r,op);
}
/* Distinct glyph per outcome: filled ring for a goal, solid for a save,
   diamond for a block, hollow for off target. */
function shotMark(x,y,r,c,op,oc){
  const cx=PX(x),cy=PY(y);
  if(oc==='goal')
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*1.7)+'" fill="none" stroke="'+c+'" stroke-width="0.2" stroke-opacity="0.55"/>'+
           '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+c+'" fill-opacity="1"/>';
  if(oc==='blocked'){
    const d=r*1.25;
    return '<path d="M'+cx+' '+(cy-d)+'L'+(cx+d)+' '+cy+'L'+cx+' '+(cy+d)+'L'+(cx-d)+' '+cy+
           'Z" fill="'+c+'" fill-opacity="'+op+'"/>';
  }
  if(oc==='off'||oc==='post')
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+c+
           '" stroke-width="0.26" stroke-opacity="'+Math.min(1,op*1.6)+'"/>';
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+c+'" fill-opacity="'+op+'"/>';
}
function shotSizeKey(){
  return '<span class="size-key"><span>Marker area = xG</span><svg role="img" aria-label="Example marker sizes: 0.05, 0.20 and 0.50 expected goals" viewBox="0 0 112 27">'+
    '<circle cx="11" cy="10" r="3.2" fill="var(--accent)" fill-opacity=".65"/><text x="11" y="26" text-anchor="middle" fill="var(--text2)" font-size="8">0.05</text>'+
    '<circle cx="52" cy="10" r="6.3" fill="var(--accent)" fill-opacity=".65"/><text x="52" y="26" text-anchor="middle" fill="var(--text2)" font-size="8">0.20</text>'+
    '<circle cx="98" cy="10" r="10" fill="var(--accent)" fill-opacity=".65"/><text x="98" y="26" text-anchor="middle" fill="var(--text2)" font-size="8">0.50</text></svg></span>';
}
function shotOutcomeLegend(live,off){
  const glyph={
    goal:function(c){return '<svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="'+c+'" stroke-opacity=".55"/><circle cx="8" cy="8" r="3.7" fill="'+c+'"/></svg>'},
    saved:function(c){return '<svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="'+c+'" fill-opacity=".8"/></svg>'},
    blocked:function(c){return '<svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 1.5L14.5 8L8 14.5L1.5 8Z" fill="'+c+'" fill-opacity=".75"/></svg>'},
    post:function(c){return '<svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="'+c+'" stroke-width="2"/></svg>'},
    off:function(c){return '<svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="none" stroke="'+c+'" stroke-width="1.6"/></svg>'}
  };
  return live.filter(function(l){return !off[l.k]}).map(function(l){
    return '<span class="shot-key">'+glyph[l.k](l.color)+'<span>'+esc(l.label)+'</span></span>';
  }).join('');
}
function noData(msg){return '<div class="sect"><div class="empty" style="height:220px">'+esc(msg||'No events to plot')+'</div></div>'}

/* Pattern mode uses a deliberately coarse 6 x 4 grid: enough to reveal lanes
   and repeated routes without implying false coordinate precision. */
function flowPattern(items,color,limit){
  const NX=6,NY=4,orig={},flows={};
  function zone(x,y){const ix=Math.max(0,Math.min(NX-1,Math.floor((+x||0)/100*NX)));
    const iy=Math.max(0,Math.min(NY-1,Math.floor((+y||0)/100*NY)));return ix+','+iy}
  function centre(k){const p=k.split(',').map(Number);return{x:(p[0]+.5)*100/NX,y:(p[1]+.5)*100/NY}}
  items.forEach(function(a){
    const sx=a.start_x!=null?a.start_x:a.x,sy=a.start_y!=null?a.start_y:a.y;
    if(sx==null||sy==null||a.end_x==null||a.end_y==null)return;
    const f=zone(sx,sy),t=zone(a.end_x,a.end_y);orig[f]=(orig[f]||0)+1;
    if(f!==t){const k=f+'>'+t;flows[k]=(flows[k]||0)+1}
  });
  const os=Object.keys(orig).sort(),fs=Object.keys(flows).sort(function(a,b){return flows[b]-flows[a]||a.localeCompare(b)}).slice(0,limit||8);
  const om=Math.max.apply(null,os.map(function(k){return orig[k]}).concat([1]));
  const fm=Math.max.apply(null,fs.map(function(k){return flows[k]}).concat([1]));
  let s='<g class="pattern-layer">';
  os.forEach(function(k){const p=centre(k),q=Math.sqrt(orig[k]/om);s+='<circle cx="'+PX(p.x)+'" cy="'+PY(p.y)+
    '" r="'+(1.1+3.2*q).toFixed(2)+'" fill="'+color+'" fill-opacity="'+(0.07+0.16*q).toFixed(2)+'"/>'});
  fs.forEach(function(k,idx){const a=k.split('>'),p=centre(a[0]),q=centre(a[1]),x1=PX(p.x),y1=PY(p.y),x2=PX(q.x),y2=PY(q.y);
    const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy)||1,ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
    const w=.45+1.7*Math.sqrt(flows[k]/fm),ah=1.5+w*.65,bx=x2-ux*ah,by=y2-uy*ah;
    s+='<line x1="'+x1.toFixed(2)+'" y1="'+y1.toFixed(2)+'" x2="'+x2.toFixed(2)+'" y2="'+y2.toFixed(2)+
      '" stroke="'+color+'" stroke-width="'+w.toFixed(2)+'" stroke-opacity="'+(.34+.5*flows[k]/fm).toFixed(2)+'" stroke-linecap="round"'+
      (color===PAL.fail?' stroke-dasharray="1.2 .8"':'')+'/>'+
      '<path d="M'+x2.toFixed(2)+' '+y2.toFixed(2)+'L'+(bx+nx*ah*.55).toFixed(2)+' '+(by+ny*ah*.55).toFixed(2)+
      'L'+(bx-nx*ah*.55).toFixed(2)+' '+(by-ny*ah*.55).toFixed(2)+'Z" fill="'+color+'" fill-opacity=".86"/>';
    if(idx<3){const mx=(x1+x2)/2+nx*1.8,my=(y1+y2)/2+ny*1.8;
      s+='<text x="'+mx.toFixed(2)+'" y="'+(my+.5).toFixed(2)+'" text-anchor="middle" fill="'+color+'" font-size="1.5" font-weight="800" stroke="var(--bg2)" stroke-width=".65" paint-order="stroke">'+flows[k]+'</text>'}
  });
  return s+'</g>';
}

function okF(a){
  if(VZ.outcome==='ok')return a.ok===true;
  if(VZ.outcome==='fail')return a.ok===false;
  return true;
}
function outcomeTog(){
  return '<div class="vz-tog">'+[['','Both'],['ok','Successful'],['fail','Unsuccessful']].map(function(o){
    return '<button class="vzb'+(VZ.outcome===o[0]?' on':'')+'" aria-pressed="'+(VZ.outcome===o[0])+'" onclick="VZ.outcome=\''+o[0]+'\';pick(SEL)">'+o[1]+'</button>'
  }).join('')+'</div>';
}
/* One definition per layer supplies its colour, its legend entry and its filter
   chip, so the three can no longer drift apart. */
function vizLayers(grp,p){
  const A=PACT||[], C=PCAR||[], R2=PREC||[];
  const G=PAL.ok,R=PAL.fail,AC=PAL.box,B=PAL.prog,Y=PAL.carry,N='var(--text3)';
  const L=function(k,label,color,items,draw,shape){return{k:k,label:label,color:color,items:items,draw:draw,shape:shape||'circle'}};
  const pl=function(c,w,op,dash){return function(a){return line(a,c,w,op,dash)}};
  const cl=function(c,w,op,dash){return function(c2){
    return line({x:c2.start_x,y:c2.start_y,end_x:c2.end_x,end_y:c2.end_y},c,w,op,dash)}};
  const dt=function(c,r,op){return function(a){return dot({x:a.x,y:a.y},c,r,op)}};
  const mt=function(c,r,op,shape){return function(a){return actionMark({
    x:a.x!=null?a.x:a.start_x,y:a.y!=null?a.y:a.start_y},c,r,op,shape)}};

  if(grp==='Passing'){
    const all=A.filter(function(a){return a.type==='Pass'&&a.is_open_play&&a.end_x!=null});
    const showAll=VZ.passMode==='all';
    const base=showAll?all:all.filter(function(a){return a.prog||a.into_box});
    return {title:showAll?'All passing':'Progressive passing',
      sub:showAll?'Every open-play pass. Progressive and box entries stay highlighted.'
                 :'Completed progressive passes and passes into the box, open play only.',
      tog:'<div class="vz-tog">'+
        '<button class="vzb'+(!showAll?' on':'')+'" aria-pressed="'+(!showAll)+'" onclick="VZ.passMode=\'prog\';pick(SEL)">Progressive &amp; into box</button>'+
        '<button class="vzb'+(showAll?' on':'')+'" aria-pressed="'+showAll+'" onclick="VZ.passMode=\'all\';pick(SEL)">All passes</button></div>',
      layers:[
        L('box','Into box',AC,base.filter(function(a){return a.into_box&&a.ok}),pl(AC,0.4,0.92)),
        L('prog','Progressive',B,base.filter(function(a){return a.prog&&a.ok&&!a.into_box}),pl(B,0.3,0.72)),
        L('other','Other completed',G,showAll?base.filter(function(a){return a.ok&&!a.prog&&!a.into_box}):[],pl(G,0.16,0.28)),
        L('fail','Incomplete · dashed',R,base.filter(function(a){return !a.ok}),pl(R,0.24,0.4,'1.2 .8'))
      ]};
  }
  if(grp==='Creation'){
    const ps=A.filter(function(a){return a.type==='Pass'&&a.end_x!=null});
    return {title:'Chance creation',sub:'Passes that created a shot, plus through balls and assists.',
      layers:[
        L('assist','Assists',AC,ps.filter(function(a){return a.assist}),pl(AC,0.5,0.98)),
        L('through','Through balls',B,ps.filter(function(a){return a.through&&!a.assist}),
          function(a){return line(a,B,0.38,0.88,'1.2 0.8')}),
        L('key','Key passes',G,ps.filter(function(a){return a.keypass&&!a.assist&&!a.through}),pl(G,0.32,0.7))
      ]};
  }
  if(grp==='Shooting'){
    const sh=A.filter(function(a){return a.is_shot&&a.is_open_play});
    const by=function(oc){return sh.filter(function(a){return (a.shot_outcome||'off')===oc})};
    const mk=function(c,oc){return function(a){
      const xg=a.xg==null?null:+a.xg, r=xg==null?0.65:Math.max(0.52,0.26+Math.sqrt(Math.max(0,xg))*0.92);
      const tipN=esc(p.player_name)+' \u00B7 '+({goal:'Goal',saved:'Saved',blocked:'Blocked',post:'Post',off:'Off target'}[oc]);
      const dist=Math.sqrt(Math.pow((100-a.x)*1.05,2)+Math.pow((50-a.y)*0.68,2));
      const tipV='xG '+(xg==null?'unavailable':xg.toFixed(3))+' \u00B7 '+dist.toFixed(0)+' m'+(a.head?' \u00B7 header':'')+(a.bigchance?' \u00B7 big chance':'');
      return eventSvg(a,shotMark(a.x,a.y,r,xg==null?'var(--text3)':c,oc==='goal'?1:(oc==='saved'?0.75:(oc==='blocked'?0.6:0.5)),oc))+(xg==null?'<text x="'+PX(a.x)+'" y="'+PY(a.y)+'" font-size="1.4" fill="var(--text)">?</text>':'')+
        '<circle class="hit" cx="'+PX(a.x)+'" cy="'+PY(a.y)+'" r="'+Math.max(r*2.4,1.6)+
        '" fill="transparent" style="cursor:crosshair" data-n="'+tipN+'" data-v="'+tipV+'"/>';}};
    const known=sh.filter(function(a){return a.xg!=null&&Number.isFinite(+a.xg)}),sx=known.reduce(function(t,a){return t+(+a.xg)},0);
    return {title:'Shot map',
      sub:'Open-play shots only; season xG/90 includes penalties. '+sx.toFixed(2)+' known xG ('+known.length+'/'+sh.length+' available) from '+sh.length+
          ' shots. Grey ? markers have unavailable xG. Blocked attempts are separated \u2014 the provider files them as saves but they never reached the keeper.',
      focus:true,
      tog:'<div class="vz-tog"><button class="vzb'+(VZ.shotFocus?' on':'')+'" aria-pressed="'+VZ.shotFocus+'" onclick="VZ.shotFocus=true;refreshViz()">Attacking half</button><button class="vzb'+(!VZ.shotFocus?' on':'')+'" aria-pressed="'+(!VZ.shotFocus)+'" onclick="VZ.shotFocus=false;refreshViz()">Full pitch</button></div>',
      sizeKey:true,
      outcomeKey:true,
      layers:[
        L('goal','Goal',AC,by('goal'),mk(AC,'goal')),
        L('saved','Saved',G,by('saved'),mk(G,'saved')),
        L('blocked','Blocked','#a78bfa',by('blocked'),mk('#a78bfa','blocked')),
        L('post','Post',Y,by('post'),mk(Y,'post')),
        L('off','Off target',R,by('off'),mk(R,'off'))
      ]};
  }
  if(grp==='Carrying'){
    return {title:'Carry map',sub:'Carries inferred from consecutive touches, 3m or longer. Progressive and box-entry carries are shown by default.',
      layers:[
        L('box','Into box',AC,C.filter(function(c2){return c2.into_box}),cl(AC,0.42,0.92)),
        L('prog','Progressive · dashed',Y,C.filter(function(c2){return c2.is_progressive&&!c2.into_box}),cl(Y,0.3,0.75,'1.8 .7')),
        L('other','Other carries · dotted',N,C.filter(function(c2){return !c2.is_progressive&&!c2.into_box}),cl(N,0.18,0.32,'.35 .75'))
      ]};
  }
  if(grp==='Combined'){
    const ps=A.filter(function(a){return a.type==='Pass'&&a.is_open_play&&a.ok&&a.end_x!=null});
    return {title:'Everything he does on the ball',
      sub:'Passes, progressive passes and progressive carries on one pitch, coloured by action type.',
      layers:[
        L('pass','Passes',G,ps.filter(function(a){return !a.prog}),pl(G,0.15,0.24)),
        L('prog','Progressive passes',B,ps.filter(function(a){return a.prog}),pl(B,0.3,0.78)),
        L('carry','Progressive carries · dashed',Y,C.filter(function(c2){return c2.is_progressive}),cl(Y,0.3,0.8,'1.8 .7'))
      ]};
  }
  if(grp==='Tempo'){
    const rc=R2.filter(function(r){return r.ttr!=null&&r.ttr<=20});
    const band=function(lo,hi){return rc.filter(function(r){return r.ttr>=lo&&r.ttr<hi})};
    const mk=function(c){return function(r){
      return '<circle cx="'+PX(r.start_x)+'" cy="'+PY(r.start_y)+'" r="'+(0.42+Math.min(r.ttr,10)*0.08)+
        '" fill="'+c+'" fill-opacity="'+(r.ttr<2?0.85:0.55)+'"/>'}};
    return {title:'Where he releases quickly',
      sub:'Every receipt, placed where the ball arrived, coloured by how long he held it.',
      layers:[
        L('u1','Under 1s','#34d399',band(0,1),mt('#34d399',.8,.85,'circle'),'circle'),
        L('u2','1-2s',G,band(1,2),mt(G,.85,.75,'square'),'square'),
        L('u5','2-5s',Y,band(2,5),mt(Y,.9,.68,'diamond'),'diamond'),
        L('o5','5s+',R,band(5,999),mt(R,.95,.75,'ring'),'ring')
      ]};
  }
  if(grp==='Defending'||grp==='Discipline'){
    if(grp==='Discipline'){
      const f=A.filter(function(a){return a.type==='Foul'});
      return {title:'Fouls',sub:'Fouls won and conceded.',
        layers:[L('won','Fouls won',G,f.filter(function(a){return a.ok}),mt(G,.85,.8,'circle'),'circle'),
                L('com','Fouls conceded',R,f.filter(function(a){return !a.ok}),mt(R,.9,.7,'cross'),'cross')]};
    }
    const C2={Tackle:R,Interception:B,BallRecovery:G,Clearance:'#a78bfa',
              BlockedPass:Y,Challenge:'#f472b6',Save:'#22d3ee'};
    const LB={Tackle:'Tackles',Interception:'Interceptions',BallRecovery:'Recoveries',
              Clearance:'Clearances',BlockedPass:'Blocked passes',Challenge:'Challenges lost',Save:'Shot blocks'};
    const SH={Tackle:'triangle',Interception:'diamond',BallRecovery:'circle',Clearance:'square',BlockedPass:'ring',Challenge:'cross',Save:'ring'};
    return {title:'Defensive actions',
      sub:'Defensive actions by type. Recoveries, tackles and interceptions indicate ball-winning; clearances, blocks and failed challenges are interventions, not all wins.',
      layers:Object.keys(C2).map(function(t){
        return L(t,LB[t],C2[t],A.filter(function(a){return a.type===t}),mt(C2[t],.9,.8,SH[t]),SH[t])})};
  }
  if(grp==='Aerial'){
    const ae=A.filter(function(a){return a.type==='Aerial'});
    const w=ae.filter(function(a){return a.ok}).length;
    return {title:'Aerial duels',sub:'Where he contests in the air. Win rate '+(ae.length?Math.round(100*w/ae.length):0)+'%.',
      layers:[L('won','Won',G,ae.filter(function(a){return a.ok}),mt(G,1,.85,'triangle'),'triangle'),
              L('lost','Lost',R,ae.filter(function(a){return !a.ok}),mt(R,1,.65,'cross'),'cross')]};
  }
  if(grp==='Goalkeeping'){
    const C2={Save:G,Claim:B,KeeperSweeper:AC,Punch:Y,KeeperPickup:N};
    const LB={Save:'Saves',Claim:'Claims',KeeperSweeper:'Sweeps',Punch:'Punches',KeeperPickup:'Pickups'};
    const SH={Save:'circle',Claim:'square',KeeperSweeper:'triangle',Punch:'diamond',KeeperPickup:'ring'};
    return {title:'Goalkeeper actions',sub:'Saves, claims and sweeping actions. Sweeps further right mean a higher line.',
      layers:Object.keys(C2).map(function(t){
        return L(t,LB[t],C2[t],A.filter(function(a){return a.type===t}),mt(C2[t],t==='KeeperSweeper'?1.2:.9,.8,SH[t]),SH[t])})};
  }
  if(grp==='Half-Spaces'){

        L('pass','Released a pass',B,hl.filter(function(c2){return !isShot(c2)&&!c2.is_progressive&&c2.release_type==='Pass'}),cl(B,0.3,0.68)),
        L('lost','Lost it · dotted',R,hl.filter(function(c2){return !isShot(c2)&&!c2.is_progressive&&c2.release_type!=='Pass'}),cl(R,0.3,0.65,'.35 .75'))

}

function vizPanel(grp,p){
  if(!PACT)return noData('Loading actions\u2026');
  const cfg=vizLayers(grp,p);
  if(!cfg)return noData('No pitch view for this group yet');
  if(!VZ.off[grp])VZ.off[grp]=(grp==='Passing'?{fail:true}:(grp==='Carrying'?{other:true}:(grp==='Defending'?{Clearance:true,BlockedPass:true,Challenge:true,Save:true}:{})));
  const off=VZ.off[grp];
  const live=cfg.layers.filter(function(l){return l.items.length});
  if(!live.length)return noData();

  const supportsPattern=(grp==='Passing'||grp==='Carrying'||grp==='Combined');
  if(supportsPattern&&!VZ.mode[grp])VZ.mode[grp]='pattern';
  const isPattern=supportsPattern&&VZ.mode[grp]!=='events';
  let inner=cfg.base||'';
  live.forEach(function(l){
    if(off[l.k])return;
    if(isPattern)inner+=flowPattern(l.items,l.color,grp==='Passing'?7:(grp==='Combined'?5:6));
    else l.items.forEach(function(it){inner+=l.draw(it)});
  });

  const chips='<div class="vz-filters"><span class="vz-flabel">Show</span>'+
    live.map(function(l){
      return '<button class="lchip'+(off[l.k]?' off':'')+'" aria-pressed="'+(!off[l.k])+'" onclick="tglLayer(\''+grp+'\',\''+l.k+'\')">'+
        markerKey(l.shape,l.color)+esc(l.label)+' <b>'+l.items.length+'</b></button>';
    }).join('')+
    (live.length>1?'<button class="lchip solo" onclick="allLayers(\''+grp+'\')">reset</button>':'')+
    '</div>';

  const legend=(cfg.outcomeKey?shotOutcomeLegend(live,off):live.filter(function(l){return !off[l.k]})
    .map(function(l){return lg(l.color,l.label,l.items.length,l.shape)}).join(''))+
    (cfg.sizeKey?shotSizeKey():'')+
    (live.some(function(l){return !off[l.k]&&l.items.some(function(a){return a.end_x!=null})})?movementKey(isPattern):'')+
    (isPattern?'<span>Nodes = origin volume \u00B7 arrows = strongest repeated zone flows \u00B7 top three labelled</span>':'');

  const mode=supportsPattern?'<div class="vz-tog">'+
    '<button class="vzb'+(isPattern?' on':'')+'" aria-pressed="'+isPattern+'" onclick="VZ.mode[\''+grp+'\']=\'pattern\';refreshViz()">Pattern</button>'+
    '<button class="vzb'+(!isPattern?' on':'')+'" aria-pressed="'+(!isPattern)+'" onclick="VZ.mode[\''+grp+'\']=\'events\';refreshViz()">Events</button></div>':'';
  return pitchWrap(cfg.title,cfg.sub+(isPattern?' Aggregated into a 6 by 4 zone grid.':''),inner,legend,mode+(cfg.tog||'')+chips,
    cfg.focus&&VZ.shotFocus?'49 -3 59 74':'-3 -3 111.5 74');
}
function tglLayer(grp,k){
  if(!VZ.off[grp])VZ.off[grp]={};
  VZ.off[grp][k]=!VZ.off[grp][k];
  refreshViz();
}
function allLayers(grp){VZ.off[grp]=(grp==='Passing'?{fail:true}:(grp==='Carrying'?{other:true}:{}));refreshViz()}

/* Value is the measurement, percentile is the ranking. Showing only the second
   tells you where a player sits but not what he actually does. */
function cell(c,key){
  if(!c)return '<td class="num" style="color:var(--text3)">\u2014</td>';
  const d=defOf(key)||{}, t=tier(+c.pct);
  if(SK.show==='pct')return '<td class="num" style="color:'+t.c+';font-weight:700">'+c.pct+'</td>';
  if(SK.show==='val')return '<td class="num" style="color:'+t.c+';font-weight:600">'+fmt(c.value,d.unit)+'</td>';
  return '<td class="num"><div class="c-val">'+fmt(c.value,d.unit)+'</div>'+
         '<div class="c-pct" style="color:'+t.c+'">'+c.pct+'</div></td>';
}

/* ---------- DRILL-DOWN ---------- */
const XTG=[[0,0,0,0,0,0,0,0],[.001,.001,.001,.002,.002,.001,.001,.001],
[.002,.003,.004,.005,.005,.004,.003,.002],[.004,.006,.008,.011,.011,.008,.006,.004],
[.006,.009,.014,.019,.019,.014,.009,.006],[.010,.015,.022,.030,.030,.022,.015,.010],
[.016,.024,.035,.048,.048,.035,.024,.016],[.025,.037,.054,.075,.075,.054,.037,.025],
[.038,.056,.082,.115,.115,.082,.056,.038],[.055,.082,.122,.170,.170,.122,.082,.055],
[.082,.120,.178,.250,.250,.178,.120,.082],[.120,.180,.270,.390,.390,.270,.180,.120]];
function xtOf(x,y){
  const gx=Math.min(11,Math.max(0,Math.floor(x/100*12))), gy=Math.min(7,Math.max(0,Math.floor(y/100*8)));
  return (XTG[gx]&&XTG[gx][gy])||0;
}
let DRILL_RETURN=null,DRILL_KEY=null,DRILL_CONTEXT=null,DRILL_REQUEST=0;
/* Every control that opens the pitch dialog carries the same three attributes,
   so a screen reader is told it opens a dialog, which dialog, and whether that
   dialog is open right now. drill() flips aria-expanded on whichever control
   was used and closeDrill() flips it back. */
const DRILL_ATTRS=' aria-haspopup="dialog" aria-controls="drillWrap" aria-expanded="false"';
function closeDrill(){
  document.getElementById('drillWrap').style.display='none';
  modalInert.forEach(function(value,el){el.inert=value});modalInert.clear();
  DRILL_REQUEST++;
  if(DRILL_RETURN&&document.contains(DRILL_RETURN)){
    if(DRILL_RETURN.hasAttribute('aria-expanded'))DRILL_RETURN.setAttribute('aria-expanded','false');
    DRILL_RETURN.focus();
  }
  DRILL_RETURN=null;DRILL_KEY=null;DRILL_CONTEXT=null;
}
/* Clicking the backdrop, but not the card sitting on it, closes the dialog.
   The backdrop is not a control, so this stays a listener rather than becoming
   a button; keyboard users close with Escape or the close button. */
document.getElementById('drillWrap').addEventListener('click',function(e){
  if(e.target===this)closeDrill();
});
const modalInert=new Map();
new MutationObserver(function(){const wrap=document.getElementById('drillWrap'),open=wrap.style.display==='flex';if(open){Array.from(document.body.children).forEach(function(el){if(el!==wrap&&!['SCRIPT','STYLE'].includes(el.tagName)){if(!modalInert.has(el))modalInert.set(el,el.inert);el.inert=true}})}else{modalInert.forEach(function(value,el){el.inert=value});modalInert.clear()}}).observe(document.getElementById('drillWrap'),{attributes:true,attributeFilter:['style']});
document.addEventListener('keydown',function(e){
  const wrap=document.getElementById('drillWrap');
  if(e.key==='Tab'&&wrap&&wrap.style.display==='flex'){
    const items=Array.from(wrap.querySelectorAll('button,input,select,textarea,a[href],[tabindex="0"]')).filter(function(el){return !el.disabled&&el.getClientRects().length});
    const first=items[0],last=items[items.length-1];
    if(e.shiftKey&&(document.activeElement===first||!wrap.contains(document.activeElement))){e.preventDefault();if(last)last.focus()}
    else if(!e.shiftKey&&(document.activeElement===last||!wrap.contains(document.activeElement))){e.preventDefault();if(first)first.focus()}
  }
  if(e.key==='Escape'&&wrap&&wrap.style.display==='flex'){e.preventDefault();closeDrill()}
});

/* Plot the actions behind a value for ANY player, without changing the current selection. */
async function drillFor(pid,key){
  if(!DRILL[key]){alert('No pitch view for that metric yet.');return}
  if(pid===SEL&&PACT&&EVIDENCE_PID===pid){drill(key);return}
  const request=++DRILL_REQUEST,trigger=document.activeElement;
  try{
    const res=await Promise.all([
      loadEvidenceLayers(pid),
      sbAll('mv_player_percentiles',{player_id:'eq.'+pid,select:'metric,value,pct'})
    ]);
    if(request!==DRILL_REQUEST)return;
    const pm={};res[1].forEach(function(r){pm[r.metric]=r});
    // A fixture belongs to a player, not to the page. Do not carry a prior
    // player's Plot studio fixture into a Rank drilldown for someone else.
    EVF={game:'',score:'',phase:'',min:'',max:''};
    DRILL_RETURN=trigger;
    drill(key,{pid:pid,actions:res[0].actions,carries:res[0].carries,
      receipts:res[0].receipts,pmcache:pm,contextReady:res[0].contextReady});
  }catch(e){if(request===DRILL_REQUEST)alert('Could not load actions: '+e.message)}
}
function drill(key,context){
  if(!context)DRILL_REQUEST++;
  const ctx=context||{pid:SEL,actions:PACT,carries:PCAR,receipts:PREC,
    pmcache:PMCACHE,contextReady:CONTEXT_READY};
  const p=playerOf(ctx.pid); if(!p||!ctx.actions)return;
  DRILL_CONTEXT=ctx;
  DRILL_KEY=key;
  if(!DRILL_RETURN)DRILL_RETURN=document.activeElement;
  if(DRILL_RETURN&&DRILL_RETURN.hasAttribute&&DRILL_RETURN.hasAttribute('aria-expanded'))
    DRILL_RETURN.setAttribute('aria-expanded','true');
  const d=defOf(key)||{}; const kind=DRILL[key];
  const A=filterContext(ctx.actions,ctx.contextReady), C=filterContext(ctx.carries||[],ctx.contextReady);
  const G=PAL.ok,R=PAL.fail,AC=PAL.box,B=PAL.prog,Y=PAL.carry,N='var(--text3)';
  let inner='',leg='',sub='',n=0;
  const pass=function(f,c,w,op){A.filter(f).forEach(function(a){if(a.end_x==null)return;inner+=line(a,c,w,op);n++})};
  const carry=function(f,c,w,op){C.filter(f).forEach(function(c2){
    inner+=line(Object.assign({},c2,{x:c2.start_x,y:c2.start_y}),c,w,op);n++})};

  if(kind==='passes')      pass(function(a){return a.type==='Pass'&&a.is_open_play&&a.ok},G,0.16,0.3);
  else if(kind==='prog')   pass(function(a){return a.prog&&a.ok},B,0.3,0.75);
  else if(kind==='box')    pass(function(a){return a.into_box&&a.ok},AC,0.34,0.9);
  else if(kind==='ft')     pass(function(a){return a.type==='Pass'&&a.ok&&a.end_x>=66.7},G,0.22,0.5);
  else if(kind==='through')pass(function(a){return a.through},B,0.36,0.9);
  else if(kind==='cross')  pass(function(a){return a.cross_},AC,0.3,0.75);
  else if(kind==='key')    pass(function(a){return a.keypass},G,0.32,0.85);
  else if(kind==='assist') pass(function(a){return a.assist},AC,0.5,1);
  else if(kind==='xtpass'||kind==='xtall'||kind==='xtcarry'){
    if(kind!=='xtcarry'){
      A.filter(function(a){return a.type==='Pass'&&a.ok&&a.is_open_play&&a.end_x!=null}).forEach(function(a){
        const g=xtOf(a.end_x,a.end_y)-xtOf(a.x,a.y);
        if(g<=0.004)return;
        inner+=line(a,B,0.16+Math.min(0.5,g*7),0.35+Math.min(0.6,g*9));n++;});
    }
    if(kind!=='xtpass'){
      C.filter(function(c2){return c2.is_progressive}).forEach(function(c2){
        const g=xtOf(c2.end_x,c2.end_y)-xtOf(c2.start_x,c2.start_y);
        if(g<=0.004)return;
        inner+=line(Object.assign({},c2,{x:c2.start_x,y:c2.start_y}),Y,0.16+Math.min(0.5,g*7),0.4);n++;});
    }
    sub='Only actions that added threat are drawn. Thicker and brighter means more threat added.';
    leg=(kind!=='xtcarry'?lg(B,'Passes that added threat'):'')+(kind!=='xtpass'?lg(Y,'Carries that added threat'):'');
  }
  else if(kind==='carries')     carry(function(){return true},N,0.16,0.28);
  else if(kind==='progcarries') carry(function(c2){return c2.is_progressive},Y,0.3,0.8);
  else if(kind==='carrybox')    carry(function(c2){return c2.into_box},AC,0.34,0.9);
  else if(kind==='shots'||kind==='sot'||kind==='goals'||kind==='bigchance'||kind==='hsshot'||kind==='spshot'){
    const f={shots:function(a){return a.is_shot&&a.is_open_play},
             sot:function(a){return a.is_shot&&(a.shot_outcome==='saved'||a.shot_outcome==='goal')},
             goals:function(a){return a.is_shot&&a.is_goal},
             bigchance:function(a){return a.is_shot&&a.bigchance},
             hsshot:function(a){return a.is_shot&&a.x>=50&&((a.y>=21.1&&a.y<=36.8)||(a.y>=63.2&&a.y<=78.9))},
             spshot:function(a){return a.is_shot&&a.sp_phase}}[kind];
    let sx=0,knownCount=0;
    A.filter(f).forEach(function(a){
      const xg=a.xg==null?null:+a.xg;if(xg!=null&&Number.isFinite(xg)){sx+=xg;knownCount++}const r=xg==null?0.65:Math.max(0.52,0.26+Math.sqrt(Math.max(0,xg))*0.92);
      const oc=a.shot_outcome||'off';
      const c=oc==='goal'?AC:(oc==='saved'?G:(oc==='blocked'?'#a78bfa':R));
      inner+=eventSvg(a,shotMark(a.x,a.y,r,xg==null?'var(--text3)':c,oc==='goal'?1:0.55,oc))+(xg==null?'<text x="'+PX(a.x)+'" y="'+PY(a.y)+'" font-size="1.4" fill="var(--text)">?</text>':'');n++;});
    sub='Filtered evidence: '+sx.toFixed(2)+' known xG; '+knownCount+'/'+n+' shots have xG. Missing xG is not zero. Open-play shots exclude penalties; season-reference xG/90 includes them.';

/* Published as-of date. Derived from the last analytics rebuild that actually
   completed, not from when a summary table was last touched.
   mv_site_summary.refreshed_at reports when refresh_site_summaries last ran,
   which is independent of whether the analytics layer rebuilt: on 14 September
   it read 17:41 while every metric matview was from 1 September. A failed gate
   deliberately leaves this stamp where it was, so fresher but unverified data
   sits behind an honest stale date rather than a confident wrong one. */
var ASOF=null;
function renderAsOf(){
  var el=document.getElementById('asOf'); if(!el) return;
  if(!ASOF||!ASOF.as_of){ el.textContent='as of unavailable'; el.className='as-of warn'; return; }
  var d=new Date(ASOF.as_of);
  var txt='data as of '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+
          ' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(ASOF.is_stale) txt+=' \u00B7 '+Math.round(ASOF.hours_old)+'h old';
  el.textContent=txt;
  el.className='as-of'+(ASOF.is_stale?' warn':'');
  if(window.FutScout)FutScout.setFreshness(ASOF);
}
fetch(SB+'/rest/v1/v_analytics_as_of?select=*',{headers:HD})
  .then(function(r){return r.ok?r.json():null})
  .then(function(rows){ ASOF=rows&&rows[0]||null; renderAsOf(); })
  .catch(function(){ renderAsOf(); });
