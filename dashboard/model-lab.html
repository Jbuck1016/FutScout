const D=window.MODEL_LAB_DATA; const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const n=(v,d=3)=>v==null?'—':Number(v).toFixed(d); const pct=v=>v==null?'—':(100*Number(v)).toFixed(1)+'%';
if(!D)document.body.innerHTML='<div class="empty">Model lab data is unavailable.</div>';else boot();
function boot(){
 const m=D.model,s=D.shadow,dr=D.drift; document.getElementById('rail').innerHTML=[['SHADOW','lifecycle','good'],[m.feature_count,'model inputs',''],[m.training_match_count.toLocaleString(),'training matches',''],[s.resolved||0,'live calls scored',s.sample_gate?.ready?'good':'warn'],[dr.current_matches||0,'current matches monitored',dr.sample_ready?'good':'warn']].map(x=>`<div class="stat"><b class="${x[2]}">${x[0]}</b><span>${x[1]}</span></div>`).join('');
 const coverageAt=D.challenger_research?.coverage?.created_at;
 const dateLabel=value=>value?new Date(value).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}):'date unavailable';
 document.getElementById('bundleDates').textContent='Mixed-date research bundle · example forecasts '+dateLabel(D.as_of)+' · original model tournament '+dateLabel(D.model_tournament?.created_at)+' · rich-feature coverage '+dateLabel(coverageAt)+' · input drift '+dateLabel(D.drift?.checked_at)+'. Counts above are snapshots, not a live feed.';
 const views=[['overview','Start here'],['matches','Explain a match'],['validation','Compare models'],['legitimacy','Trust tests'],['research','Challenger desk'],['features','Feature evidence'],['monitoring','Data health'],['guide','Reading guide']],requested=new URLSearchParams(location.search).get('tab'),initial=views.some(v=>v[0]===requested)?requested:'overview';document.getElementById('tabs').innerHTML=views.map(v=>`<button class="tab ${v[0]===initial?'on':''}" data-view="${v[0]}">${v[1]}</button>`).join('');document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id===initial));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(e=>e.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.view).classList.add('on');const u=new URL(location);u.searchParams.set('tab',b.dataset.view);history.replaceState(null,'',u)});
 document.getElementById('theme').onclick=()=>{document.documentElement.classList.toggle('dark');try{localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')}catch(e){}};
 const sizes=['standard','large','xlarge'];let size=localStorage.getItem('labTextSize')||'standard';setSize(size);document.getElementById('textSize').onclick=()=>{size=sizes[(sizes.indexOf(size)+1)%sizes.length];setSize(size)};
 renderOverview();renderValidation();renderLegitimacy();renderFeatureStability();enhanceExternalBenchmark();renderResearch();renderFeatures();renderMatches();renderMonitoring();renderGuide();refreshResearchCopy();polishLabEvidence();
}
function polishLabEvidence(){
 const trustGrid=document.querySelector('#legitimacy .grid');
 const verdict=[...trustGrid.children].find(p=>p.querySelector('h2')?.textContent==='The honest verdict');
 if(verdict)trustGrid.prepend(verdict);
 const instructions={
  overview:['Start with a question','Compare models for historical performance, explain a match for a specific forecast, or check data health before drawing conclusions.'],
  legitimacy:['Read the conclusion, then inspect the tests','These are historical experiments with different purposes. Compare their dates and samples; a passed control is not proof that the model is ready for promotion.'],
  research:['Research candidates—not deployed replacements','Use these panels to decide what deserves another controlled test. Candidate results do not change the live model.'],
  features:['Weights explain the fitted model, not football causality','Start with feature-family evidence. Inspect individual coefficients only when investigating how this particular model behaves.'],
  monitoring:['Check freshness before interpreting a warning','These are saved reports, not a live health feed. Scored forecasts, pending fixtures and current-season event coverage are different populations.']
 };
 for(const [id,[title,copy]] of Object.entries(instructions)){
  const section=document.getElementById(id),intro=document.createElement('aside');
  intro.className='guide-context';intro.innerHTML='<strong>'+esc(title)+'</strong><p>'+esc(copy)+'</p>';section.prepend(intro);
 }
 const external=[...document.querySelectorAll('#legitimacy .panel')].find(p=>p.querySelector('h2')?.textContent==='External and live proof');
 if(external){
  const old=[...external.querySelectorAll('.metric')].find(r=>r.querySelector('span')?.textContent==='Scored in original trust-suite snapshot');
  if(old){const details=document.createElement('details');details.className='snapshot-history';const summary=document.createElement('summary');summary.textContent='Earlier research snapshot (not the current scorecard)';details.append(summary);old.before(details);details.append(old);}
 }
 document.querySelectorAll('#tabs .tab').forEach(button=>{
  button.setAttribute('aria-pressed',String(button.classList.contains('on')));
  button.addEventListener('click',()=>document.querySelectorAll('#tabs .tab').forEach(b=>b.setAttribute('aria-pressed',String(b===button))));
 });
}
function setSize(size){document.documentElement.classList.remove('large','xlarge');if(size!=='standard')document.documentElement.classList.add(size);document.getElementById('textSize').textContent='text: '+size.replace('xlarge','extra large');try{localStorage.setItem('labTextSize',size)}catch(e){}}
function refreshResearchCopy(){
 const R=D.challenger_research||{},V=R.coverage||{},L=R.league_coverage||{},ready=!!V.created_at&&(V.decision?.backfill_before_training||[]).length===0;
 const dateLabel=value=>value?new Date(value).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}):'date unavailable';
 const panelWithTitle=(view,title)=>[...document.querySelectorAll(`#${view} .panel`)].find(e=>e.querySelector('h2')?.textContent===title);
 const tournamentPanel=panelWithTitle('validation','Model tournament');
 if(tournamentPanel){
   tournamentPanel.querySelector('.ph span').textContent='original '+dateLabel(D.model_tournament?.created_at)+' test';
   tournamentPanel.insertAdjacentHTML('beforeend',`<p class="copy"><strong>Scope:</strong> These rankings are preserved from the original ${esc(dateLabel(D.model_tournament?.created_at))} tournament. Newly backfilled xT, chance-quality and sequence families were not in that comparison; eligibility in a later audit does not retroactively change these scores.</p>`);
 }
 const excluded=panelWithTitle('validation','What we cannot test fairly yet');
 if(excluded&&ready){
   excluded.querySelector('h2').textContent='Original tournament exclusions';

function panel(title,stamp,body,cls=''){return `<article class="panel ${cls}"><div class="ph"><h2>${title}</h2><span>${stamp}</span></div>${body}</article>`}
function renderResearch(){const R=D.challenger_research||{},C=R.comparison||{},N=R.nonlinear||{},V=R.coverage||{},L=R.league_coverage||{},T=R.table_uncertainty||{},S=R.scoring_readiness||{},F=R.operations_freshness||{};const comparisons=(C.largest_disagreements||[]).slice(0,10).map(r=>`<div class="match-case"><b>${esc(r.home_team)} — ${esc(r.away_team)}</b><small>${esc(r.league)} · largest probability move ${pct(r.maximum_absolute_probability_delta)} · ${r.different_favourite?'different favourite':'same favourite'}<br>Hybrid H/D/A ${[r.primary.home_win_probability,r.primary.draw_probability,r.primary.away_win_probability].map(pct).join(' / ')} · Tactical ${[r.challenger.home_win_probability,r.challenger.draw_probability,r.challenger.away_win_probability].map(pct).join(' / ')}</small></div>`).join('');const nonlinear=(N.summary||[]).map((r,i)=>`<div class="metric"><span>${i+1}. ${esc(r.name.replaceAll('_',' '))}</span><b>${n(r.mean_log_loss,5)} · ${r.beats_linear_hybrid_both_holdouts?'passes both':'does not pass both'}</b></div>`).join('');const coverage=(V.families||[]).map(r=>`<div class="metric"><span>${esc(r.family.replaceAll('_',' '))}</span><b class="${r.historical_ready&&r.current_ready?'good':'warn'}">${r.historical_ready&&r.current_ready?'trainable now':esc(r.decision.replaceAll('_',' '))}</b></div>`).join('');document.getElementById('research').innerHTML=`<div class="grid">${panel('Hybrid versus tactical','same-fixture comparison',C.fixtures_compared?`<div class="comparison"><div class="model-card"><h3>Hybrid</h3><p class="copy">Shots + field tilt + completed box entries, with Elo and rest.</p></div><div class="versus">VS<br>${C.fixtures_compared} fixtures</div><div class="model-card"><h3>Tactical</h3><p class="copy">Territory + pressing, deliberately excluding shot volume.</p></div></div><div class="metric"><span>Different favourite</span><b>${C.different_favourite_count}</b></div><div class="metric"><span>Mean largest move</span><b>${pct(C.mean_maximum_probability_delta)}</b></div>`:`<div class="callout"><strong>Waiting for the live tactical snapshot.</strong><br>The comparison runner is ready, but it needs the current Supabase feature rows to package and score the challenger.</div>`,'wide')}${panel('Largest live disagreements','inspect, then score later',comparisons||'<div class="empty">No same-fixture challenger comparison has been generated yet.</div>','wide')}${panel('Nonlinear interaction test','two untouched season holdouts',nonlinear||'<div class="empty">Queued until historical rows are reachable.</div>')}${panel('Rich-feature coverage','no silent imputation',`${coverage||'<div class="empty">Coverage summary unavailable.</div>'}<div class="metric"><span>League-season blocks needing repair</span><b class="${L.repair_queue?.length?'warn':'good'}">${L.repair_queue?.length??'pending live read'}</b></div>`)}${panel('Table uncertainty calibration','early-season honesty',T.selected_team_strength_uncertainty_sd!=null?`<div class="metric"><span>Selected research shock</span><b>${n(T.selected_team_strength_uncertainty_sd,2)}</b></div><div class="metric"><span>Decision</span><b class="warn">${esc(T.decision.replaceAll('_',' '))}</b></div>`:'<div class="empty">Calibration runner is ready; historical row access is pending.</div>')}${panel('Frozen scoring contract','immutable Thursday calls',`<div class="metric"><span>Pipeline ready</span><b class="${S.ready?'good':'warn'}">${S.ready?'YES':'NO'}</b></div><div class="metric"><span>Unique eligible calls</span><b>${S.unique_calls_after_earliest_policy??'—'}</b></div><div class="metric"><span>Resolved result read</span><b class="warn">${esc(S.live_resolution_status||'pending')}</b></div><p class="copy">The earliest eligible Thursday forecast is retained for each fixture. Later forecasts cannot replace a harder earlier call.</p>`)}${panel('Operations freshness','fixtures, events, features, drift',`<div class="metric"><span>Evidence bundle complete</span><b class="${F.local_evidence_complete?'good':'warn'}">${F.local_evidence_complete?'YES':'NO'}</b></div><div class="metric"><span>Within 24 hours</span><b class="${F.fresh_within_24_hours?'good':'warn'}">${F.fresh_within_24_hours?'YES':'NO'}</b></div><div class="metric"><span>Live verification</span><b class="warn">${esc(F.live_verification||'pending')}</b></div>`)}</div>`}
function renderGuide(){document.getElementById('guide').innerHTML=`<div class="grid">${panel('A five-minute route through Model Lab','read in this order',`<div class="guide-step"><span>01</span><div><h3>Start with the tournament</h3><p>Ask which philosophy predicts unseen seasons best. Lower log loss is better. Do not crown a model for a tiny difference or one winning season.</p></div></div><div class="guide-step"><span>02</span><div><h3>Check legitimacy</h3><p>Confidence intervals, negative controls, robustness attacks and the bookmaker benchmark tell you whether an apparent win is repeatable or fragile.</p></div></div><div class="guide-step"><span>03</span><div><h3>Open the challenger desk</h3><p>Compare the hybrid and tactical forecasts on identical fixtures. Large disagreements are investigation targets, not evidence that the bolder model is smarter.</p></div></div><div class="guide-step"><span>04</span><div><h3>Explain one match</h3><p>Read probabilities, expected goals, actual rolling inputs and directional drivers in that order. A coefficient is an internal association, not a football law.</p></div></div><div class="guide-step"><span>05</span><div><h3>Finish with data health</h3><p>If coverage is missing or current distributions drift, pause conclusions about model quality until the inputs are understood.</p></div></div>`,'wide')}${panel('What would change our decision?','promotion evidence',`<div class="callout"><strong>The current hybrid stays in shadow.</strong><br>A challenger must improve both chronological holdouts, survive uncertainty testing, and then beat or match it on a meaningful set of frozen live calls.</div><div class="metric"><span>Historical holdouts</span><b>required</b></div><div class="metric"><span>Bookmaker comparison</span><b>required</b></div><div class="metric"><span>Frozen live calls</span><b>100 overall · 20 per league</b></div><div class="metric"><span>Leakage and coverage gates</span><b>must pass</b></div>`)}${panel('Why shots can still matter','without mistaking them for the whole game',`<p class="copy">Shots are close to the scoring event, so they can summarize several upstream actions. Field tilt, pressing, progression and box access describe how chances develop and can add independent signal. The correct question is not which stat sounds smarter; it is which combination improves unseen probabilities consistently.</p><p class="copy">That is why the lab keeps a tactical no-shots challenger beside the hybrid and refuses to hide an inconvenient result.</p>`)}</div>`}
function renderFeatureStability(){const S=D.feature_stability;if(!S)return;const rows=S.families.map(r=>{const a=r.season_results[0],b=r.season_results[1],pass=r.stability_gate==='pass';return `<tr><td><b>${esc(r.family.replaceAll('_',' '))}</b></td><td class="${a.improvement_vs_core>0?'delta-better':'delta-worse'}">${a.improvement_vs_core>0?'+':''}${n(a.improvement_vs_core,4)}</td><td class="${b.improvement_vs_core>0?'delta-better':'delta-worse'}">${b.improvement_vs_core>0?'+':''}${n(b.improvement_vs_core,4)}</td><td><span class="tag ${pass?'stable':'moderate'}">${pass?'PASS':'RESEARCH'}</span></td></tr>`}).join('');const elo=S.elo_dependency.season_results.map(r=>`<div class="metric"><span>${r.season} penalty when Elo is removed</span><b>+${n(r.log_loss_penalty_when_removed,4)} · ${r.helpful_fold_count}/${r.fold_count} folds</b></div>`).join('');const html=panel('Cross-season feature gate','positive lift required in every holdout',`<div class="explain"><strong>What these holdouts suggest about stability.</strong> Territory, shooting and pressing improved this baseline in both tested seasons. Possession and progression did not. That is evidence of inconsistent added value in this experiment—not proof of the cause or that those football concepts cannot help.</div><div style="overflow:auto"><table class="model-table"><thead><tr><th>Family</th><th>24/25 lift</th><th>25/26 lift</th><th>Decision</th></tr></thead><tbody>${rows}</tbody></table></div><p class="copy">Positive lift means lower log loss than the identical Elo-and-schedule baseline. A research label does not reject the football idea; it blocks production use until coverage, interactions or a different architecture make the signal repeatable.</p>`,'wide')+panel('What team strength currently means','audited Elo construction',`<div class="metric"><span>Initial rating</span><b>1500 per team</b></div><div class="metric"><span>Home adjustment</span><b>+55 rating points</b></div><div class="metric"><span>Update speed</span><b>K = 20</b></div><div class="metric"><span>Match update</span><b>result surprise × log goal margin</b></div>${elo}<p class="copy">The rating is captured before kickoff and updated chronologically afterward. It is predictive in both seasons, but it is only a results-based baseline—not a direct tactical-quality score. The next challenger must prove tactical lift with Elo included, removed and residualized.</p>`,'wide');document.querySelector('#legitimacy .grid').insertAdjacentHTML('afterbegin',html)}
function renderOverview(){const m=D.model,t=D.model_tournament,w=t.summary.find(x=>x.name===t.winner);document.getElementById('overview').innerHTML=`<div class="orientation"><article class="question"><span class="step">01 · Start here</span><b>Which model predicts best?</b><p>Open <strong>Model tournament</strong>. It compares shooting, territory, pressing and blended models on later seasons they never trained on.</p></article><article class="question"><span class="step">02 · Then inspect</span><b>Why did a match move?</b><p>Open <strong>Explain a match</strong>. Read the result probabilities first, then the directional evidence—not the raw coefficient list.</p></article><article class="question"><span class="step">03 · Finally verify</span><b>Can we trust the inputs?</b><p>Open <strong>Data health</strong>. Drift is a warning to investigate data distributions; it is not proof a feature is bad.</p></article></div><div class="grid">${panel('What the latest test says','plain-English verdict',`<div class="verdict"><span class="step">Lowest observed average across two holdouts</span><h3>${esc(w.label)}</h3><p class="plain">${esc(w.idea)} That ranking is descriptive: the uncertainty interval in Trust tests includes zero, so no model philosophy is a statistically established winner. Territory-only remains a serious challenger.</p></div><p class="copy"><strong>Important:</strong> this does not prove shots cause wins or deserve permanent dominance. The observed ranking does not establish that shots are reliably superior across future seasons.</p>`,'wide')}${panel('Current live specimen','registered shadow model',`<div class="micro">${esc(m.display_version)}</div><p class="copy">${esc(m.decision_basis)}</p><div class="metric"><span>Algorithm</span><b>${esc(m.algorithm)}</b></div><div class="metric"><span>Training seasons</span><b>${m.training_seasons.join(' · ')}</b></div><div class="metric"><span>Active inputs</span><b>${m.feature_count}</b></div>`)}${panel('Safety boundary','read only',`<div class="guard">${esc(D.guardrails.note)}<br><br>Live scoring gate: <b>${esc(D.shadow.sample_gate?.decision||'collect_more_results')}</b>. This laboratory compares and explains; it cannot promote a model.</div>`)}${panel('Three terms worth knowing','quick glossary',`<div class="glossary"><div class="definition"><b>Log loss</b><p>Grades the full probability forecast. Lower is better; confident wrong calls are punished most.</p></div><div class="definition"><b>Calibration</b><p>Checks whether 60% predictions happen roughly 60% of the time. Lower error is better.</p></div><div class="definition"><b>Coefficient</b><p>An internal model weight—not standalone feature importance or proof of causality.</p></div></div>`,'wide')}</div>`}
function renderLegitimacy(){const L=D.legitimacy,c=L.confidence.shooting_vs_territory_2526,p=L.family_permutation.rows,w=L.rolling_windows,a=L.architectures,t=L.table_backtests.summary;const importanceMax=Math.max(...p.map(x=>Math.abs(x.importance_delta)),.001);const perm=p.map((r,i)=>`<div class="rank-row"><span>${i+1}. ${esc(r.family.replaceAll('_',' '))}</span><div class="track"><span class="fill ${r.importance_delta<0?'control':''}" style="width:${Math.max(1,Math.abs(r.importance_delta)/importanceMax*100)}%"></span></div><b>${r.importance_delta>=0?'+':''}${n(r.importance_delta,4)}</b></div>`).join('');const arch=a.map((r,i)=>`<tr class="${i===0?'winner':''}"><td>${i+1}. ${esc(r.architecture)}</td><td>${n(r.log_loss,4)}</td><td>${n(r.brier,4)}</td><td>${pct(r.accuracy)}</td><td>${n(r.calibration_error,4)}</td></tr>`).join('');const windows=w.map((r,i)=>`<div class="metric"><span>${i+1}. ${esc(r.label)} · ${r.column_count} inputs</span><b>${n(r.log_loss,4)}</b></div>`).join('');const slices=L.stability.map(r=>`<tr><td>${esc(r.slice)}</td><td>${r.matches}</td><td>${n(r.log_loss,4)}</td><td>${pct(r.accuracy)}</td><td>${n(r.calibration_error,4)}</td></tr>`).join('');const tables=t.map(r=>`<div class="metric"><span>${pct(r.checkpoint)} season checkpoint</span><b class="${r.position_80pct_coverage>=.78?'good':'warn'}">${pct(r.position_80pct_coverage)} position coverage · ${n(r.mean_absolute_points_error,1)} pts MAE</b></div>`).join('');const cases=L.investigation.largest_disagreements.slice(0,8).map(r=>`<div class="match-case"><b>${esc(r.home_team)} ${esc(r.score)} ${esc(r.away_team)}</b><small>${esc(r.league)} · ${r.date} · model spread ${pct(r.maximum_philosophy_spread)}<br>Shots H/D/A ${r.shooting_probabilities.map(pct).join(' / ')} · Territory ${r.territory_probabilities.map(pct).join(' / ')}</small></div>`).join('');const errors=L.investigation.high_confidence_errors.slice(0,8).map(r=>`<div class="match-case"><b>${esc(r.home_team)} ${esc(r.score)} ${esc(r.away_team)}</b><small>${esc(r.league)} · predicted ${r.shooting_probabilities.map(pct).join(' / ')} · actual ${esc(r.actual)}</small></div>`).join('');document.getElementById('legitimacy').innerHTML=`<div class="grid">${panel('The honest verdict','evidence, not marketing',`<div class="verdict"><span class="step">Current statistical conclusion</span><h3>No clear winner between shots and territory</h3><p class="plain">The observed territory penalty is ${n(c.observed_delta,5)} log-loss points, but its paired 95% range runs from ${n(c.ci_95[0],5)} to ${n(c.ci_95[1],5)}. Because zero is inside that range, there is no defensible winner yet.</p></div><p class="copy">The all-feature model is different: its 95% interval is entirely worse than shooting-led. More inputs are currently hurting generalization.</p>`,'wide')}${panel('Out-of-sample family reliance','shuffle one family, keep outcomes fixed',`<p class="copy">Positive values mean predictions worsened when that whole family was scrambled. Negative values mean the family may be adding noise. This measures reliance inside the all-feature model, not causality.</p><div class="rank-list">${perm}</div>`,'wide')}${panel('Rolling-window challenge','lower is better',windows)}${panel('Architecture challenge','same shooting inputs',`<div style="overflow:auto"><table class="model-table"><thead><tr><th>Architecture</th><th>Log loss</th><th>Brier</th><th>Accuracy</th><th>Calibration</th></tr></thead><tbody>${arch}</tbody></table></div>`)}${panel('Where performance changes','league, phase and matchup slices',`<div style="overflow:auto"><table class="model-table"><thead><tr><th>Slice</th><th>N</th><th>Log loss</th><th>Accuracy</th><th>Calibration</th></tr></thead><tbody>${slices}</tbody></table></div>`,'wide')}${panel('Pipeline attacks','leakage and failure controls',`<div class="metric"><span>Suspicious post-match fields</span><b class="${L.negative_controls.suspicious_feature_names.length?'bad':'good'}">${L.negative_controls.suspicious_feature_names.length||'none'}</b></div><div class="metric"><span>Shuffled-goal log loss</span><b>${n(L.negative_controls.shuffled_goal_log_loss,4)}</b></div><div class="metric"><span>Shuffled-result log loss</span><b>${n(L.negative_controls.shuffled_result_log_loss,4)}</b></div><div class="metric"><span>Control decision</span><b class="${L.negative_controls.decision==='pass'?'good':'warn'}">${esc(L.negative_controls.decision)}</b></div><p class="copy">Randomized targets collapse toward chance, while no obvious post-match field names enter the model.</p>`)}${panel('Missing-data stress','probability resilience',L.robustness.map(r=>`<div class="metric"><span>${esc(r.family.replaceAll('_',' '))}</span><b>missing ${r.all_missing_delta>=0?'+':''}${n(r.all_missing_delta,4)} · noise ${r.ten_percent_noise_delta>=0?'+':''}${n(r.ten_percent_noise_delta,4)}</b></div>`).join(''))}${panel('Historical table backtests','nominal 80% position set',`${tables}<p class="copy">At the 25% checkpoint, only ${pct(t[0].position_80pct_coverage)} of final positions land in the advertised 80% set. That early-season table model needs wider uncertainty or stronger team-strength estimation.</p>`,'wide')}${panel('Matches where philosophies disagree','best investigation targets',cases)}${panel('Confident mistakes','audit these first',errors)}${panel('External and live proof','what remains genuinely unseen',`<div class="metric"><span>Historical odds benchmark</span><b class="warn">${esc(L.external_and_live.bookmaker_benchmark.status.replaceAll('_',' '))}</b></div><div class="metric"><span>Frozen live forecasts scored</span><b class="${L.external_and_live.live_shadow.resolved?'good':'warn'}">${L.external_and_live.live_shadow.resolved}</b></div><p class="copy">${esc(L.external_and_live.policy)}</p>`,'wide')}</div>`}
function enhanceExternalBenchmark(){const b=D.legitimacy.external_and_live.bookmaker_benchmark;if(!b||b.status!=='available')return;const target=[...document.querySelectorAll('#legitimacy .panel')].find(x=>x.querySelector('h2')?.textContent==='External and live proof');if(!target)return;target.insertAdjacentHTML('beforeend',`<div class="metric"><span>2025/26 matches reconciled</span><b class="good">${b.matched} · ${pct(b.coverage)}</b></div><div class="metric"><span>Our model log loss</span><b>${n(b.model_log_loss_on_common_matches,4)}</b></div><div class="metric"><span>Closing market log loss</span><b>${n(b.odds_log_loss,4)}</b></div><div class="metric"><span>Gap to market</span><b class="warn">+${n(b.model_delta_vs_odds,4)}</b></div>`) }

function renderValidation(){const t=D.model_tournament,shoot=t.summary.find(x=>x.name==='shooting_led'),winner=t.summary[0];const rows=t.summary.map(r=>{const delta=r.delta_vs_shooting_final,cls=delta<0?'delta-better':delta>0?'delta-worse':'';return `<tr class="${r.rank===1?'winner':''}"><td><b>${r.rank}. ${esc(r.label)}</b><div class="plain">${esc(r.idea)}</div></td><td>${r.column_count}</td><td>${n(r.mean_log_loss,5)}</td><td>${n(r.final_holdout_log_loss,5)}</td><td class="${cls}">${r.name==='shooting_led'?'benchmark':`${delta>0?'+':''}${n(delta,5)}`}</td><td>${pct(r.final_holdout_accuracy)}</td></tr>`}).join('');const foldCards=Object.values(t.folds).map(f=>{const ordered=Object.entries(f.models).sort((a,b)=>a[1].log_loss-b[1].log_loss);return `<div class="fold"><span class="step">Train ${f.train_seasons.join(' + ')} · test ${f.test_season}</span><h3>${esc(ordered[0][1].label)} won this holdout</h3>${ordered.slice(0,5).map(([name,r],i)=>`<div class="metric"><span>${i+1}. ${esc(r.label)}</span><b>${n(r.log_loss,5)}</b></div>`).join('')}</div>`}).join('');const blocked=Object.entries(t.unavailable_families).map(([k,v])=>`<div class="metric"><span>${esc(k.replaceAll('_',' '))}</span><b class="warn">coverage blocked</b></div><p class="copy">${esc(v)}.</p>`).join('');document.getElementById('validation').innerHTML=`<div class="grid">${panel('How this test works','fair comparison',`<div class="explain"><strong>Every version receives the same Elo and rest context.</strong> It then receives only the feature families in its name. The shooting-led version is the benchmark—not a mandatory base. Models train on earlier seasons and are scored on a later season without seeing its results.</div><p class="copy">Primary score: log loss, because we care whether the complete win/draw/loss probabilities are honest. Accuracy is shown for context but does not decide the winner.</p>`,'wide')}${panel('Model tournament','lower log loss is better',`<div style="overflow:auto"><table class="model-table"><thead><tr><th>Model philosophy</th><th>Inputs</th><th>2-test average</th><th>25/26 holdout</th><th>vs shots on 25/26</th><th>Accuracy</th></tr></thead><tbody>${rows}</tbody></table></div><p class="copy"><strong>Read this as:</strong> ${esc(winner.label)} has the lowest observed two-test average; the uncertainty interval includes zero, so there is no defensible winner yet. Negative “vs shots” values would beat the shooting benchmark on 2025/26; positive values are worse. Tiny differences should be treated as close, not decisive.</p>`,'wide')}${panel('The two chronological tests','consistency matters',`<div class="folds">${foldCards}</div>`,'wide')}${panel('What we cannot test fairly yet','coverage before cleverness',blocked||'<p class="copy">No blocked families.</p>')}${panel('Current V2 decision','separate from tournament',`<div class="metric"><span>Registered model</span><b>${esc(D.model.display_version)}</b></div><div class="metric"><span>V2 holdout average</span><b>${n(D.model.mean_log_loss,6)}</b></div><div class="metric"><span>Live stage</span><b class="good">shadow</b></div><p class="copy">The tournament is research evidence. It does not silently replace the registered V2 model.</p>`)}</div>`}
function leagueHeat(){const f=D.validation_folds[D.validation_folds.length-1],rows=Object.entries(f.by_league);return `<div class="heat"><div class="head">league</div><div class="head">accuracy</div><div class="head">log loss</div><div class="head">calibration</div><div class="head">matches</div>${rows.map(([l,x])=>`<div>${esc(l.replace('ENG-','').replace('ESP-','').replace('ITA-','').replace('GER-','').replace('FRA-',''))}</div><div class="cell" style="--heat:${x.accuracy*100}">${pct(x.accuracy)}</div><div>${n(x.log_loss,3)}</div><div>${n(x.calibration_error,3)}</div><div>${x.matches}</div>`).join('')}</div>`}
function renderFeatures(){const families=['all',...new Set(D.coefficients.map(r=>r.family))];const selected=new Set(D.features.map(f=>f.feature.replace(/^team\.|^opponent\./,'').replace(/_(3|5|10)$/,''))),queue=Object.entries(D.research_queue.catalog).map(([family,items])=>`<div class="fold"><h3>${esc(family.replaceAll('_',' '))}</h3>${items.map(x=>`<div class="metric"><span>${esc(x.replaceAll('_',' '))}</span><b class="${selected.has(x)?'good':'warn'}">${selected.has(x)?'IN V2':'RESEARCH'}</b></div>`).join('')}</div>`).join('');document.getElementById('features').innerHTML=`<div class="grid">${panel('Read this before the bars','weights are not a league table',`<div class="explain"><strong>A longer coefficient bar does not mean “this stat is most important to football.”</strong> It shows the direction and size of one standardized term inside this fitted model. Correlated features split credit, and one family appears many times because team/opponent and 3/5/10-match windows are separate inputs.</div>`,'wide')}${panel('Family footprint','descriptive, not causal',familyCoefficientSummary(),'wide')}${panel('Coefficient explorer','home-goal equation · standardized scale',`<div class="filters" id="featureFilters">${families.map((f,i)=>`<button class="chip ${i?'':'on'}" data-family="${esc(f)}">${esc(f)}</button>`).join('')}</div><div class="feature-table" id="featureRows"></div><p class="copy"><strong>Teal:</strong> raises the home-goal estimate. <strong>Orange:</strong> lowers it. Use this to debug model behavior—not to rank football concepts. The model tournament is the better test of whether a family improves predictions.</p>`,'wide')}${panel('Feature research queue','active vs awaiting reliable coverage',`<div class="folds">${queue}</div><p class="copy">xT, xG, final-third touches, sequence quality, progression and pressing remain explicit research targets. “Research” means we do not yet have sufficiently complete, comparable data across all three historical seasons—not that the idea was rejected.</p>`,'wide')}</div>`;document.querySelectorAll('#featureFilters .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#featureFilters .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderFeatureRows(b.dataset.family)});renderFeatureRows('all')}
function familyCoefficientSummary(){const sums={};D.coefficients.forEach(r=>{if(String(r.feature).startsWith('missingindicator_'))return;const x=sums[r.family]||(sums[r.family]={sum:0,count:0});x.sum+=r.magnitude;x.count++});const total=Object.values(sums).reduce((a,x)=>a+x.sum,0)||1;return `<div class="folds">${Object.entries(sums).sort((a,b)=>b[1].sum-a[1].sum).map(([family,x])=>`<div class="fold"><h3>${esc(family)}</h3><div class="metric"><span>Terms represented</span><b>${x.count}</b></div><div class="metric"><span>Share of absolute fitted weight</span><b>${pct(x.sum/total)}</b></div></div>`).join('')}</div><p class="copy">This footprint explains why a family occupies visual space; it is still not predictive importance. Compare families in <strong>Model tournament</strong> for the outcome test.</p>`}
function renderFeatureRows(family){const rows=D.coefficients.filter(r=>family==='all'||r.family===family).slice(0,80),mx=Math.max(...rows.map(r=>r.magnitude),.001);document.getElementById('featureRows').innerHTML=rows.map(r=>{const v=r.home_goal_coefficient||0,w=Math.abs(v)/mx*50,left=v<0?50-w:50;return `<div class="frow"><span>${esc(r.feature.replace('numeric__','').replace('categorical__',''))}</span><span class="family">${esc(r.family)}</span><div class="coef"><span class="${v<0?'neg':''}" style="left:${left}%;width:${w}%"></span></div><span>${v>=0?'+':''}${n(v,3)}</span></div>`}).join('')}
function renderMatches(){const opts=D.predictions.sort((a,b)=>a.date.localeCompare(b.date)).map((r,i)=>`<option value="${i}">${new Date(r.date).toLocaleDateString()} · ${esc(r.home_team)} — ${esc(r.away_team)}</option>`).join('');document.getElementById('matches').innerHTML=`<div class="callout"><a href="match-review.html?game=fd-560586"><strong>Worked match review: Brighton 3–0 Arsenal →</strong></a><br>Frozen forecast, shot maps, chance timeline and exploratory challenger comparison. Data caveats are explicit.</div><div class="grid">${panel('Forecast dissection','select a match',`<select class="select" id="matchSelect">${opts}</select><div id="matchDetail"></div>`,'wide')}</div>`;document.getElementById('matchSelect').onchange=e=>renderMatch(Number(e.target.value));renderMatch(0)}
function renderMatch(i){const r=D.predictions[i];if(!r){document.getElementById('matchDetail').innerHTML='<div class="empty">No explained predictions.</div>';return}const e=r.explanation,ps=[['HOME',r.home_win_probability],['DRAW',r.draw_probability],['AWAY',r.away_win_probability]];document.getElementById('matchDetail').innerHTML=`<div class="match-grid"><div><div class="club">${esc(r.home_team)}</div><div class="xg">${n(r.home_expected_goals,2)} xG</div></div><div><div class="club">${esc(r.away_team)}</div><div class="xg">${n(r.away_expected_goals,2)} xG</div></div></div><p class="copy">${esc(e.summary)}</p>${ps.map(p=>`<div class="prob-line"><span>${p[0]}</span><div class="track"><span class="fill" style="width:${p[1]*100}%"></span></div><b>${pct(p[1])}</b></div>`).join('')}<div class="ph" style="margin-top:22px"><h2>Evidence ledger</h2><span>actual inputs</span></div>${window.forecastEvidence(e)}<div class="inputs">${Object.entries(e.inputs).map(([k,v])=>`<div class="input"><b>${v==null?'—':esc(v)}</b><span>${esc(k.replaceAll('_',' '))}</span></div>`).join('')}</div><div class="ph" style="margin-top:22px"><h2>Directional drivers</h2><span>log goal-rate contribution</span></div>${e.drivers.map(d=>`<div class="driver"><strong>${esc(d.label)} · ${esc(d.strength)}</strong><span>${d.goal_balance_effect>=0?'+':''}${n(d.goal_balance_effect,3)}</span><p>Favors ${esc(d.favors)}. ${esc(d.detail)}</p></div>`).join('')}<p class="copy">${esc(e.method)} ${esc(e.scope)}</p>`}
function renderMonitoring(){const d=D.drift,s=D.shadow;const drift=d.features.map(r=>`<div class="drift-row"><span>${esc(r.feature)}</span><span class="tag ${r.severity}">${r.severity}</span><span>PSI ${n(r.population_stability_index,3)}</span><span>shift ${n(r.standardized_mean_shift,3)}</span><span>missing Δ ${n(r.missing_rate_change,3)}</span></div>`).join('');const leagues=Object.entries(s.by_league||{}).map(([l,x])=>`<div class="metric"><span>${esc(l)}</span><b>${x.matches||0} scored${x.log_loss!=null?' · LL '+n(x.log_loss,3):''}</b></div>`).join('');document.getElementById('monitoring').innerHTML=`<div class="grid">${panel('How to read data health','warning system, not a verdict',`<div class="explain"><strong>Start with live scoring:</strong> it tells us how forecasts perform. Then use drift to ask whether current inputs look unlike the historical training sample. PSI measures distribution change; mean shift shows direction; missing Δ reveals coverage changes.</div>`,'wide')}${panel('Live shadow score','real predictions only',`<div class="metric"><span>Resolved forecasts</span><b>${s.resolved||0}</b></div><div class="metric"><span>Still pending</span><b>${s.pending||0}</b></div><div class="metric"><span>Promotion sample gate</span><b class="${s.sample_gate?.ready?'good':'warn'}">${esc(s.sample_gate?.decision||'collect_more_results')}</b></div>${leagues||'<div class="empty">Waiting for the first eligible frozen slate to resolve.</div>'}`)}${panel('Current-season drift','investigate before trusting',`<div class="metric"><span>Decision</span><b class="${d.decision==='no_material_drift_detected'?'good':'warn'}">${esc(d.decision)}</b></div><div class="metric"><span>Current sample</span><b>${d.current_matches} matches</b></div><p class="copy">Calendar effects can legitimately differ early in a season. Severe rest-day drift is reviewed separately from football-performance drift.</p>`)}${panel('Feature drift ledger','phase-matched historical reference',`<div class="drift-row"><b>feature</b><b>status</b><b>PSI</b><b>mean shift</b><b>missing</b></div>${drift}`,'wide')}</div>`}
</script></body></html>
