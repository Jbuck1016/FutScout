<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FutScout · Football analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css?v=pr1">
<script src="site-tools.js?v=pr1"></script>
<style>
/* Home. Tokens come from theme.css, chrome from shell.css, data panels from
   components.css (fs-*). What is left here is this page's own layout: the
   scope summary, the find bar, the destination group rows and a few table
   details. Every value is a token. */
*{box-sizing:border-box}
.wrap{max-width:1240px;margin:0 auto;padding:var(--s5) var(--s6) calc(var(--s6)*2);display:flex;flex-direction:column;gap:var(--s5)}
.wrap>*{min-width:0}

/* ---- title + scope summary ---- */
.home-head{display:flex;align-items:flex-end;flex-wrap:wrap;gap:var(--s3) var(--s6);padding-bottom:var(--s4);border-bottom:1px solid var(--ink)}
.home-head-main{flex:1 1 480px;min-width:0}
.pops{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s5);margin:var(--s2) 0 0;padding:0;list-style:none;font:400 12px/1.4 var(--body);color:var(--muted)}
.pops li{min-width:0}
.pops b{font:500 12px/1.4 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.pops em{font-style:normal;color:var(--ink)}
.pops .fs-skel{display:inline-block;width:120px;vertical-align:middle}

/* ---- find bar ---- */
.find{position:relative}
.find-box{display:flex;align-items:center;gap:var(--s3);height:40px;padding:0 var(--s4);background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius)}
.find-box:focus-within{border-color:var(--ink);outline:2px solid var(--accent);outline-offset:2px}
#q{flex:1 1 auto;min-width:0;height:100%;padding:0;background:none;border:0;outline:0;color:var(--ink);font:400 13px/1 var(--body)}
#q::placeholder{color:var(--muted)}
.kbd{flex:0 0 auto;padding:3px 6px;border:1px solid var(--rule);border-radius:var(--radius);font:500 10px/1 var(--mono);letter-spacing:.08em;color:var(--muted)}
.res{position:absolute;left:0;right:0;top:calc(100% + var(--s1));z-index:40;display:none;max-height:340px;overflow:auto;background:var(--panel);border:1px solid var(--ink);border-radius:var(--radius)}
.res.on{display:block}
.rgroup{padding:var(--s3) var(--s4) var(--s2);border-bottom:1px solid var(--rule)}
/* A result goes to another page, so it is a real link: it carries the URL, it
   opens in a new tab on middle click, and Enter activates it. */
.ritem{display:flex;align-items:center;gap:var(--s4);min-height:var(--tap);padding:var(--s2) var(--s4);border-left:3px solid transparent;border-bottom:1px solid var(--rule2);color:var(--ink);text-decoration:none}
.ritem:last-child{border-bottom:0}
.ritem:hover{background:var(--panel2)}
.ritem.sel{background:var(--bg);border-left-color:var(--accent)}
.ritem:focus-visible{outline-offset:-2px}
.ritem .fs-tag{flex:0 0 46px;justify-content:center}
.ritem-n{flex:1 1 auto;min-width:0;font:600 13px/1.3 var(--body);overflow-wrap:anywhere}
.ritem-m{flex:0 0 auto;font:400 11px/1.3 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.res-empty{margin:0;padding:var(--s5) var(--s4);font:400 12px/1.4 var(--body);color:var(--muted)}

/* ---- league scope chips ---- */
.lgstrip{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2)}
.lgstrip .fs-label{margin-right:var(--s1)}
.lgchip small{font:400 11px/1.2 var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.lgchip[aria-pressed="true"] small{color:inherit}
.lgstrip .fs-skel{width:130px;height:var(--tap)}

/* ---- destination groups ---- */
.groups{display:flex;flex-direction:column;gap:var(--s3)}
.grp{display:grid;grid-template-columns:72px minmax(0,1fr);gap:var(--s4);align-items:start;padding-top:var(--s3);border-top:1px solid var(--rule)}
.grp-h{margin:0;padding-top:var(--s3)}
.grp-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s3);min-width:0}
.dest{display:flex;flex-direction:column;gap:var(--s1);min-width:0;padding:var(--s3) var(--s4);background:var(--panel);border:1px solid var(--rule);border-radius:var(--radius);color:var(--ink);text-decoration:none}
.dest:hover{background:var(--panel2);border-color:var(--ink)}
.dest-t{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s1) var(--s3);font:500 16px/1.2 var(--display)}
.dest-d{font:400 11px/1.4 var(--body);color:var(--muted)}
.dest-n{margin-top:auto;padding-top:var(--s1);font:400 11px/1.3 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---- league tables and leaders ---- */
.intel-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s2) var(--s4);padding-top:var(--s3);border-top:1px solid var(--ink);scroll-margin-top:var(--s4)}
.intel-h h2{margin:0;font:600 24px/1.1 var(--display)}
.intel-h p{margin:0}
.fs-panel-h .fs-seg{margin-left:auto;overflow-x:auto}
.tbl-cap{margin:0 0 var(--s3)}
.tbl-scroll{max-height:372px}
.fs-table th button{min-height:var(--tap)}
.fs-table th.is-sorted{color:var(--ink)}
.fs-table td.rk{width:34px;color:var(--muted)}
.fs-table td.nm{font-weight:600}
.fs-table td.nm a{color:inherit;text-decoration:none}
.fs-table td.nm a:hover{text-decoration:underline}
.fs-table td.nm small{display:block;font:400 11px/1.3 var(--body);color:var(--muted)}
.fs-table td.hot{font-weight:500;color:var(--ink)}
.fs-table td.barc{width:74px}
.fs-table tbody tr{cursor:pointer}
.panel-state{margin:0 0 var(--s3)}
.foot{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s5);margin:0;padding:var(--s4) 0 0;border-top:1px solid var(--rule);list-style:none}

@media (max-width:760px){
  .wrap{padding:var(--s4) var(--s4) var(--s6)}
  .find-box{height:44px}
  .lgstrip{flex-wrap:nowrap;overflow-x:auto;padding-bottom:var(--s1);scrollbar-width:thin}
  .lgstrip>*{flex:0 0 auto}
  .grp{grid-template-columns:minmax(0,1fr);gap:var(--s2)}
  .grp-h{padding-top:0}
  .grp-cards{grid-template-columns:minmax(0,1fr)}
  .fs-panel-h .fs-seg{margin-left:0}
}
</style>
<script src="gate.js"></script>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="shell.css?v=pr1">
<link rel="stylesheet" href="components.css?v=pr1">
</head>
<body><script>window.FutScout&&FutScout.mount()</script>
<main class="wrap" data-fs-app>

  <header class="home-head">
    <div class="home-head-main">
      <h1 class="fs-title">Football analytics</h1>
      <ul class="pops" id="sysLine" aria-label="Scope summary: each number is counted from its own population" aria-live="polite">
        <li><span class="fs-skel line"></span></li><li><span class="fs-skel line"></span></li><li><span class="fs-skel line"></span></li>
      </ul>
    </div>
    <a class="fs-btn k" href="#league">League tables and leaders &darr;</a>
  </header>

  <div class="fs-banner fs-banner-warn" id="pageErr" role="alert" hidden>
    <span class="fs-banner-label">Error</span>
    <span class="fs-banner-text" id="pageErrText"></span>
    <button type="button" class="fs-btn k" id="pageErrRetry">Retry</button>
  </div>

  <div class="find cmd">
    <div class="find-box">
      <label class="fs-label" for="q">Find</label>
      <input id="q" type="search" placeholder="Search a player, team or match" autocomplete="off" spellcheck="false" aria-controls="res" aria-describedby="kbdHint">
      <span class="kbd" id="kbdHint" title="Press / to focus this find bar. Ctrl or Cmd + K opens Go to, which runs the same search.">/</span>
    </div>
    <div class="res" id="res" role="region" aria-label="Search results" aria-live="polite"></div>
  </div>

  <div class="lgstrip" id="lgStrip" role="group" aria-label="League scope">
    <span class="fs-label">League scope</span><span class="fs-skel"></span><span class="fs-skel"></span><span class="fs-skel"></span>
  </div>

  <nav class="groups mods" id="groups" aria-label="Destinations by group"></nav>

  <div class="intel-h" id="league">
    <h2>League tables and leaders</h2>
    <p class="fs-note" id="intelNote"></p>
  </div>

  <div class="fs-cols-2 cols">
    <section class="fs-panel" id="tblPanel" data-export-manual aria-labelledby="tblTitle">
      <div class="fs-panel-h">
        <h2 id="tblTitle" data-chart-title>League table</h2>
        <div class="fs-seg" id="tblSeg" role="group" aria-label="League table view" data-export></div>
      </div>
      <div id="tblBody"></div>
      <div class="fs-panel-foot">
        <span class="fs-note" id="tblFoot"></span>
        <span class="fs-push" data-export>
          <button type="button" class="fs-btn k" data-exp="tbl" data-format="png" aria-label="Download the league table as PNG">PNG</button>
          <button type="button" class="fs-btn k" data-exp="tbl" data-format="pdf" aria-label="Download the league table as PDF">PDF</button>
          <button type="button" class="fs-btn k" data-exp="tbl" data-format="csv" aria-label="Download the league table data as CSV">CSV</button>
        </span>
      </div>
    </section>
    <section class="fs-panel" id="ldPanel" data-export-manual aria-labelledby="ldTitle">
      <div class="fs-panel-h">
        <h2 id="ldTitle" data-chart-title>Player leaders</h2>
        <div class="fs-seg" id="ldSeg" role="group" aria-label="Leader metric" data-export></div>
      </div>
      <div id="ldBody"></div>
      <div class="fs-panel-foot">
        <span class="fs-note" id="ldFoot"></span>
        <span class="fs-push" data-export>
          <button type="button" class="fs-btn k" data-exp="ld" data-format="png" aria-label="Download the player leaders as PNG">PNG</button>
          <button type="button" class="fs-btn k" data-exp="ld" data-format="pdf" aria-label="Download the player leaders as PDF">PDF</button>
          <button type="button" class="fs-btn k" data-exp="ld" data-format="csv" aria-label="Download the player leaders data as CSV">CSV</button>
        </span>
      </div>
    </section>
  </div>

  <ul class="foot fs-note" id="foot">
    <li>Data · WhoScored</li>
    <li>xG · empirical model; external validation not established</li>
    <li>Player percentiles · within role, 3+ nineties</li>
  </ul>
</main>

<script>
const SB='https://xrsilhiffjoulyoqhdmp.supabase.co';
const FS=window.FutScout||null;
/* League scope is shared with teams.html and insights.html via localStorage, so a
   choice made on one page carries to the others. */
var TEAM_LG={}, LG_SCOPE=(function(){try{return localStorage.getItem('leagueScope')||'ALL'}catch(e){return 'ALL'}})();
function lgOfTeam(t){return TEAM_LG[t]||null}
function teamInScope(t){return LG_SCOPE==='ALL'||lgOfTeam(t)===LG_SCOPE}
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhyc2lsaGlmZmpvdWx5b3FoZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Nzc5NDAsImV4cCI6MjEwMDI1Mzk0MH0.3_ccOJi0SBKOwHGxhJL3fsWCSSLoxZumzt-KH4wO8OU';
const HD={'apikey':AK,'Authorization':'Bearer '+AK};
const TEAM_DISPLAY={'Chicago':'Chicago Fire FC','Colorado':'Colorado Rapids','Columbus':'Columbus Crew',
 'Houston':'Houston Dynamo FC','Kansas City':'Sporting Kansas City','Montreal':'CF Montréal',
 'New England':'New England Revolution','New York':'New York Red Bulls','Philadelphia':'Philadelphia Union',
 'Portland':'Portland Timbers','Salt Lake':'Real Salt Lake','San Jose':'San Jose Earthquakes',
 'Seattle':'Seattle Sounders FC','Toronto':'Toronto FC','Vancouver':'Vancouver Whitecaps',
 'L.A. Galaxy':'LA Galaxy'};
let NAMEMAP={};
function tname(t){return NAMEMAP[t]||TEAM_DISPLAY[t]||t||''}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function $(id){return document.getElementById(id)}
function nf(n){return (+n).toLocaleString('en-US')}

let TEAMS=[],PLAYERS=[],MATCHES=[],LEAD={},SEL=-1,HITS=[];
/* LIVE is the league summary (leagues with event data); null until it loads,
   false when it could not be read. DIR_OK says whether team -> league
   membership loaded; without it a single-league scope cannot be applied. */
let LIVE=null, DIR_OK=false, LOADED=false;
let TBL='xg', LD='xg_90';
/* Column sort cycles: best first -> worst first -> back to the view default. */
let TSORT={col:null,dir:0}, LSORT={col:null,dir:0};
function cycleSort(state,col){
  if(state.col!==col){state.col=col;state.dir=1;}
  else if(state.dir===1){state.dir=-1;}
  else {state.col=null;state.dir=0;}
}

async function sbAll(t,p){p=p||{};const PG=1000;let all=[],off=0;
  while(true){const u=new URL(SB+'/rest/v1/'+t);
    Object.keys(p).forEach(function(k){u.searchParams.set(k,p[k])});
    const r=await fetch(u,{headers:Object.assign({},HD,{'Range':off+'-'+(off+PG-1),'Range-Unit':'items'})});
    if(!r.ok)throw new Error(t+' '+r.status);const d=await r.json();
    if(!Array.isArray(d)||!d.length)break;all=all.concat(d);if(d.length<PG)break;off+=PG;}
  return all;}

/* ---------- destination groups ----------
   Built from the shell's registry, so the menus, the palette and these cards
   are one list. This page only adds the blurb and, where one exists, the live
   counter. */
const CARD={
  'match.html':{d:'Any fixture, event by event: pass maps, networks, pressure, momentum, shape.',n:'nMatch'},
  'sequences.html':{d:'Every possession chain, searchable by shape and pattern, with similarity across teams.',n:'nSeq'},
  'players.html':{d:'Percentile profiles against role, DNA pillars, pitch maps, scatter, scout ranking.',n:'nPlayer'},
  'teams.html':{d:'Style against the league, build-up and pressing, season maps, rankings, squads.',n:'nTeam'},
  'insights.html':{d:'Recruitment reads from the data: standout profiles, key-man risk, how each side plays.',n:'nInsight'},
  'search.html':{d:'Build a shortlist from behavioural traits: position, side, age, foot, role percentiles.',n:'nSearch'},
  'market-values.html':{d:'Player valuations joined to role, usage, league context, squad totals and coverage.',n:'nValue',n0:'open market desk'},
  'model-review.html':{d:'Experimental match probabilities, expected goals, evidence and five-league season simulations.',tag:'Private shadow'},
  'model-lab.html':{d:'Coefficients, candidate trials, holdout validation, match drivers, drift, calibration, shadow scoring.',tag:'Research desk'},
  'match-review.html':{d:'One worked match: the forecast evidence as captured, read against the result.'},
  'writing-lab.html':{d:'Paste a WhoScored match, build an evidence pack, annotate plots, draft, publish, reopen.'},
  'quick-ingest.html':{d:'Paste one completed WhoScored match to load it and queue the governed analytics refresh.'},
  'guide.html':{d:'How each metric is built, how to read the maps, how to build a shortlist, where numbers mislead.'},
  'glossary.html':{d:'Every metric defined: the calculation, the league distribution, a worked example at each end.',n:'nMetric'},
  'evidence-contracts.html':{d:'Zone, eligibility and measure definitions: the same name is not always the same measure.'},
  'methodology.html':{d:'How the data is collected, scoped and modelled.'},
  'validation.html':{d:'Claims graded by the evidence supporting them.'}
};
(function renderGroups(){
  const groups=((FS&&FS.destinations)||[]).filter(function(g){return g[0]!=='Home'});
  $('groups').innerHTML=groups.map(function(g){
    const gid='grp-'+g[0].toLowerCase();
    return '<section class="grp" aria-labelledby="'+gid+'"><h2 class="fs-label grp-h" id="'+gid+'">'+esc(g[0])+'</h2>'+
      '<div class="grp-cards">'+g[1].map(function(item){
        const c=CARD[item[1]]||{};
        return '<a class="dest" href="'+esc(item[1])+'">'+
          '<span class="dest-t">'+esc(item[0])+(c.tag?' <span class="fs-tag">'+esc(c.tag)+'</span>':'')+'</span>'+
          (c.d?'<span class="dest-d">'+esc(c.d)+'</span>':'')+
          (c.n?'<span class="dest-n" id="'+c.n+'">'+esc(c.n0||'…')+'</span>':'')+'</a>';
      }).join('')+'</div></section>';
  }).join('');
})();
function setCount(id,text,title){const el=$(id);if(!el)return;el.textContent=text;if(title)el.title=title}

/* ---------- page states ---------- */
function skelRows(n){let h='<div aria-hidden="true">';for(let i=0;i<n;i++)h+='<div class="fs-skel row"></div>';
  return h+'</div><span class="fs-note" role="status">Loading…</span>'}
function banner(text,retry){
  return '<div class="fs-banner fs-banner-warn panel-state" role="alert"><span class="fs-banner-label">Error</span>'+
    '<span class="fs-banner-text">'+esc(text)+'</span>'+
    (retry?'<button type="button" class="fs-btn k" data-retry="'+esc(retry)+'">Retry</button>':'')+'</div>';
}
function emptyState(title,reason,action){
  return '<div class="fs-empty"><h3>'+esc(title)+'</h3><p>'+esc(reason)+'</p>'+
    (action?'<button type="button" class="fs-btn" data-act="'+esc(action[0])+'">'+esc(action[1])+'</button>':'')+'</div>';
}
function scopeName(){
  if(LG_SCOPE==='ALL')return 'All leagues';
  const l=(LIVE||[]).filter(function(x){return x.league===LG_SCOPE})[0];
  return l?l.display_name:LG_SCOPE;
}
/* Why a single-league scope shows no rows, in words. */
function noRowsReason(what){
  if(LG_SCOPE!=='ALL'&&!DIR_OK)return 'Team-to-league membership (v_team_directory) did not load, so '+what+' cannot be filtered to '+scopeName()+'. Nothing is known to be missing from the data itself.';
  if(LG_SCOPE!=='ALL')return 'No '+what+' are recorded for '+scopeName()+' in this snapshot. Other leagues may still have rows.';
  return 'The source returned no '+what+' for this view.';
}

/* ---------- scope: chips + shell SCOPE select, one state ---------- */
function setScope(v){
  LG_SCOPE=v;
  try{localStorage.setItem('leagueScope',LG_SCOPE)}catch(e){}
  paintChips();
  if(FS)FS.setScopeValue(LG_SCOPE);
  renderSummary();
  if(LOADED){renderTable();loadLeaders();}
}
function paintChips(){
  document.querySelectorAll('#lgStrip .lgchip').forEach(function(x){
    x.classList.toggle('on',x.dataset.lg===LG_SCOPE);
    x.setAttribute('aria-pressed',String(x.dataset.lg===LG_SCOPE));});
}
function renderChips(){
  const strip=$('lgStrip');
  if(!LIVE){
    strip.innerHTML='<span class="fs-label">League scope</span><span class="fs-note">League list not available: the league summary did not load. Scope stays '+esc(scopeName())+'.</span>';
    if(FS)FS.registerScope({options:[{value:LG_SCOPE,label:scopeName()}],value:LG_SCOPE,disabled:true,
      title:'The league list did not load on this page, so the scope cannot be changed here. The scope you chose is kept.'});
    return;
  }
  strip.innerHTML='<span class="fs-label">League scope</span>'+
    '<button type="button" class="fs-btn lgchip'+(LG_SCOPE==='ALL'?' on':'')+'" data-lg="ALL" aria-pressed="'+(LG_SCOPE==='ALL')+'">All leagues</button>'+
    LIVE.map(function(l){
      return '<button type="button" class="fs-btn lgchip'+(LG_SCOPE===l.league?' on':'')+'" data-lg="'+esc(l.league)+'" aria-pressed="'+(LG_SCOPE===l.league)+'"'+
        ' title="'+esc(l.display_name)+': '+l.matches+' matches with event data and '+l.teams+' clubs, both from the league summary">'+
        '<b>'+esc(l.display_name)+'</b> <small>'+l.matches+' event-complete · '+l.teams+' clubs</small></button>'}).join('');
  const opts=[{value:'ALL',label:'All leagues'}].concat(LIVE.map(function(l){return{value:l.league,label:l.display_name}}));
  if(LG_SCOPE!=='ALL'&&!LIVE.some(function(l){return l.league===LG_SCOPE}))
    opts.push({value:LG_SCOPE,label:LG_SCOPE+' (no event data)'});
  if(FS)FS.registerScope({options:opts,value:LG_SCOPE,onChange:setScope});
}
$('lgStrip').onclick=function(ev){
  var c=ev.target.closest('.lgchip'); if(!c)return;
  setScope(c.dataset.lg);
};

/* ---------- scope summary ----------
   Every number names the population it was counted from. The sources disagree
   (matches with event rows vs played fixtures; season rows vs profiled
   players) and that is shown, not reconciled. */
function renderSummary(){
  const one=LG_SCOPE!=='ALL', items=[];
  function item(n,label,src,title){items.push('<li title="'+esc(title)+'"><b>'+esc(n)+'</b> <em>'+esc(label)+'</em> · '+esc(src)+'</li>')}
  if(LIVE){
    const rows=one?LIVE.filter(function(l){return l.league===LG_SCOPE}):LIVE;
    const tot=function(k){return rows.reduce(function(a,l){return a+(+l[k]||0)},0)};
    item(one?rows.length+' of '+LIVE.length:String(LIVE.length),'league'+(LIVE.length===1&&!one?'':'s'),'with event data',
      'Leagues with at least one match carrying event rows. Source: v_league_summary.');
    item(nf(tot('matches')),'event-complete matches','league summary',
      'Distinct matches that have event rows, summed over the leagues in scope. Source: v_league_summary.matches.');
    item(nf(tot('teams')),'teams','league summary',
      'Teams appearing in those event rows. Source: v_league_summary.teams.');
    item(nf(tot('players_profiled')),'players profiled','league summary',
      'Players in the search index, per league. Source: v_league_summary.players_profiled.');
  }else if(LIVE===false){
    items.push('<li><em>Leagues and event-complete matches</em> · not reported: the league summary did not load</li>');
  }
  if(LOADED){
    if(!one){
      item(nf(MATCHES.length),'played fixtures','fixture list',
        'Fixtures with a recorded score. Source: v_league_matches. This is a different population from event-complete matches and the two are not expected to agree.');
      item(nf(PLAYERS.length),'players','season rows',
        'Players with a season row, whatever their minutes. Source: mv_player_season. A different population from players profiled.');
    }else if(DIR_OK){
      const fx=MATCHES.filter(function(m){return (lgOfTeam(m.home_team)||lgOfTeam(m.away_team))===LG_SCOPE}).length;

/* ---------- find bar ----------
   One search: FutScout.entitySearch, the same call the GO TO palette makes. */
const qEl=$('q'), resEl=$('res');
let FIND_SEQ=0;
const GROUPS={player:'Players',team:'Teams',match:'Matches'};
function search(v){
  v=v.trim();
  const seq=++FIND_SEQ;
  if(!v){resEl.classList.remove('on');resEl.innerHTML='';HITS=[];SEL=-1;return}
  if(!FS||!FS.entitySearch){
    HITS=[];SEL=-1;
    resEl.innerHTML='<p class="res-empty">Search is unavailable: the shared search did not load. Use the destination cards below.</p>';
    resEl.classList.add('on');return}
  if(!HITS.length){resEl.innerHTML='<p class="res-empty">Searching players, teams and matches…</p>';resEl.classList.add('on')}
  FS.entitySearch(v).then(function(list){
    if(seq!==FIND_SEQ)return;
    HITS=list||[];SEL=HITS.length?0:-1;
    if(!HITS.length){
      resEl.innerHTML='<p class="res-empty">No player, team or match name contains “'+esc(v)+'”. The search matches part of a name, across all leagues.</p>';
      resEl.classList.add('on');return}
    let h='',last=null;
    HITS.forEach(function(x,i){
      if(x.kind!==last){h+='<div class="rgroup fs-label">'+esc(GROUPS[x.kind]||x.kind)+'</div>';last=x.kind}
      h+=row(x,i);});
    resEl.innerHTML=h;resEl.classList.add('on');
  }).catch(function(e){
    if(seq!==FIND_SEQ)return;
    HITS=[];SEL=-1;
    resEl.innerHTML='<p class="res-empty">Search is unavailable right now: the player, team and match lists did not load'+
      (e&&e.message?' ('+esc(e.message)+')':'')+'. Type again to retry; the destination cards still work.</p>';
    resEl.classList.add('on');
  });
}
/* The tag on the left of a result is a role pool for players, and TEAM or MTCH
   for the other two groups. Read out as-is, "CB Miles Robinson" says nothing
   about where the row goes, so the label spells the tag out. */
const KIND={TEAM:'team page for',MTCH:'match report for',
  GK:'goalkeeper',CB:'centre-back',FB:'full-back',CM:'central midfielder',
  AM:'attacking midfielder',W:'wide forward',ST:'striker'};
function row(x,i){
  return '<a class="ritem'+(i===SEL?' sel':'')+'" data-i="'+i+'" href="'+esc(x.href)+'"'+
    ' aria-label="Open '+esc(KIND[x.tag]||'player')+' '+esc(x.name)+'">'+
    '<span class="fs-tag ritem-k">'+esc(x.tag)+'</span><span class="ritem-n">'+esc(x.name)+'</span>'+
    '<span class="ritem-m">'+esc(x.meta)+'</span></a>';
}
function go(i){if(HITS[i])location.href=HITS[i].href}
function moveSel(d){
  if(!HITS.length)return;
  SEL=(SEL+d+HITS.length)%HITS.length;
  const els=resEl.querySelectorAll('.ritem');
  els.forEach(function(el){el.classList.toggle('sel',+el.dataset.i===SEL)});
  const cur=resEl.querySelector('.ritem.sel');if(cur)cur.scrollIntoView({block:'nearest'});
}
qEl.addEventListener('input',function(){search(this.value)});
qEl.addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'){e.preventDefault();moveSel(1)}
  else if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1)}
  else if(e.key==='Enter'){if(SEL>=0)go(SEL)}
  else if(e.key==='Escape'){this.value='';search('');this.blur()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='/' && !e.ctrlKey && !e.metaKey && !e.altKey && document.activeElement!==qEl && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')){
    e.preventDefault();qEl.focus();
  }
});
document.addEventListener('click',function(e){
  if(!e.target.closest('.cmd'))resEl.classList.remove('on');
});
qEl.addEventListener('focus',function(){if(resEl.innerHTML)resEl.classList.add('on')});

/* ---------- league table ---------- */
const COL={

  goals_against_pg:{l:'GA/G',  d:'Goals conceded per game',                    dp:2, low:1},
  shots_pg:        {l:'SH/G',  d:'Shots taken per game',                       dp:1},
  shots_against_pg:{l:'SHA/G', d:'Shots faced per game',                       dp:1, low:1},
  possession_pct:  {l:'POSS',  d:'Share of all passes in the match',           dp:1, suf:'%'},
  field_tilt:      {l:'TILT',  d:'Share of final-third touches, territorial control rather than raw possession', dp:1, suf:'%'},
  ppda:            {l:'PPDA',  d:'Opponent passes allowed per defensive action in their own 60%. Lower means a more aggressive press', dp:2, low:1},
  def_height:      {l:'LINE',  d:'Average pitch position of defensive actions. Higher means a higher line', dp:1},
  passes_per_seq:  {l:'P/POSS',d:'Passes strung together per possession. High means patient',  dp:2},
  direct_attack_pct:{l:'DIRECT',d:'Possessions starting in their own half that reach a shot inside 15 seconds', dp:2, suf:'%'}
};
const TBLS=[
  {k:'xg',   l:'Attack',  sort:'goals_pg',         cols:['goals_pg','shots_pg','field_tilt'],
   cap:'Ranked by goals per game. Shots and territorial tilt alongside.'},
  {k:'ctrl', l:'Control', sort:'field_tilt',       cols:['field_tilt','possession_pct','passes_per_seq'],
   cap:'Ranked by field tilt, where play actually happens, which separates real control from sterile possession.'},
  {k:'press',l:'Press',   sort:'ppda',             cols:['ppda','def_height'],
   cap:'Ranked by PPDA, lowest first: fewest opponent passes allowed per defensive action means the most aggressive press.'},
  {k:'def',  l:'Defence', sort:'goals_against_pg', cols:['goals_against_pg','shots_against_pg','ppda'],
   cap:'Ranked by goals conceded per game, fewest first.'}
];
function tblCfg(){return TBLS.filter(function(t){return t.k===TBL})[0]}
function renderSegs(){
  $('tblSeg').innerHTML=TBLS.map(function(t){
    return '<button type="button" aria-pressed="'+(TBL===t.k)+'" data-tbl="'+t.k+'">'+t.l+'</button>'}).join('');
  $('ldSeg').innerHTML=LDS.map(function(l){

$('tblSeg').onclick=function(ev){const b=ev.target.closest('button[data-tbl]');if(!b)return;
  TBL=b.dataset.tbl;TSORT={col:null,dir:0};renderSegs();renderTable()};
$('ldSeg').onclick=function(ev){const b=ev.target.closest('button[data-ld]');if(!b)return;pickLd(b.dataset.ld)};
function pickLd(k){LD=k;LSORT={col:null,dir:0};renderSegs();loadLeaders()}
function fmtCol(v,c){
  if(v==null)return'—';
  const m=COL[c]||{};
  return (+v).toFixed(m.dp==null?1:m.dp)+(m.suf||'');
}
function sortTbl(c){cycleSort(TSORT,c);renderTable()}
/* The rows the league table shows, in the order it shows them. The export
   reads the same list. */
function tableRows(){
  const cfg=tblCfg();
  const active=TSORT.col||cfg.sort;
  const low=(COL[active]||{}).low;
  // dir 1 = best first (which for an inverted metric means lowest)
  const dir=TSORT.col?TSORT.dir:1;
  const rows=TEAMS.slice().filter(function(r){return r[active]!=null&&teamInScope(r.team)}).sort(function(a,b){
    let d=(+b[active])-(+a[active]);
    if(low)d=-d;
    return dir===1?d:-d;});
  /* aria-sort describes the order of the values themselves: best first on a
     lower-is-better column runs ascending. */
  return{cfg:cfg,active:active,low:low,dir:dir,rows:rows,order:((dir===1)===!low)?'descending':'ascending'};
}
function renderTable(){
  const t=tableRows(), cfg=t.cfg, active=t.active, low=t.low, rows=t.rows;
  $('tblTitle').textContent='League table · '+cfg.l;
  const inAll=TEAMS.length;
  $('tblFoot').textContent=rows.length+' of '+inAll+' teams with a season aggregate (mv_team_all) · '+scopeName();
  if(!rows.length){
    $('tblBody').innerHTML=emptyState('No teams in this view',noRowsReason('teams'),LG_SCOPE!=='ALL'?['all','Show all leagues']:null);
    return;
  }
  const vals=rows.map(function(r){return Math.abs(+r[active])});
  const mx=Math.max.apply(null,vals)||1, mn=Math.min.apply(null,vals);
  const cap=TSORT.col
    ? ('Sorted by '+((COL[TSORT.col]||{}).l||TSORT.col)+', '+
       (TSORT.dir===1?((COL[TSORT.col]||{}).low?'lowest first':'highest first')
                     :((COL[TSORT.col]||{}).low?'highest first':'lowest first'))+
       '. Press the header again to reverse, a third time to reset.')
    : cfg.cap;
  let h='<p class="fs-note tbl-cap">'+esc(cap)+'</p>'+
    '<div class="fs-table-wrap tbl-scroll" tabindex="0" role="region" aria-label="League table, scrollable"><table class="fs-table"><thead><tr>'+
    '<th class="num" scope="col">#</th><th scope="col">Club</th>'+
    cfg.cols.map(function(c){
      const m=COL[c]||{};
      return '<th scope="col" class="num'+(c===active?' is-sorted':'')+'" aria-sort="'+(c===active?t.order:'none')+'"'+
             ' title="'+esc(m.d||'')+(m.low?' · lower is better':'')+'">'+
             '<button type="button" data-sort="'+c+'" aria-label="Sort by '+esc(m.l||c)+': '+esc(m.d||'')+'">'+esc(m.l||c)+'</button></th>';
    }).join('')+
    '<th scope="col" class="barc" title="Bar length is the ranked column relative to the range of the teams shown"><span class="fs-note">Range</span></th>'+
    '</tr></thead><tbody>';
  rows.forEach(function(r,i){
    const v=Math.abs(+r[active]);
    const frac=mx===mn?1:( low ? (mx-v)/(mx-mn) : (v-mn)/(mx-mn) );
    const href='teams.html?team='+encodeURIComponent(r.team);
    h+='<tr data-href="'+esc(href)+'">'+
      '<td class="rk num">'+(i+1)+'</td>'+
      '<td class="nm"><a href="'+esc(href)+'">'+esc(tname(r.team))+'</a></td>'+
      cfg.cols.map(function(c){
        return '<td class="num'+(c===active?' hot':'')+'">'+fmtCol(r[c],c)+'</td>';
      }).join('')+
      '<td class="barc"><span class="fs-bar" aria-hidden="true"><i style="width:'+Math.round(6+frac*94)+'%"></i></span></td></tr>';
  });
  $('tblBody').innerHTML=h+'</tbody></table></div>';
}

/* ---------- leaders ---------- */
const LDS=[
 {k:'xg_90',          l:'xG',      d:'Expected goals per 90, including penalties; non-penalty xG is under review'},
 {k:'xt_90',          l:'xT',      d:'Expected Threat added per 90 by passing and carrying'},
 {k:'prog_carries_90',l:'Carries', d:'Progressive carries per 90'},
 {k:'key_pass_90',    l:'Key P',   d:'Passes that created a shot, per 90'},
 {k:'padj_def_90',    l:'Defence', d:'Defensive actions per 90, adjusted for how much possession the team concedes'}
];
function ldMeta(k){return LDS.filter(function(l){return l.k===(k||LD)})[0]||{}}
function sortLd(c){cycleSort(LSORT,c);loadLeaders()}
/* LD_OK is the last metric that actually loaded; a failed switch falls back to
   it so the last good table stays on screen under the error. */
let LD_SEQ=0, LD_OK=null;
function leaderRows(){
  let rows=(LEAD[LD]||[]).filter(function(r){return teamInScope(r.team)}).slice();
  if(LSORT.col){
    const c=LSORT.col;
    rows.sort(function(a,b){
      let av,bv;
      if(c==='name'){av=(a.name||'').toLowerCase();bv=(b.name||'').toLowerCase()}
      else if(c==='team'){av=tname(a.team).toLowerCase();bv=tname(b.team).toLowerCase()}
      else if(c==='pool'){av=a.pool||'';bv=b.pool||''}
      else {av=a.v;bv=b.v}
      if(av<bv)return LSORT.dir===1?1:-1;
      if(av>bv)return LSORT.dir===1?-1:1;
      return 0;});
  }
  return rows;
}
async function loadLeaders(){
  const want=LD, seq=++LD_SEQ;
  if(!LEAD[want])$('ldBody').innerHTML=skelRows(9);
  try{
    if(!LEAD[want]){
      const rows=await sbAll('mv_player_percentiles',{metric:'eq.'+want,select:'player_id,pool,value,pct'});
      const pm={};PLAYERS.forEach(function(p){pm[p.id]=p});
      LEAD[want]=rows.map(function(r){const p=pm[r.player_id]||{};
        return{id:r.player_id,name:p.name,team:p.team,pool:r.pool,v:+r.value,pct:+r.pct}})
        .filter(function(r){return r.name}).sort(function(a,b){return b.v-a.v});
    }
    if(seq!==LD_SEQ)return;
    LD_OK=want;
    renderLeaders('');
  }catch(e){
    if(seq!==LD_SEQ)return;
    const name=ldMeta(want).l||want;
    if(LD_OK&&LD_OK!==want&&LEAD[LD_OK]){
      LD=LD_OK;renderSegs();
      renderLeaders(banner('Could not load '+name+' leaders: '+e.message+'. Nothing changed; the table below is still '+(ldMeta(LD_OK).l||LD_OK)+'.',want));
    }else{
      $('ldTitle').textContent='Player leaders · '+name;
      $('ldFoot').textContent='';
      $('ldBody').innerHTML=banner('Could not load '+name+' leaders: '+e.message+'. Nothing else on the page changed.',want);
    }
  }
}
function renderLeaders(prefix){
  const meta=ldMeta();
  const all=leaderRows(), rows=all.slice(0,12);
  $('ldTitle').textContent='Player leaders · '+(meta.l||'');
  $('ldFoot').textContent=(rows.length<all.length?'Top '+rows.length+' of ':'')+nf(all.length)+' players with a value and a season row · '+scopeName()+' · any role';
  if(!rows.length){

    return;
  }
  const mx=Math.max.apply(null,rows.map(function(r){return r.v}))||1;
  function th(col,label,title,cls){
    const on=LSORT.col===col||(col==='v'&&!LSORT.col);
    /* dir 1 sorts high to low (Z to A on text), as it always has. */
    const order=on?((LSORT.col?LSORT.dir:1)===1?'descending':'ascending'):'none';
    return '<th scope="col" class="'+(cls||'')+(on?' is-sorted':'')+'" aria-sort="'+order+'" title="'+esc(title)+'">'+
      '<button type="button" data-sort="'+col+'" aria-label="Sort by '+esc(label)+'">'+esc(label)+'</button></th>';
  }
  let h=prefix+'<p class="fs-note tbl-cap">'+esc(meta.d||'')+'. Top 12 '+(LG_SCOPE==='ALL'?'across all leagues':'in the selected league')+', any role.</p>'+
    '<div class="fs-table-wrap tbl-scroll" tabindex="0" role="region" aria-label="Player leaders, scrollable"><table class="fs-table"><thead><tr>'+
    '<th class="num" scope="col">#</th>'+
    th('name','Player','Sort by player name')+
    th('pool','Role','Role pool the player is ranked in')+
    th('v',meta.l||'',meta.d||'','num')+
    '<th scope="col" class="barc" title="Bar length is the value relative to the highest value shown"><span class="fs-note">Vs top</span></th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    const href='players.html?player='+encodeURIComponent(r.id);
    h+='<tr data-href="'+esc(href)+'">'+
      '<td class="rk num">'+(i+1)+'</td>'+
      '<td class="nm"><a href="'+esc(href)+'">'+esc(r.name)+'</a><small>'+esc(tname(r.team))+'</small></td>'+
      '<td><span class="fs-tag">'+esc(r.pool)+'</span></td>'+
      '<td class="num hot">'+r.v.toFixed(r.v<1?3:2)+'</td>'+
      '<td class="barc"><span class="fs-bar" aria-hidden="true"><i style="width:'+Math.max(0,Math.round(r.v/mx*100))+'%"></i></span></td></tr>';
  });
  $('ldBody').innerHTML=h+'</tbody></table></div>';
}

/* Rows, sort headers, retries and empty-state actions, by delegation. */
function panelClick(sorter){
  return function(ev){
    const s=ev.target.closest('button[data-sort]');
    if(s){sorter(s.dataset.sort);
      const again=this.querySelector('button[data-sort="'+s.dataset.sort+'"]');if(again)again.focus();return}
    const rt=ev.target.closest('button[data-retry]');
    if(rt){pickLd(rt.dataset.retry);return}
    const act=ev.target.closest('button[data-act]');
    if(act){if(act.dataset.act==='all')setScope('ALL');else init();return}
    if(ev.target.closest('a'))return;
    const tr=ev.target.closest('tr[data-href]');
    if(tr)location.href=tr.dataset.href;
  };
}
$('tblBody').addEventListener('click',panelClick(sortTbl));
$('ldBody').addEventListener('click',panelClick(sortLd));

/* ---------- exports ----------
   PNG and PDF go through the shared capture, which renders on its own
   fs-light stage and stamps snapshot, export time and source; this page
   supplies entity, scope and population. CSV is written here so it can carry
   its scope and snapshot line and the full, uncapped row list. */
function snapText(){
  const s=FS&&FS.snapshot&&FS.snapshot();
  return s?s.text+' ('+s.age+(s.stale?', marked stale':'')+'; '+s.snapshot+')':'not reported to this page';
}
window.futScoutExportContext=function(card){
  const ctx={};
  if(card&&card.id==='ldPanel'){
    const m=ldMeta(), all=leaderRows();
    ctx.entity='Player leaders, '+(m.l||LD)+' ('+(m.d||'')+')';
    ctx.scope=scopeName();
    ctx.population='Top '+Math.min(12,all.length)+' of '+all.length+' players with a value and a season row, any role';
  }else{
    const t=tableRows();
    ctx.entity='League table, '+t.cfg.l+' view';
    ctx.scope=scopeName();
    ctx.population=t.rows.length+' of '+TEAMS.length+' teams with a season aggregate';
    ctx['sorted by']=((COL[t.active]||{}).l||t.active)+', '+t.order;
  }
  return ctx;
};
function csvCell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}
function exportCsv(which){
  let title,head,rows,note='';
  if(which==='ld'){
    const m=ldMeta(), all=leaderRows();
    title='Player leaders, '+(m.l||LD);
    note='All '+all.length+' players in scope, in the on-screen order (the screen shows the top 12)';
    head=['Rank','Player','Team','Role pool',(m.l||LD)+' per 90'];
    rows=all.map(function(r,i){return[i+1,r.name,tname(r.team),r.pool,r.v]});
  }else{
    const t=tableRows();
    title='League table, '+t.cfg.l+' view';
    note=t.rows.length+' teams, sorted by '+((COL[t.active]||{}).l||t.active)+' '+t.order;
    head=['Rank','Club'].concat(t.cfg.cols.map(function(c){return (COL[c]||{}).l||c}));
    rows=t.rows.map(function(r,i){return[i+1,tname(r.team)].concat(t.cfg.cols.map(function(c){return r[c]==null?'':r[c]}))});
  }
  if(!rows.length){if(FS)FS.toast('Nothing to export: no rows in this scope');return}
  const line='FutScout · '+title+' · League scope: '+scopeName()+' · Data snapshot: '+snapText()+
    ' · '+note+' · Exported: '+new Date().toISOString()+' · Source: '+location.href;
  const out=[csvCell(line),head.map(csvCell).join(',')].concat(rows.map(function(r){return r.map(csvCell).join(',')}));
  const url=URL.createObjectURL(new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url;a.download='futscout-'+title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
  if(FS)FS.toast('CSV exported · '+rows.length+' rows');
}
document.addEventListener('click',function(ev){
  const b=ev.target.closest('button[data-exp]');if(!b)return;
  const card=$(b.dataset.exp==='ld'?'ldPanel':'tblPanel');
  if(b.dataset.format==='csv'){exportCsv(b.dataset.exp);return}
  if(!card.querySelector('table')){if(FS)FS.toast('Nothing to export: no rows in this scope');return}
  if(!window.FutScoutExports){if(FS)FS.toast('Export unavailable: shared export code did not load');return}
  window.FutScoutExports.capture(card,b.dataset.format,b);
  if(FS)FS.toast(b.dataset.format.toUpperCase()+' export started');
});

renderSegs();
init();
</script>
